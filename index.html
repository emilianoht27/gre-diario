 covered by the state.","Daytime burglary will not increase in the affected neighborhoods.","The lower burglary rates in well-lit neighborhoods are at least partly caused by the streetlights."],"answer":4,"solution":"1) La predicción pasa de una correlación (más luces, menos robos) a una causa.\n2) Si la luz no causa nada, agregar luces no reduciría los robos → E es la suposición necesaria.\nPor qué no D: la predicción habla solo de robos nocturnos.\nEstrategia GRE: niega la opción; si el argumento se cae, es la suposición."},{"type":"rc","pid":"P6","topic":"Lectura: propósito","difficulty":"media","stem":"The primary purpose of the passage is to","options":["argue that Victorian novels are more realistic than modern ones","explain the effects of serial publication on Victorian plots","criticize Victorian readers for preferring suspense to plausibility","trace the decline of religious belief in the nineteenth century","offer an alternative interpretation of a feature commonly regarded as a flaw"],"answer":4,"solution":"1) Las coincidencias suelen verse como defecto; el autor propone leerlas como expresión de la idea de providencia.\nPor qué no B: la publicación por entregas es la explicación de otros críticos, no el foco del autor."},{"type":"rc","pid":"P6","topic":"Lectura: inferencia","difficulty":"difícil","stem":"The author would most likely agree that the modern critics mentioned in the passage","options":["underestimate the influence of serial publication","are correct that coincidences are lapses of craft","have ignored Victorian fiction entirely","apply a standard that the novelists may not have shared","share the Victorians' belief in providence"],"answer":3,"solution":"1) La última oración dice que esos críticos juzgan con un realismo que los novelistas quizá no buscaban.\nPor qué no B: el autor cuestiona precisamente esa idea."},{"type":"rc","pid":"P6","multi":true,"topic":"Lectura: detalle","difficulty":"media","stem":"According to the passage, modern critics have attributed Victorian coincidences to which of the following?","options":["The demands of serial publication","A reading public that valued suspense over plausibility","A belief in providence"],"answer":[0,1],"solution":"1) A ✓ y B ✓: el texto las presenta como explicaciones de los críticos modernos.\n2) C ✗: la providencia es la interpretación alternativa del autor, no la de esos críticos."}]};
/* ---------------- local storage ---------------- */
const LS = 'gre-diario-v2';
const DEFAULTS = { days:[0,1,2,3,4,5,6], perDay:10, quantPct:50, types:['qc','mc','ms','ne','tc','se','rc'], difficulty:'mixta', timed:true, focus:'' };
function loadDB(){ let d; try{ d = JSON.parse(localStorage.getItem(LS)) || {}; }catch(e){ d = {}; }
  d.settings = Object.assign(clone(DEFAULTS), d.settings || {}); d.sets = d.sets || {}; d.extra = d.extra || []; d.seen = d.seen || {}; return d; }
let DB = loadDB();
let storageOK = true;
function save(){ try{ localStorage.setItem(LS, JSON.stringify(DB)); storageOK = true; }catch(e){ if(storageOK) toast('No se pudo guardar en este dispositivo.'); storageOK = false; } }

/* ---------------- bank ---------------- */
const BASE = (function(){ const out = []; const P = BANK.passages || {};
  (BANK.items || []).forEach((it, i) => { const q = Object.assign({}, it); if(q.pid && P[q.pid]) q.passage = P[q.pid]; q.id = 'b' + String(i+1).padStart(3,'0'); out.push(normalizeItem(q)); });
  return out; })();
function allItems(){ return BASE.concat(DB.extra); }
function groupKey(q){ if(q.type !== 'rc') return q.id; if(q.pid) return 'p:' + q.pid; let hsh = 0; const s = q.passage || ''; for(let i=0;i<s.length;i++){ hsh = (hsh*31 + s.charCodeAt(i)) | 0; } return 'h:' + hsh; }
function stemKey(q){ return norm((q.passage||'').slice(0,60) + '|' + (q.stem||'') + '|' + (q.quantityA||'') + '|' + (q.quantityB||'')); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }

/* ---------------- state ---------------- */
const S = { sample:null, view:'home', tab:'home', run:null, resultsId:null, onlyWrong:false, gen:{busy:false,msg:'',pct:0,err:'',ctl:null}, packCount:20, importMsg:null };

/* ---------------- schedule & selection ---------------- */
function setsSorted(){ return Object.entries(DB.sets).map(([id,x]) => Object.assign({id}, x)).sort((a,b) => (b.date + (b.createdAt||'')).localeCompare(a.date + (a.createdAt||''))); }
function isScheduled(d){ return DB.settings.days.includes(d.getDay()); }
function setMinutes(qs){ return Math.round(qs.reduce((a,q) => a + (TYPES[q.type].sec === 'Q' ? 105 : 90), 0) / 60); }
function scoreOf(set){ const qs = set.questions || []; let c = 0, cq = 0, tq = 0, cv = 0, tv = 0;
  qs.forEach((q,i) => { const ok = isCorrect(q, (set.answers||{})[i]); if(ok) c++; if(TYPES[q.type].sec === 'Q'){ tq++; if(ok) cq++; } else { tv++; if(ok) cv++; } });
  return {c, t:qs.length, cq, tq, cv, tv}; }
function missedTopics(){
  const cnt = {};
  setsSorted().filter(s => s.status === 'done').slice(0, 10).forEach(s => (s.questions||[]).forEach((q,i) => { if(!isCorrect(q, (s.answers||{})[i]) && q.topic) cnt[q.topic] = (cnt[q.topic]||0) + 1; }));
  return Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0, 6).map(x => x[0]);
}
function poolFor(sec){
  const st = DB.settings;
  return allItems().filter(q => TYPES[q.type].sec === sec && st.types.includes(q.type) && (st.difficulty === 'mixta' || norm(q.difficulty) === (st.difficulty === 'dificil' ? 'dificil' : 'media')));
}
function unseenCount(sec){ return poolFor(sec).filter(q => !DB.seen[q.id]).length; }
function pickUnits(sec, n){
  if(n <= 0) return [];
  const weak = new Set(missedTopics()); const focus = norm(DB.settings.focus);
  const units = {};
  for(const q of poolFor(sec)){ const k = groupKey(q); (units[k] = units[k] || []).push(q); }
  const scored = Object.values(units).map(items => {
    const fresh = items.filter(q => !DB.seen[q.id]);
    const missed = items.filter(q => DB.seen[q.id] && DB.seen[q.id].ok === false);
    const use = fresh.length ? fresh : (missed.length ? missed : items);
    let score = fresh.length ? 1000 : missed.length ? 500 : 0;
    if(use.some(q => weak.has(q.topic))) score += 60;
    if(focus && use.some(q => focus.split(/[,;]/).some(f => f.trim() && norm(q.topic).includes(f.trim())))) score += 80;
    if(!fresh.length) score -= Math.min(400, use.reduce((a,q) => a + ((DB.seen[q.id]||{}).n||0), 0) * 20);
    return {use, score: score + Math.random() * 50};
  }).sort((a,b) => b.score - a.score);
  const out = [];
  for(const u of scored){ if(out.length >= n) break; out.push(...u.use.slice(0, n - out.length)); }
  return out;
}
function buildSet(date, extra){
  const st = DB.settings; const n = Math.max(1, Math.min(40, st.perDay|0));
  const hasQ = st.types.some(t => TYPES[t].sec === 'Q'), hasV = st.types.some(t => TYPES[t].sec === 'V');
  if(!hasQ && !hasV){ toast('Activa al menos un tipo de ejercicio en Ajustes.'); return null; }
  let nq = hasQ ? (hasV ? Math.round(n * st.quantPct / 100) : n) : 0; const nv = n - nq;
  const qs = pickUnits('Q', nq).concat(pickUnits('V', nv));
  if(!qs.length){ toast('No hay ejercicios con esos ajustes. Revisa tipos y dificultad.'); return null; }
  const id = 'set-' + date + (extra ? '-x' + Date.now().toString(36) : '');
  DB.sets[id] = {date, createdAt:new Date().toISOString(), status:'pending', questions:clone(qs), answers:{}, idx:0, extra:!!extra};
  save(); return id;
}
function ensureToday(){
  const today = dkey();
  if(isScheduled(new Date()) && !Object.values(DB.sets).some(s => s.date === today && !s.extra)) buildSet(today, false);
}

const SPEC = `ITEM JSON FORMAT (one object per item):
{"type": "qc" | "mc" | "ms" | "ne" | "tc" | "se" | "rc",
 "topic": short topic label in Spanish (e.g. "Porcentajes", "Geometría: triángulos", "Vocabulario en contexto", "Lectura: inferencia"),
 "difficulty": "media" | "difícil",
 "passage": reading passage (rc only; repeat the full passage in every item that uses it),
 "stem": the question text ("" allowed only for qc),
 "info": centered given information (qc only, else ""),
 "quantityA": "...", "quantityB": "..." (qc only),
 "options": answer choices (mc: exactly 5; ms: 3 to 7; se: exactly 6; rc single: exactly 5; rc multi: exactly 3; qc/ne/tc: []),
 "blanks": choices per blank (tc only: 1 blank → [[5 choices]]; 2 or 3 blanks → 3 choices each),
 "multi": true only for rc "select all that apply" items,
 "answer": qc/mc/rc-single → 0-based index; ms/se/rc-multi → array of 0-based indices; tc → array with one 0-based index per blank; ne → exact number as a string ("12", "0.75", "3/4"),
 "tolerance": "" (ne only, if rounding is asked),
 "solution": step-by-step procedure in SPANISH}
qc answer codes: 0 = Quantity A is greater, 1 = Quantity B is greater, 2 = equal, 3 = the relationship cannot be determined.`;
function packPrompt(count){
  const st = DB.settings; const hasQ = st.types.some(t => TYPES[t].sec === 'Q'), hasV = st.types.some(t => TYPES[t].sec === 'V');

  const weak = missedTopics();
  const have = [...new Set(allItems().map(q => q.topic).filter(Boolean))].slice(0, 60);
  const diff = st.difficulty === 'media' ? 'medium' : st.difficulty === 'dificil' ? 'hard (like the harder GRE second section)' : 'a realistic mix: about 30% easy-medium, 40% medium, 30% hard';
  return `Act as a senior GRE General Test item writer who knows the official ETS specifications. Write ${count} ORIGINAL practice items (${nq} Quantitative Reasoning, ${nv} Verbal Reasoning) that mirror real GRE items in format, scope, wording and difficulty, without copying or paraphrasing published ETS items.

Allowed types: ${st.types.map(t => t + ' = ' + names[t]).join('; ')}. Use a realistic GRE mix among them.
Difficulty: ${diff}.
Language: passages, stems and options in English, exactly as on the GRE. Solutions in Spanish.
${st.focus ? 'Emphasize: ' + st.focus + '.\n' : ''}${weak.length ? 'I recently missed items on: ' + weak.join(', ') + '. Include several items on these.\n' : ''}Topics I already have plenty of (vary away from repeating them): ${have.join(', ')}.

Rules:
- Each item must have exactly one defensible key (for multi-answer types, exactly the keyed set). Solve every item twice by different methods before including it; drop any you are not fully sure of.
- Text Completion: mark blanks "_____ (i)", "_____ (ii)", "_____ (iii)". Sentence Equivalence: exactly two choices that give sentences alike in meaning; no other pair may work.
- Multi-answer quant items say "Indicate all such ..." in the stem.
- Plain text only: x², √, π, ≤, ≥, ×, ÷, fractions as a/b. No LaTeX, no images; describe any figure in words.
- solution (Spanish): numbered steps "1) … 2) …" with every calculation or reasoning step, then "Por qué no las otras:" for the most tempting wrong choice, and "Estrategia GRE:" when useful. Under 160 words.

${SPEC}

}
function parsePack(text){
  let t = String(text || '').trim(); if(!t) return {items:[], bad:0, dup:0, error:'Pega primero la respuesta de Claude.'};
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence) t = fence[1];
  let data = null; try{ data = JSON.parse(t); }catch(e){ const a = t.indexOf('['), b = t.lastIndexOf(']'); if(a >= 0 && b > a){ try{ data = JSON.parse(t.slice(a, b+1)); }catch(e2){} } }
  if(data && !Array.isArray(data)) data = Array.isArray(data.items) ? data.items : null;
  if(!Array.isArray(data)) return {items:[], bad:0, dup:0, error:'No encontré una lista de ejercicios en el texto. Copia la respuesta completa de Claude, incluido el bloque de código.'};
  const known = new Set(allItems().map(stemKey)); const items = []; let bad = 0, dup = 0;
  for(const raw of data){ let q; try{ q = normalizeItem(Object.assign({}, raw)); }catch(e){ bad++; continue; }
    if(!validItem(q)){ bad++; continue; } const k = stemKey(q); if(known.has(k)){ dup++; continue; } known.add(k);
    q.id = 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); delete q.pid; items.push(q); }
  return {items, bad, dup};
}

const CHUNK = 6;
async function generateHere(count){
  if(S.gen.busy || !S.sample) return;
  S.gen = {busy:true, msg:'Escribiendo ejercicios…', pct:5, err:'', ctl:new AbortController()}; renderKeep();
  const chunks = []; let left = count; while(left > 0){ chunks.push(Math.min(CHUNK, left)); left -= CHUNK; }
  let added = 0, dropped = 0;
  try{
    for(let ci = 0; ci < chunks.length; ci++){
      const c = chunks[ci];
      const setp = (m, p) => { S.gen.msg = m; S.gen.pct = p; const a = document.getElementById('genmsg'); if(a) a.textContent = m; const b = document.getElementById('genbar'); if(b) b.style.width = p + '%'; };
      setp(`Escribiendo lote ${ci+1} de ${chunks.length}…`, 5 + Math.round(ci/chunks.length*90));
      let raw = await S.sample.json(packPrompt(c + 2).replace(/Reply with ONLY one JSON array[\s\S]*$/, 'Reply with ONLY the JSON array.'), {modelTier:'complex', signal:S.gen.ctl.signal, cache:false});
      const r = parsePack(JSON.stringify(Array.isArray(raw) ? raw : (raw && raw.items) || []));
      setp(`Verificando lote ${ci+1} de ${chunks.length}…`, 5 + Math.round((ci+0.5)/chunks.length*90));
      if(!r.items.length){ dropped += c; continue; }
      let checks = await S.sample.json(verifyPrompt(r.items), {modelTier:'complex', signal:S.gen.ctl.signal, cache:false});
      if(!Array.isArray(checks)) checks = [];
      const byI = {}; checks.forEach(x => { if(x && Number.isInteger(x.i)) byI[x.i] = x.answer; });
      const ok = r.items.filter((q,i) => keyMatches(q, byI[i])).slice(0, c);
      dropped += r.items.length - ok.length; addToBank(ok); added += ok.length;
    }
    S.gen = {busy:false,msg:'',pct:0,err:'',ctl:null}; toast(`Agregados ${added} ejercicios verificados` + (dropped ? `; ${dropped} descartados.` : '.'));
  }catch(e){ S.gen = {busy:false,msg:'',pct:0,err: e && e.code === 'cancelled' ? (added ? `Se agregaron ${added} antes de cancelar.` : '') : sampleErr(e),ctl:null}; }
  if(S.view !== 'run') renderKeep();
}
function verifyPrompt(items){
  const stripped = items.map((q,i) => { const o = {i, type:q.type}; for(const k of ['passage','info','quantityA','quantityB','stem','options','blanks','multi','tolerance']) if(q[k] != null && q[k] !== '' && !(Array.isArray(q[k]) && !q[k].length)) o[k] = q[k]; return o; });
  return `You are checking GRE practice items before a student sees them. Solve each item independently and carefully. If an item is ambiguous, flawed, or has more than one defensible answer (beyond the keyed set for multi-answer types), return "flag".
Encoding: qc/mc/rc-single → 0-based index (qc: 0 = A greater, 1 = B greater, 2 = equal, 3 = cannot be determined); ms/se/rc with multi=true → array of 0-based indices; tc → array with one index per blank; ne → exact number as a string.
Items:
${JSON.stringify(stripped)}
Reply with ONLY a JSON array like [{"i":0,"answer":2},{"i":1,"answer":[0,3]}].`;

function sampleErr(e){
  const c = e && e.code;
  if(c === 'not_granted') return 'Para generar aquí necesitas permitir que la página consulte a Claude. También puedes usar "Pedir más a Claude".';

  S.run = { id, qs: s.questions, answers: clone(s.answers || {}), marked: clone(s.marked || {}), idx: Math.min(s.idx || 0, s.questions.length - 1),

    h('div',{class:'calc-d','aria-live':'polite'}, h('span',{class:'m',id:'calcm'}), h('span',{id:'calcv',text:C.entry})),
    h('div',{class:'calc-g'}, keys.map(k => h('button',{class: k === '=' ? 'eq' : '', text:k, 'aria-label': {'√':'Square root','±':'Change sign','CE':'Clear entry','C':'Clear all'}[k] || k, onclick:()=>calcPress(k)}))),
    h('button',{class:'btn calc-t',id:'calctr',text:'Transfer Display',onclick:()=>{ const rr = S.run, qq = rr.qs[rr.idx]; if(qq.type !== 'ne' || C.err) return; rr.answers[rr.idx] = C.entry; const inp = document.getElementById('numans'); if(inp) inp.value = C.entry; persist(); }}));
  const W = window.innerWidth, H = window.innerHeight;
  if(C.x == null){ C.x = Math.max(8, W - 280); C.y = Math.max(60, Math.min(120, H - 420)); }
  C.x = Math.min(Math.max(0, C.x), Math.max(0, W - 262)); C.y = Math.min(Math.max(0, C.y), Math.max(0, H - 80));
  el.style.left = C.x + 'px'; el.style.top = C.y + 'px';
  let drag = null;
  head.addEventListener('pointerdown', e => { if(e.target.tagName === 'BUTTON' || window.innerWidth <= 560) return; drag = {sx:e.clientX, sy:e.clientY, x:C.x, y:C.y}; head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', e => { if(!drag) return; C.x = Math.min(Math.max(0, drag.x + e.clientX - drag.sx), window.innerWidth - 60); C.y = Math.min(Math.max(0, drag.y + e.clientY - drag.sy), window.innerHeight - 40); el.style.left = C.x + 'px'; el.style.top = C.y + 'px'; });
  head.addEventListener('pointerup', () => { drag = null; });
  el.addEventListener('keydown', e => { const map = {'+':'+','-':'−','*':'×','/':'÷','Enter':'=','=':'=','Escape':'C','Backspace':'CE','.':'.','(':'(',')':')'};
    if(/^[0-9]$/.test(e.key)){ calcPress(e.key); e.preventDefault(); } else if(map[e.key]){ calcPress(map[e.key]); e.preventDefault(); } });
  document.body.append(el); refreshTransfer(); updCalc();
}
function refreshTransfer(){ const b = document.getElementById('calctr'); if(!b) return; const r = S.run; const q = r && r.qs[r.idx]; b.hidden = !(q && q.type === 'ne'); }


/* ---------------- boot ---------------- */
document.addEventListener('visibilitychange', () => { if(document.hidden){ if(S.run) flush(); } else if(S.view !== 'run'){ render(); } });
window.addEventListener('pagehide', () => { if(S.run) flush(); });
render();
(async () => { if(window.claude && typeof window.claude.use === 'function'){ try{ S.sample = await window.claude.use('sample'); }catch(e){ S.sample = null; } if(S.sample && S.tab === 'bank' && S.view !== 'run') renderKeep(); } })();
try{ if('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
})();
</script>
