 0.16 = 0.64 (multiplicar en lugar de dividir).\nPara la próxima: si a/x = b, entonces x = a/b. Quita los decimales antes de dividir.","cat":"alg"},{"type":"ne","topic":"Promedios","difficulty":"media","stem":"The average (arithmetic mean) of six numbers is 15. When one of the numbers is removed, the average of the remaining five numbers is 14. What number was removed?","answer":"20","solution":"Idea clave: con promedios, trabaja con sumas: suma = promedio × cantidad.\nPaso a paso:\n1) Suma de los 6 = 6 × 15 = 90.\n2) Suma de los 5 restantes = 5 × 14 = 70.\n3) El número quitado = 90 − 70 = 20.\nCómo comprobarlo: si quitas un número mayor que el promedio (20 > 15), el promedio debe bajar. Bajó de 15 a 14 ✓.\nTrampa: restar los promedios (15 − 14 = 1).\nPara la próxima: cualquier problema de \"se agrega o se quita un valor\" se resuelve con sumas totales.","cat":"est"},{"type":"ne","topic":"Geometría: rectángulos","difficulty":"media","stem":"The length of a rectangle is 3 more than its width, and its area is 70. What is the perimeter of the rectangle?","answer":"34","solution":"Idea clave: traduce el texto a una ecuación y resuélvela factorizando.\nPaso a paso:\n1) Ancho = w, largo = w + 3. Área: w(w + 3) = 70.\n2) w² + 3w − 70 = 0 → busca dos números con producto −70 y suma 3: 10 y −7 → (w + 10)(w − 7) = 0.\n3) w = 7 (no puede ser negativo). Largo = 10.\n4) Perímetro = 2(7 + 10) = 34.\nCómo comprobarlo: 7 × 10 = 70 ✓ y 10 − 7 = 3 ✓.\nTrampa: contestar el área o el largo; te piden el perímetro.\nPara la próxima: puedes probar pares de factores de 70 (1×70, 2×35, 5×14, 7×10) hasta encontrar dos que difieran en 3.","cat":"geo"},{"type":"ne","topic":"Conteo: múltiplos","difficulty":"difícil","stem":"How many integers from 1 to 100, inclusive, are multiples of 3 or multiples of 5 (or both)?","answer":"47","solution":"Idea clave: principio de inclusión-exclusión: |A o B| = |A| + |B| − |A y B|.\nPaso a paso:\n1) Múltiplos de 3 entre 1 y 100: ⌊100/3⌋ = 33.\n2) Múltiplos de 5: ⌊100/5⌋ = 20.\n3) Múltiplos de ambos, es decir, de 15: ⌊100/15⌋ = 6. Esos se contaron dos veces.\n4) Total: 33 + 20 − 6 = 47.\nCómo comprobarlo: hasta 15 hay 3, 5, 6, 9, 10, 12, 15 = 7 números. 7 × 6 bloques de 15 = 42 (hasta 90); de 91 a 100 se suman 93, 95, 96, 99, 100 = 5 → 47 ✓.\nTrampa: no restar la intersección (53).\nPara la próxima: \"A o B\" siempre lleva resta de la intersección. La intersección de \"múltiplos de a\" y \"múltiplos de b\" son los múltiplos del mínimo común múltiplo.","cat":"prob"},{"type":"ne","topic":"Probabilidad: monedas","difficulty":"media","stem":"A fair coin is flipped 3 times. What is the probability of getting exactly 2 heads? Give your answer as a fraction.","answer":"3/8","solution":"Idea clave: probabilidad = casos favorables / casos totales. Con n monedas hay 2ⁿ resultados equiprobables.\nPaso a paso:\n1) Total: 2³ = 8.\n2) Exactamente 2 caras: elegir cuáles 2 de los 3 lanzamientos son cara = C(3,2) = 3 (HHT, HTH, THH).\n3) P = 3/8.\nCómo comprobarlo: las probabilidades de 0, 1, 2 y 3 caras son 1/8, 3/8, 3/8, 1/8 y suman 1 ✓.\nTrampa: contar solo HHT, como si el orden no importara, y obtener 1/8.\nPara la próxima: P(exactamente k éxitos en n lanzamientos de moneda) = C(n, k)/2ⁿ.","cat":"prob"},{"type":"ne","topic":"Identidades algebraicas","difficulty":"difícil","stem":"If x + 1/x = 5, what is the value of x² + 1/x²?","answer":"23","solution":"Idea clave: eleva al cuadrado la expresión que te dan; el término cruzado x · (1/x) vale 1.\nPaso a paso:\n1) (x + 1/x)² = x² + 2·x·(1/x) + 1/x² = x² + 2 + 1/x².\n2) 5² = 25 = x² + 2 + 1/x².\n3) x² + 1/x² = 23.\nCómo comprobarlo: x = (5 + √21)/2 ≈ 4.79 → x² ≈ 22.96, 1/x² ≈ 0.04 → suma ≈ 23 ✓.\nTrampa: elevar término por término y obtener 25.\nPara la próxima: si ves x + 1/x y te piden x² + 1/x², eleva al cuadrado y resta 2.","cat":"alg"},{"type":"ne","topic":"Proporciones: precio","difficulty":"media","stem":"A store sells pens at a price of 3 pens for $2. At this rate, how many dollars would 27 pens cost?","answer":"18","solution":"Idea clave: una tasa (\"3 por $2\") se escala con una proporción.\nPaso a paso:\n1) 27 plumas = 27/3 = 9 grupos de 3.\n2) Cada grupo cuesta $2 → 9 × 2 = $18.\nCómo comprobarlo: precio por pluma = 2/3. 27 × 2/3 = 18 ✓.\nTrampa: dividir al revés (27 × 3/2 = 40.5).\nPara la próxima: escribe las unidades: (27 plumas) × ($2 / 3 plumas). Las plumas se cancelan y quedan dólares.","cat":"pct"},{"type":"ne","topic":"Polígonos","difficulty":"media","stem":"What is the sum, in degrees, of the interior angles of a hexagon?","answer":"720","solution":"Idea clave: la suma de los ángulos interiores de un polígono de n lados es (n − 2) × 180°.\nPaso a paso:\n1) Hexágono: n = 6.\n2) (6 − 2) × 180 = 720.\nCómo comprobarlo: desde un vértice salen 3 diagonales que dividen el hexágono en 4 triángulos; 4 × 180 = 720.\nTrampa: usar n × 180 o confundir con la suma de exteriores (360).\nPara la próxima: la fórmula sale de dividir el polígono en n − 2 triángulos desde un vértice. Si la olvidas, dibújalo.","cat":"geo"},{"type":"ne","topic":"Tasas de trabajo","difficulty":"media","stem":"Working at the same constant rate, 5 workers produce 60 parts in 4 hours. At this rate, how many parts would 8 workers produce in 6 hours?","answer":"144","solution":"Idea clave: reduce todo a una tasa unitaria (piezas por trabajador por hora) y luego escala.\nPaso a paso:\n1) Trabajador-horas: 5 × 4 = 20.\n2) Tasa: 60/20 = 3 piezas por trabajador-hora.\n3) Nuevo caso: 8 × 6 = 48 trabajador-horas × 3 = 144.\nCómo comprobarlo: por proporción. Más trabajadores (×8/5) y más horas (×6/4) → 60 × (8/5) × (6/4) = 144 ✓.\nTrampa: escalar solo trabajadores o solo horas.\nPara la próxima: piezas = trabajadores × horas × tasa. Calcula primero la tasa.","cat":"pct"},{"type":"ne","topic":"Geometría analítica: distancia","difficulty":"media","stem":"What is the distance between the points (−2, 3) and (4, −5) in the xy-plane?","answer":"10","solution":"Idea clave: la distancia entre dos puntos es la hipotenusa de un triángulo rectángulo cuyos catetos son Δx y Δy.\nPaso a paso:\n1) Δx = 4 − (−2) = 6. Δy = −5 − 3 = −8 → longitud 8.\n2) Distancia = √(6² + 8²) = √100 = 10.\nCómo comprobarlo: 6-8-10 es múltiplo de la terna 3-4-5.\nTrampa: restar mal con negativos (4 − 2 = 2 en lugar de 4 − (−2) = 6).\nPara la próxima: dibuja el triángulo; reconocer una terna te ahorra la raíz.","cat":"geo"},{"type":"ne","topic":"Crecimiento porcentual","difficulty":"difícil","stem":"A town's population grew from 2,000 to 2,420 over two years, increasing by the same percent each year. What was the annual percent increase? (Enter the number of percent.)","answer":"10","solution":"Idea clave: el crecimiento porcentual constante es compuesto: final = inicial × (1 + r)ⁿ.\nPaso a paso:\n1) 2,420/2,000 = 1.21.\n2) (1 + r)² = 1.21 → 1 + r = √1.21 = 1.1 → r = 0.1 = 10%.\nCómo comprobarlo: 2,000 × 1.1 = 2,200; × 1.1 = 2,420 ✓.\nTrampa: dividir el 21% total entre 2 años (10.5%).\nPara la próxima: memoriza 1.1² = 1.21, 1.2² = 1.44 y 1.05² = 1.1025. Aparecen mucho.","cat":"pct"},{"type":"ne","topic":"Estadística: mediana","difficulty":"media","stem":"What is the median of the following numbers?\n12, 5, 9, 21, 7, 15","answer":"10.5","solution":"Idea clave: la mediana es el valor central de la lista ordenada. Con una cantidad par de valores, es el promedio de los dos del centro.\nPaso a paso:\n1) Ordena: 5, 7, 9, 12, 15, 21.\n2) Son 6 valores → los centrales son el 3.º y el 4.º: 9 y 12.\n3) Mediana = (9 + 12)/2 = 10.5.\nCómo comprobarlo: quedan 3 valores por debajo (5, 7, 9) y 3 por encima (12, 15, 21) de 10.5.\nTrampa: tomar el valor central de la lista sin ordenarla (9 o 21).\nPara la próxima: ordena siempre primero. Posición central = (n + 1)/2; si no es entera, promedia los dos vecinos.","cat":"est"},{"type":"ne","topic":"Porcentajes ponderados","difficulty":"difícil","stem":"In a class, 60 percent of the students are women. If 25 percent of the women and 50 percent of the men in the class wear glasses, what percent of the students in the class wear glasses? (Enter the number of percent.)","answer":"35","solution":"Idea clave: promedio ponderado. Cada grupo aporta según su tamaño.\nPaso a paso:\n1) Usa 100 estudiantes: 60 mujeres y 40 hombres.\n2) Mujeres con lentes: 25% de 60 = 15.\n3) Hombres con lentes: 50% de 40 = 20.\n4) Total: 35 de 100 = 35%.\nCómo comprobarlo: el resultado debe estar entre 25% y 50%, más cerca de 25% porque hay más mujeres. 35% lo cumple.\nTrampa: promediar 25% y 50% (37.5%), ignorando que los grupos tienen distinto tamaño.\nPara la próxima: cuando los grupos tienen tamaños distintos, usa un total de 100 y cuenta personas.","cat":"pct"},{"type":"ne","topic":"Geometría: cubos","difficulty":"media","stem":"The volume of a cube is 64. What is the total surface area of the cube?","answer":"96","solution":"Idea clave: volumen de un cubo = lado³; área total = 6 × lado².\nPaso a paso:\n1) lado³ = 64 → lado = 4.\n2) Área total = 6 × 4² = 96.\nCómo comprobarlo: un cubo tiene 6 caras cuadradas de 4 × 4 = 16; 6 × 16 = 96.\nTrampa: dar el área de una sola cara (16).\nPara la próxima: memoriza los cubos 1, 8, 27, 64, 125, 216, 343, 512, 729, 1000.","cat":"geo"},{"type":"mc","gid":"D1","table":{"title":"Enrollment in Four Courses, 2022 and 2023","headers":["Course","2022","2023"],"rows":[["Biology","240","300"],["Chemistry","180","171"],["Physics","120","150"],["Statistics","160","224"]]},"topic":"Interpretación de datos: tablas","difficulty":"media","stem":"By approximately what percent did the total enrollment in the four courses increase from 2022 to 2023?","options":["15%","18%","21%","25%","30%"],"answer":2,"solution":"Idea clave: en interpretación de datos, primero ubica exactamente qué datos necesitas. \"Approximately\" te permite estimar.\nPaso a paso:\n1) Suma la columna 2022: 240 + 180 + 120 + 160 = 700.\n2) Suma la columna 2023: 300 + 171 + 150 + 224 = 845.\n3) Cambio porcentual = (nuevo − viejo)/viejo = 145/700.\n4) 145/700 ≈ 0.207 → 21%.\nCómo comprobarlo: 20% de 700 es 140 y 25% es 175. 145 está muy cerca de 140 → poco más de 20%.\nTrampa: elegir 25%, que es el aumento de Biología o Física por separado, no el total.\nPara la próxima: cambio porcentual = diferencia/valor ORIGINAL. Estima con 10% y 5% del valor original.","cat":"datos"},{"type":"ms","gid":"D1","table":{"title":"Enrollment in Four Courses, 2022 and 2023","headers":["Course","2022","2023"],"rows":[["Biology","240","300"],["Chemistry","180","171"],["Physics","120","150"],["Statistics","160","224"]]},"topic":"Interpretación de datos: tablas","difficulty":"media","stem":"For which of the courses did enrollment increase by more than 20 percent from 2022 to 2023?\n\nIndicate all such courses.","options":["Biology","Chemistry","Physics","Statistics"],"answer":[0,2,3],"solution":"Idea clave: para saber si algo aumentó más de 20%, calcula el 20% del valor original y compáralo con el aumento real.\nPaso a paso:\n1) Biología: 20% de 240 = 48. Aumento real: 60 > 48 ✓.\n2) Química: bajó (180 → 171) ✗.\n3) Física: 20% de 120 = 24. Aumento: 30 > 24 ✓.\n4) Estadística: 20% de 160 = 32. Aumento: 64 > 32 ✓.\nCómo comprobarlo: compara contra el umbral × 1.2 → 240 × 1.2 = 288 < 300 ✓; 120 × 1.2 = 144 < 150 ✓; 160 × 1.2 = 192 < 224 ✓.\nTrampa: comparar aumentos absolutos entre cursos (60 vs 30) en vez de porcentajes.\nPara la próxima: \"más de X%\" se resuelve comparando el valor nuevo con original × (1 + X/100), sin calcular el porcentaje exacto.","cat":"datos"},{"type":"ne","gid":"D1","table":{"title":"Enrollment in Four Courses, 2022 and 2023","headers":["Course","2022","2023"],"rows":[["Biology","240","300"],["Chemistry","180","171"],["Physics","120","150"],["Statistics","160","224"]]},"topic":"Interpretación de datos: tablas","difficulty":"difícil","stem":"In 2023, enrollment in Statistics was what percent of the total enrollment in the four courses? Round your answer to the nearest whole percent.","answer":"27","tolerance":"0.5","solution":"Idea clave: \"A es qué porcentaje de B\" = A/B × 100. Usa el total del año correcto.\nPaso a paso:\n1) Total 2023 = 300 + 171 + 150 + 224 = 845.\n2) 224/845 ≈ 0.2651 → 26.51%.\n3) Redondeado al entero más cercano: 27.\nCómo comprobarlo: 25% de 845 ≈ 211 y 30% ≈ 254. 224 queda un poco por encima de 25% → 26–27%.\nTrampa: dividir entre el total de 2022 (224/700 = 32%).\nPara la próxima: subraya el año o el grupo que piden y usa solo esos datos. El GRE pone opciones con el total equivocado.","cat":"datos"},{"type":"mc","gid":"D2","chart":{"type":"bar","title":"Monthly Revenue of Company X (in thousands of dollars)","categories":["Jan","Feb","Mar","Apr","May","Jun"],"series":[{"name":"2023","values":[40,45,50,48,55,60]},{"name":"2024","values":[44,54,50,60,66,62]}],"yMax":70},"topic":"Interpretación de datos: gráficas","difficulty":"media","stem":"In how many of the months shown was the revenue in 2024 at least 10 percent greater than the revenue in the same month of 2023?","options":["2","3","4","5","6"],"answer":2,"solution":"Idea clave: \"al menos 10% mayor\" significa nuevo ≥ 1.10 × viejo, incluido el caso exacto.\nPaso a paso:\n1) Calcula 1.10 × 2023 para cada mes: Ene 44, Feb 49.5, Mar 55, Abr 52.8, May 60.5, Jun 66.\n2) Compara con 2024: Ene 44 ≥ 44 ✓; Feb 54 ≥ 49.5 ✓; Mar 50 < 55 ✗; Abr 60 ≥ 52.8 ✓; May 66 ≥ 60.5 ✓; Jun 62 < 66 ✗.\n3) Total: 4 meses.\nCómo comprobarlo: el 10% de cada valor es solo mover el punto decimal (10% de 45 = 4.5). Súmalo y compara.\nTrampa: descartar enero, que cumple exactamente; \"at least\" incluye la igualdad.\nPara la próxima: calcula el umbral (valor × 1.1) y compara; es más rápido que sacar cada porcentaje.","cat":"datos"},{"type":"ne","gid":"D2","chart":{"type":"bar","title":"Monthly Revenue of Company X (in thousands of dollars)","categories":["Jan","Feb","Mar","Apr","May","Jun"],"series":[{"name":"2023","values":[40,45,50,48,55,60]},{"name":"2024","values":[44,54,50,60,66,62]}],"yMax":70},"topic":"Interpretación de datos: gráficas","difficulty":"media","stem":"What was the average (arithmetic mean) monthly revenue in 2024 for the six months shown, in thousands of dollars?","answer":"56","solution":"Idea clave: el promedio es la suma entre la cantidad. Lee los valores de la serie correcta.\nPaso a paso:\n1) Valores 2024 (barras de 2024): 44, 54, 50, 60, 66, 62.\n2) Suma: 44 + 54 = 98; + 50 = 148; + 60 = 208; + 66 = 274; + 62 = 336.\n3) 336/6 = 56.\nCómo comprobarlo: usa desviaciones respecto a 56: −12, −2, −6, +4, +10, +6 → suman 0 ✓.\nTrampa: leer la serie de 2023 por confundir los colores.\nPara la próxima: el truco de desviaciones (elige un valor de referencia y suma las diferencias) evita sumas largas.","cat":"datos"},{"type":"qc","gid":"D2","chart":{"type":"bar","title":"Monthly Revenue of Company X (in thousands of dollars)","categories":["Jan","Feb","Mar","Apr","May","Jun"],"series":[{"name":"2023","values":[40,45,50,48,55,60]},{"name":"2024","values":[44,54,50,60,66,62]}],"yMax":70},"topic":"Interpretación de datos: gráficas","difficulty":"difícil","info":"Refer to the graph.","quantityA":"The percent increase in revenue from January to June in 2023","quantityB":"The percent increase in revenue from January to June in 2024","answer":0,"solution":"Idea clave: el aumento porcentual depende de la base. Una cifra más grande no implica un porcentaje más grande.\nPaso a paso:\n1) 2023: de 40 a 60 → aumento 20 → 20/40 = 50%.\n2) 2024: de 44 a 62 → aumento 18 → 18/44 ≈ 41%.\n3) A mayor.\nCómo comprobarlo: 2023 creció 1.5 veces (60/40); 2024 creció 62/44 ≈ 1.41 veces.\nTrampa: elegir B porque los valores de 2024 son más altos.\nPara la próxima: compara razones (final/inicial) en lugar de diferencias.","cat":"datos"},{"type":"mc","gid":"D3","chart":{"type":"line","title":"Visitors to Lakeside Park, 2018–2023 (in thousands)","categories":["2018","2019","2020","2021","2022","2023"],"series":[{"name":"Visitors","values":[50,55,30,42,63,70]}],"yMax":80},"topic":"Interpretación de datos: gráficas","difficulty":"media","stem":"For which year shown was the percent increase in the number of visitors over the previous year the greatest?","options":["2019","2020","2021","2022","2023"],"answer":3,"solution":"Idea clave: cambio porcentual año a año = (este año − año anterior)/año anterior.\nPaso a paso:\n1) 2019: (55 − 50)/50 = 10%.\n2) 2020: bajó.\n3) 2021: (42 − 30)/30 = 40%.\n4) 2022: (63 − 42)/42 = 50%.\n5) 2023: (70 − 63)/63 ≈ 11%.\n6) El mayor es 2022.\nCómo comprobarlo: 2022 aumentó 21 sobre 42, exactamente la mitad, y ningún otro año llega a la mitad de su base.\nTrampa: elegir 2021 porque parte de la caída de 2020 y \"sube mucho\". En porcentaje, 2022 sube más.\nPara la próxima: compara el aumento contra la mitad, un tercio o un cuarto de la base; así estimas rápido.","cat":"datos"},{"type":"qc","gid":"D3","chart":{"type":"line","title":"Visitors to Lakeside Park, 2018–2023 (in thousands)","categories":["2018","2019","2020","2021","2022","2023"],"series":[{"name":"Visitors","values":[50,55,30,42,63,70]}],"yMax":80},"topic":"Interpretación de datos: gráficas","difficulty":"media","info":"Refer to the graph.","quantityA":"The average (arithmetic mean) number of visitors per year from 2018 through 2020","quantityB":"The average (arithmetic mean) number of visitors per year from 2021 through 2023","answer":1,"solution":"Idea clave: para comparar promedios de grupos del mismo tamaño, basta comparar sus sumas.\nPaso a paso:\n1) 2018–2020: 50 + 55 + 30 = 135.\n2) 2021–2023: 42 + 63 + 70 = 175.\n3) Ambos grupos tienen 3 años → 175 > 135 → B mayor.\nCómo comprobarlo: promedios 45 y 58.3.\nTrampa: comparar solo el primer y el último valor de cada periodo.\nPara la próxima: si los grupos tienen el mismo tamaño, compara sumas y omite la división.","cat":"datos"},{"type":"ne","gid":"D3","chart":{"type":"line","title":"Visitors to Lakeside Park, 2018–2023 (in thousands)","categories":["2018","2019","2020","2021","2022","2023"],"series":[{"name":"Visitors","values":[50,55,30,42,63,70]}],"yMax":80},"topic":"Interpretación de datos: gráficas","difficulty":"difícil","stem":"By what percent did the number of visitors decrease from 2019 to 2020? Round your answer to the nearest whole percent.","answer":"45","tolerance":"0.5","solution":"Idea clave: la disminución porcentual se calcula sobre el valor original, que es el año anterior.\nPaso a paso:\n1) Disminución: 55 − 30 = 25.\n2) 25/55 ≈ 0.4545 → 45%.\nCómo comprobarlo: 55 × 0.55 ≈ 30 ✓ (si quedó 55%, bajó 45%).\nTrampa: dividir entre 30 (83%) usa el valor nuevo como base.\nPara la próxima: \"de A a B\" → la base es A, el primer valor que se menciona.","cat":"datos"},{"type":"ne","figure":{"width":260,"height":200,"points":{"A":[40,30],"C":[40,170],"B":[227,170],"D":[133.5,100]},"segments":[["A","C"],["C","B"],["A","B"],["C","D"]],"rightAngles":[["A","C","B"]],"labels":[{"at":[24,104],"text":"6"},{"at":[133,188],"text":"8"}],"note":"Note: Figure not drawn to scale."},"topic":"Geometría: triángulos rectángulos","difficulty":"media","stem":"In the figure above, angle ACB is a right angle, AC = 6, BC = 8, and D is the midpoint of side AB. What is the length of segment CD?","answer":"5","solution":"Idea clave: en un triángulo rectángulo, el punto medio de la hipotenusa está a la misma distancia de los tres vértices.\nPaso a paso:\n1) La hipotenusa AB = √(6² + 8²) = 10.\n2) D es el punto medio de AB, así que DA = DB = 5.\n3) Por la propiedad anterior, DC también mide 5.\nCómo comprobarlo con coordenadas: C = (0, 0), A = (0, 6), B = (8, 0). D = (4, 3). CD = √(16 + 9) = 5 ✓.\nTrampa: suponer que CD es una altura e intentar calcular 6 × 8/10 = 4.8.\nPara la próxima: la hipotenusa es el diámetro del círculo que pasa por los tres vértices; por eso su punto medio equidista de todos. Si no recuerdas la propiedad, usa coordenadas.","cat":"geo"},{"type":"mc","figure":{"width":300,"height":220,"points":{},"lines":[{"from":[20,60],"to":[280,60],"label":"ℓ","labelAt":[286,64]},{"from":[20,150],"to":[280,150],"label":"m","labelAt":[286,154]},{"from":[80,20],"to":[220,200]}],"labels":[{"at":[81.1,80],"text":"115°"},{"at":[159.1,140],"text":"x°"}],"note":"Note: Figure not drawn to scale."},"topic":"Geometría: rectas paralelas","difficulty":"media","stem":"In the figure above, lines ℓ and m are parallel. What is the value of x?","options":["55","65","75","115","125"],"answer":1,"solution":"Idea clave: cuando una transversal corta dos paralelas, los ángulos \"interiores del mismo lado\" (entre las paralelas y del mismo lado de la transversal) suman 180°.\nPaso a paso:\n1) El ángulo de 115° está debajo de ℓ y a la izquierda de la transversal.\n2) x° está arriba de m y también a la izquierda.\n3) Ambos están entre las paralelas y del mismo lado → suman 180.\n4) x = 180 − 115 = 65.\nCómo comprobarlo: el ángulo junto a 115° sobre la recta ℓ mide 65° (forman una recta). Su alterno interno en m es x → 65 ✓.\nTrampa: elegir 115, como si fueran ángulos alternos o correspondientes.\nPara la próxima: en paralelas solo hay dos medidas de ángulo: una aguda y una obtusa, que suman 180. Decide si x es agudo u obtuso mirando la figura.","cat":"geo"},{"type":"ne","figure":{"width":300,"height":230,"points":{"O":[150,115],"A":[77.5,148.8],"B":[222.5,148.8],"C":[143.0,35.3]},"circles":[{"center":"O","radius":80}],"segments":[["C","A"],["C","B"],["O","A"],["O","B"]],"labels":[{"at":[146,69],"text":"35°"}],"note":"Note: Figure not drawn to scale."},"topic":"Geometría: círculos y ángulos","difficulty":"media","stem":"In the figure above, points A, B, and C lie on the circle with center O, and the measure of angle ACB is 35°. What is the measure, in degrees, of angle AOB?","answer":"70","solution":"Idea clave: el ángulo central mide el doble del ángulo inscrito que abarca el mismo arco.\nPaso a paso:\n1) El ángulo ACB tiene su vértice en el círculo (inscrito) y abarca el arco AB.\n2) AOB tiene su vértice en el centro (central) y abarca el mismo arco.\n3) AOB = 2 × 35 = 70.\nCómo comprobarlo: OA = OB (radios), así que el triángulo AOB es isósceles. Con 70° en O, los otros dos ángulos miden 55° cada uno; los ángulos son razonables.\nTrampa: suponer que ambos ángulos miden lo mismo.\nPara la próxima: vértice en el centro → mide lo mismo que el arco. Vértice sobre el círculo → mide la mitad del arco.","cat":"geo"},{"type":"qc","figure":{"width":300,"height":190,"points":{"A":[40,40],"B":[260,40],"C":[260,150],"D":[40,150],"E":[110,150]},"segments":[["A","B"],["B","C"],["C","D"],["D","A"],["A","E"],["B","E"]],"note":"Note: Figure not drawn to scale."},"topic":"Geometría: áreas","difficulty":"difícil","info":"ABCD is a rectangle, and E is a point on side CD.","quantityA":"The area of triangle ABE","quantityB":"One-half the area of rectangle ABCD","answer":2,"solution":"Idea clave: el área de un triángulo es ½ × base × altura, y la altura es la distancia perpendicular a la base.\nPaso a paso:\n1) Base del triángulo: AB, que es el largo del rectángulo.\n2) Altura: la distancia de E a la recta AB. Como E está sobre CD, esa distancia es el ancho del rectángulo, esté donde esté E.\n3) Área = ½ × largo × ancho = la mitad del área del rectángulo → iguales.\nCómo comprobarlo: mueve E a la esquina D. El triángulo ABD es exactamente la mitad del rectángulo (lo corta la diagonal).\nTrampa: elegir D porque E \"puede moverse\". La posición de E no cambia la altura.\nPara la próxima: cuando un vértice se mueve sobre una recta paralela a la base, el área del triángulo no cambia.","cat":"geo"},{"type":"mc","figure":{"width":260,"height":220,"axes":{"origin":[50,180],"xEnd":[240,180],"yEnd":[50,15]},"points":{"(0, 4)":[50,60],"(6, 0)":[200,180]},"lines":[{"from":[30,44],"to":[222,198],"label":"k","labelAt":[150,112]}],"pointDots":true,"note":"Note: Figure not drawn to scale.","hidePointLabels":["(0, 4)","(6, 0)"],"labels":[{"at":[24,64],"text":"(0, 4)"},{"at":[200,200],"text":"(6, 0)"}]},"topic":"Geometría analítica: áreas","difficulty":"media","stem":"In the xy-plane above, line k passes through the points (0, 4) and (6, 0). What is the area of the triangular region bounded by line k and the two coordinate axes?","options":["10","12","20","24","48"],"answer":1,"solution":"Idea clave: los puntos de corte con los ejes forman un triángulo rectángulo cuyos catetos están sobre los ejes.\nPaso a paso:\n1) La recta corta el eje y en (0, 4) → cateto vertical de 4.\n2) Corta el eje x en (6, 0) → cateto horizontal de 6.\n3) Área = ½ × 4 × 6 = 12.\nCómo comprobarlo: la recta es y = −(2/3)x + 4; con x = 6, y = 0 ✓.\nTrampa: 24 olvida el ½.\nPara la próxima: si una recta corta los ejes en a y b, el triángulo que forma con ellos tiene área ½|a·b|.","cat":"geo"},{"type":"mc","figure":{"width":260,"height":240,"points":{"O":[130,120]},"circles":[{"center":"O","radius":110}],"polygons":[[[52.2,42.2],[207.8,42.2],[207.8,197.8],[52.2,197.8]]],"hidePointLabels":["O"],"labels":[{"at":[130,34.2],"text":"4"}],"note":"Note: Figure not drawn to scale."},"topic":"Geometría: figuras inscritas","difficulty":"difícil","stem":"In the figure above, a square with sides of length 4 is inscribed in a circle. What is the area of the circular region?","options":["4π","6π","8π","12π","16π"],"answer":2,"solution":"Idea clave: cuando un cuadrado está inscrito en un círculo, la diagonal del cuadrado es el diámetro del círculo.\nPaso a paso:\n1) Diagonal de un cuadrado de lado s = s√2 = 4√2.\n2) Radio = 4√2/2 = 2√2 → r² = 8.\n3) Área = πr² = 8π.\nCómo comprobarlo: el círculo debe ser más grande que el cuadrado (área 16). 8π ≈ 25 > 16 ✓.\nTrampa: tomar la mitad del lado como radio (r = 2 → 4π ≈ 12.6, menor que el cuadrado; imposible).\nPara la próxima: cuadrado dentro del círculo → la diagonal es el diámetro. Círculo dentro del cuadrado → el lado es el diámetro.","cat":"geo"},{"type":"mc","topic":"Sucesiones","difficulty":"media","stem":"In a sequence, a₁ = 3, and each term after the first is 2 more than twice the preceding term. What is the value of a₄?","options":["26","34","38","42","76"],"answer":2,"solution":"Idea clave: en una sucesión definida por recurrencia, calcula término a término aplicando la regla exacta.\nPaso a paso:\n1) Regla: siguiente = 2 × anterior + 2.\n2) a₂ = 2(3) + 2 = 8.\n3) a₃ = 2(8) + 2 = 18.\n4) a₄ = 2(18) + 2 = 38.\nCómo comprobarlo: revisa el orden de la regla. \"2 more than twice\" = 2x + 2, no 2(x + 2).\nTrampa: aplicar 2(x + 2) da 10, 24, 52.\nPara la próxima: traduce la frase con cuidado. \"Twice the sum\" = 2(x + y); \"twice x plus y\" = 2x + y.","cat":"alg"},{"type":"ne","topic":"Sucesiones aritméticas","difficulty":"media","stem":"What is the sum of the first 20 terms of the arithmetic sequence 5, 9, 13, 17, ... ?","answer":"860","solution":"Idea clave: la suma de una sucesión aritmética es n × (primero + último)/2.\nPaso a paso:\n1) Diferencia: 4. Término 20: a₂₀ = 5 + (20 − 1) × 4 = 81.\n2) Suma = 20 × (5 + 81)/2 = 20 × 43 = 860.\nCómo comprobarlo: el promedio de la sucesión es 43; 20 términos × 43 = 860.\nTrampa: usar 20 × 4 en lugar de 19 × 4 para el último término (da 85).\nPara la próxima: término n = primero + (n − 1) × diferencia. El \"− 1\" es donde más errores hay.","cat":"alg"},{"type":"ne","topic":"Conjuntos y diagramas de Venn","difficulty":"media","stem":"Of the 80 students in a club, 45 study French, 30 study Spanish, and 12 study both French and Spanish. How many of the students study neither French nor Spanish?","answer":"17","solution":"Idea clave: en un diagrama de Venn, total = solo A + solo B + ambos + ninguno.\nPaso a paso:\n1) Al menos uno de los dos idiomas: 45 + 30 − 12 = 63 (se resta a los 12 que se contaron dos veces).\n2) Ninguno: 80 − 63 = 17.\nCómo comprobarlo con el diagrama: solo francés 33, solo español 18, ambos 12, ninguno 17 → 33 + 18 + 12 + 17 = 80 ✓.\nTrampa: 80 − 45 − 30 = 5, porque no se descuentan los que estudian ambos.\nPara la próxima: dibuja los dos círculos y llena primero la intersección, luego \"solo A\", \"solo B\" y al final \"ninguno\".","cat":"prob"},{"type":"qc","topic":"Conjuntos y diagramas de Venn","difficulty":"difícil","info":"In a group of 50 people, 30 own a car and 25 own a bicycle.","quantityA":"The number of people in the group who own both a car and a bicycle","quantityB":"5","answer":3,"solution":"Idea clave: con dos grupos dentro de un total, la intersección tiene un mínimo y un máximo posibles.\nPaso a paso:\n1) Mínimo de \"ambos\": 30 + 25 − 50 = 5. Ocurre cuando todos tienen al menos uno de los dos.\n2) Máximo: 25. Ocurre cuando todos los que tienen bicicleta también tienen auto.\n3) A puede ser cualquier valor de 5 a 25 → puede igualar a 5 o superarlo → no se puede determinar.\nCómo comprobarlo: caso 1 → 25 solo auto, 20 solo bici, 5 ambos → total 50 ✓. Caso 2 → 10 ambos, 20 solo auto, 15 solo bici, 5 ninguno → 50 ✓.\nTrampa: tomar el mínimo (5) como el valor real y elegir C.\nPara la próxima: mínimo de la intersección = A + B − total (si es negativo, 0); máximo = el menor de A y B.","cat":"prob"},{"type":"mc","topic":"Estadística: cuartiles","difficulty":"media","stem":"What is the interquartile range of the following data?\n2, 4, 4, 5, 7, 8, 9, 11, 12, 15","options":["5","6","7","8","9"],"answer":2,"solution":"Idea clave: el rango intercuartil es Q3 − Q1. Q1 es la mediana de la mitad inferior y Q3 la de la mitad superior.\nPaso a paso:\n1) La lista ya está ordenada y tiene 10 valores. Mitad inferior: 2, 4, 4, 5, 7. Mitad superior: 8, 9, 11, 12, 15.\n2) Q1 = mediana de la mitad inferior = 4.\n3) Q3 = mediana de la mitad superior = 11.\n4) IQR = 11 − 4 = 7.\nCómo comprobarlo: entre Q1 y Q3 deben quedar más o menos la mitad de los datos; entre 4 y 11 caben 4, 5, 7, 8, 9, 11 ✓.\nTrampa: restar el máximo menos el mínimo (rango = 13).\nPara la próxima: con una cantidad par de datos, divide la lista exactamente a la mitad. Con impar, deja fuera la mediana antes de dividir.","cat":"est"},{"type":"mc","topic":"Distribución normal","difficulty":"media","stem":"The scores on a test are approximately normally distributed with a mean of 500 and a standard deviation of 100. Approximately what percent of the scores are between 400 and 600?","options":["34%","50%","68%","95%","99.7%"],"answer":2,"solution":"Idea clave: en una distribución normal, aproximadamente 68% de los datos cae a ±1 desviación de la media, 95% a ±2 y 99.7% a ±3.\nPaso a paso:\n1) Desviaciones: (400 − 500)/100 = −1 y (600 − 500)/100 = +1.\n2) El intervalo es ±1 desviación → ≈68%.\nCómo comprobarlo: cada lado (500 a 600) tiene ≈34%; 34 × 2 = 68 ✓.\nTrampa: 34% es solo un lado.\nPara la próxima: memoriza la regla 68–95–99.7 y la mitad de cada una: 34%, 47.5% y 49.85% por lado.","cat":"est"},{"type":"qc","topic":"Distribución normal","difficulty":"difícil","info":"A set of measurements is approximately normally distributed with a mean of 70 and a standard deviation of 5.","quantityA":"The percent of the measurements that are greater than 80","quantityB":"5%","answer":1,"solution":"Idea clave: usa la regla 68–95–99.7 y recuerda que la parte que queda fuera se reparte entre dos colas.\nPaso a paso:\n1) 80 = 70 + 2 × 5 → está a +2 desviaciones.\n2) Dentro de ±2 desviaciones: ≈95%. Fuera: ≈5%, dividido en dos colas iguales.\n3) Por encima de 80: ≈2.5% < 5% → B mayor.\nCómo comprobarlo: dibuja la campana, marca 60 y 80, y sombrea solo la cola derecha.\nTrampa: tomar todo el 5% de fuera para una sola cola (elegir C).\nPara la próxima: cola de un lado más allá de ±1 desviación ≈ 16%; de ±2 ≈ 2.5%; de ±3 ≈ 0.15%.","cat":"est"},{"type":"mc","topic":"Permutaciones con restricciones","difficulty":"difícil","stem":"In how many different ways can 5 people be seated in a row of 5 chairs if two particular people must sit next to each other?","options":["24","48","60","96","120"],"answer":1,"solution":"Idea clave: si dos personas deben ir juntas, trátalas como un solo bloque y luego multiplica por sus órdenes internos.\nPaso a paso:\n1) Une a las dos personas en un bloque. Quedan 4 unidades: el bloque y 3 personas.\n2) Órdenes de 4 unidades: 4! = 24.\n3) Dentro del bloque, las dos personas pueden ir en 2 órdenes (AB o BA).\n4) Total: 24 × 2 = 48.\nCómo comprobarlo: sin restricción hay 5! = 120. La probabilidad de que dos personas queden juntas es 48/120 = 40%, una cifra razonable.\nTrampa: olvidar el orden interno del bloque y marcar 24.\nPara la próxima: \"deben ir juntos\" → bloque × orden interno. \"No pueden ir juntos\" → total − juntos (120 − 48 = 72).","cat":"prob"},{"type":"ms","topic":"Desigualdades","difficulty":"difícil","stem":"If −3 < x < 2, which of the following could be the value of x²?\n\nIndicate all such values.","options":["0","1","4","8.9","9","10"],"answer":[0,1,2,3],"solution":"Idea clave: para saber el rango de x², fíjate en qué valor de x está más lejos de cero. Ese extremo da el cuadrado más grande.\nPaso a paso:\n1) x va de −3 a 2, sin incluir los extremos.\n2) El cuadrado mínimo es 0 (cuando x = 0, que sí está en el rango).\n3) El máximo se acerca a (−3)² = 9, pero sin llegar, porque x no puede ser −3. Por el lado positivo, x² < 4.\n4) Rango: 0 ≤ x² < 9 → sirven 0, 1, 4 y 8.9.\nCómo comprobarlo: 8.9 → x ≈ −2.98, que sí está en el rango ✓. 4 → x = −2 ✓.\nTrampa: pensar que x² va de 9 a 4 (elevando solo los extremos) o descartar 0.\nPara la próxima: si el intervalo cruza el cero, el mínimo de x² es 0 y el máximo lo da el extremo con mayor valor absoluto.","cat":"alg"},{"type":"tc","topic":"Vocabulario en contexto","difficulty":"media","stem":"Although the scientist's early papers were dismissed as _____, her later work vindicated many of her once-controversial claims.","blanks":[["speculative","rigorous","derivative","lucrative","concise"]],"answer":[0],"solution":"Idea clave: en completar texto, la respuesta sale de una pista dentro de la oración. Busca palabras de dirección como \"although\", \"but\" o \"because\".\nPaso a paso:\n1) \"Although\" marca contraste: primero se descartaron sus trabajos y después se le dio la razón (\"vindicated\").\n2) Pista: sus afirmaciones eran \"once-controversial\". Se descartaron porque parecían ideas sin pruebas.\n3) Tu palabra antes de ver opciones: \"sin fundamento, especulativo\".\n4) speculative = basado en suposiciones, no en pruebas ✓.\nVocabulario: rigorous = riguroso; derivative = poco original, copiado; lucrative = que deja dinero; concise = breve.\nCómo comprobarlo: lee la oración completa con tu respuesta. \"Dismissed as speculative, later vindicated\" tiene sentido.\nTrampa: rigorous suena académico, pero un trabajo riguroso no se descarta; rompe el contraste.\nPara la próxima: tapa las opciones, escribe tu propia palabra y luego busca la más parecida.","cat":"ver"},{"type":"tc","topic":"Vocabulario en contexto","difficulty":"media","stem":"The senator's speech was so _____ that even her supporters struggled to identify a single concrete proposal in it.","blanks":[["incisive","vacuous","partisan","succinct","eloquent"]],"answer":[1],"solution":"Idea clave: \"so ___ that…\" indica causa y efecto: el efecto descrito define la palabra.\nPaso a paso:\n1) Efecto: ni sus seguidores encontraron una sola propuesta concreta.\n2) Entonces el discurso estaba vacío de contenido.\n3) Tu palabra: \"vacío, sin sustancia\" → vacuous ✓.\nVocabulario: incisive = agudo, que va directo al punto (lo contrario); partisan = partidista; succinct = breve; eloquent = elocuente, bien expresado.\nCómo comprobarlo: \"eloquent\" describe la forma, no el contenido. Un discurso puede ser elocuente y sustancioso, así que no explica el efecto.\nTrampa: partisan y eloquent \"suenan\" a discurso político, pero ninguno explica la falta de propuestas.\nPara la próxima: con \"so ___ that\", la palabra debe causar lógicamente lo que sigue.","cat":"ver"},{"type":"tc","topic":"Vocabulario en contexto","difficulty":"media","stem":"Far from being _____, the new manager welcomed criticism and often changed course after hearing objections from her staff.","blanks":[["receptive","candid","gregarious","intransigent","diffident"]],"answer":[3],"solution":"Idea clave: \"Far from being X\" significa \"es lo contrario de X\". La pista describe lo que sí es.\nPaso a paso:\n1) Lo que sí hace: acepta críticas y cambia de rumbo.\n2) X debe ser lo contrario: terco, inflexible.\n3) intransigent = que se niega a ceder ✓.\nVocabulario: receptive = abierto (describe lo que sí es); candid = franco; gregarious = sociable; diffident = tímido, inseguro.\nCómo comprobarlo: \"Far from being intransigent, she welcomed criticism\" es coherente.\nTrampa: receptive es la palabra que describe a la gerente, pero la frase pide su opuesto.\nPara la próxima: frases de negación (\"far from\", \"hardly\", \"rather than\", \"not\") invierten la pista. Identifica primero qué es la persona y luego niega.","cat":"ver"},{"type":"tc","topic":"Vocabulario en contexto","difficulty":"difícil","stem":"The documentary's portrayal of the explorer was hardly _____: it dwelt at length on his cruelty toward the guides who made his expeditions possible.","blanks":[["superficial","chronological","hagiographic","ambiguous","sardonic"]],"answer":[2],"solution":"Idea clave: \"hardly X\" = definitivamente no X. La pista dice qué es el retrato en realidad.\nPaso a paso:\n1) Lo que sí hace el documental: se detiene en la crueldad del explorador. Es crítico.\n2) Entonces \"hardly X\" significa que no fue un retrato elogioso o idealizado.\n3) hagiographic = que idealiza a alguien como si fuera santo ✓.\nVocabulario: superficial = poco profundo; chronological = en orden de tiempo; ambiguous = que admite varias interpretaciones; sardonic = burlón, sarcástico.\nCómo comprobarlo: elogio vs. crítica es el contraste que la oración necesita.\nTrampa: superficial parece funcionar (\"no fue superficial porque profundizó\"), pero la pista habla del tono (crítico), no de la profundidad.\nPara la próxima: si conoces la raíz hagio- (santo), deduces el significado. Aprender raíces latinas y griegas multiplica tu vocabulario.","cat":"ver"},{"type":"tc","topic":"Vocabulario en contexto","difficulty":"media","stem":"Because the evidence was largely _____, the committee declined to draw any firm conclusion from it.","blanks":[["conclusive","anecdotal","empirical","voluminous","contemporaneous"]],"answer":[1],"solution":"Idea clave: \"Because\" indica causa: la palabra debe explicar por qué no sacaron conclusiones firmes.\nPaso a paso:\n1) No llegaron a conclusiones firmes → la evidencia era débil o poco sistemática.\n2) anecdotal = basada en relatos sueltos, no en datos sistemáticos ✓.\nVocabulario: conclusive = concluyente (lo opuesto); empirical = basado en observación (algo positivo); voluminous = abundante; contemporaneous = de la misma época.\nCómo comprobarlo: evidencia anecdótica → no sirve para conclusiones firmes. Es lógico.\nTrampa: voluminous; mucha evidencia no impide concluir.\nPara la próxima: con \"because\", pregúntate qué característica causaría el resultado descrito.","cat":"ver"},{"type":"tc","topic":"Vocabulario en contexto","difficulty":"difícil","stem":"Critics who had expected the young novelist's second book to be as _____ as her first were surprised by its restraint and economy.","blanks":[["terse","laconic","plausible","florid","somber"]],"answer":[3],"solution":"Idea clave: la sorpresa crea contraste. El primer libro debe ser lo opuesto al segundo.\nPaso a paso:\n1) El segundo libro es contenido y económico (\"restraint and economy\").\n2) Hubo sorpresa, así que esperaban lo contrario: un estilo recargado.\n3) florid = muy adornado, recargado ✓.\nVocabulario: terse y laconic = escuetos, de pocas palabras (iguales al segundo libro); plausible = creíble; somber = sombrío.\nCómo comprobarlo: si el primer libro fuera terse, no habría sorpresa.\nTrampa: terse y laconic describen el segundo libro.\nPara la próxima: si dos opciones son sinónimos y ambas encajan en la oración, probablemente ninguna es la correcta en completar texto de un espacio.","cat":"ver"},{"type":"tc","topic":"Vocabulario en contexto","difficulty":"media","stem":"The historian warned that the archive's apparent completeness was _____: whole categories of documents had been quietly destroyed decades earlier.","blanks":[["authoritative","deliberate","intriguing","unprecedented","illusory"]],"answer":[4],"solution":"Idea clave: \"apparent\" anticipa que algo solo lo parece. La pista después de los dos puntos lo confirma.\nPaso a paso:\n1) El archivo parecía completo, pero se destruyeron categorías enteras de documentos.\n2) Entonces su completitud no era real.\n3) illusory = ilusorio, engañoso ✓.\nVocabulario: authoritative = con autoridad; deliberate = intencional; intriguing = interesante; unprecedented = sin precedentes.\nCómo comprobarlo: \"the apparent completeness was illusory\" es coherente.\nTrampa: deliberate describe la destrucción, pero la palabra califica la completitud.\nPara la próxima: identifica de qué sustantivo habla el espacio. A veces una opción encaja con otra parte de la oración, no con el espacio.","cat":"ver"},{"type":"tc","topic":"Vocabulario en contexto","difficulty":"media","stem":"The museum's new director is no _____; she has spent thirty years studying the very collection she now oversees.","blanks":[["neophyte","scholar","curator","patron","skeptic"]],"answer":[0],"solution":"Idea clave: \"is no X\" = no es X. La pista dice lo contrario.\nPaso a paso:\n1) Pista: lleva treinta años estudiando la colección → tiene muchísima experiencia.\n2) Entonces \"no X\" significa que no es principiante.\n3) neophyte = novato, principiante ✓.\nVocabulario: scholar = erudito, académico (sí lo es); curator = conservador de museo; patron = mecenas; skeptic = escéptico.\nCómo comprobarlo: \"She is no neophyte; she has spent thirty years…\" es lógico.\nTrampa: scholar describe lo que sí es; con \"no\" queda al revés.\nPara la próxima: como en \"far from\", la negación te obliga a buscar el antónimo de la pista.","cat":"ver"},{"type":"tc","topic":"Dos espacios: tono y contenido","difficulty":"media","stem":"The committee's report, though _____ (i) in tone, was _____ (ii) in substance: it recommended dismantling the entire program.","blanks":[["strident","measured","jocular"],["timid","trivial","radical"]],"answer":[1,2],"solution":"Idea clave: con dos espacios, empieza por el que tenga la pista más clara.\nPaso a paso:\n1) Espacio (ii): la recomendación es desmantelar todo el programa, algo extremo → radical.\n2) Espacio (i): \"though\" contrasta el tono con el contenido. Si el contenido es radical, el tono es moderado → measured (mesurado).\nVocabulario: strident = estridente, agresivo; jocular = bromista; timid = tímido; trivial = sin importancia.\nCómo comprobarlo: \"though measured in tone, radical in substance\" mantiene el contraste.\nTrampa: strident + radical no tiene contraste, y \"though\" lo exige.\nPara la próxima: resuelve el espacio con pista directa y usa la palabra de relación (\"though\") para deducir el otro.","cat":"ver"},{"type":"tc","topic":"Dos espacios: contraste","difficulty":"difícil","stem":"Many readers find the philosopher's prose _____ (i), yet those who persist discover that its difficulty is _____ (ii): each convoluted sentence turns out to be doing necessary work.","blanks":[["impenetrable","pellucid","pedestrian"],["gratuitous","warranted","feigned"]],"answer":[0,1],"solution":"Idea clave: \"yet\" marca contraste entre la primera impresión y lo que descubren los que insisten.\nPaso a paso:\n1) Espacio (i): la prosa es difícil (\"its difficulty\") → impenetrable.\n2) Espacio (ii): cada oración enredada hace un trabajo necesario → la dificultad está justificada → warranted.\nVocabulario: pellucid = clarísimo (lo opuesto); pedestrian = común, sin inspiración; gratuitous = innecesario; feigned = fingido.\nCómo comprobarlo: \"impenetrable, yet its difficulty is warranted\" tiene sentido.\nTrampa: gratuitous significa justo lo contrario de lo que dice la pista final.\nPara la próxima: lo que sigue a los dos puntos explica o define lo anterior. Úsalo como pista directa.","cat":"ver"},{"type":"tc","topic":"Dos espacios: cambio de opinión","difficulty":"media","stem":"Early reviewers _____ (i) the film, but audiences embraced it, and within a decade critics who had once dismissed it were _____ (ii) its virtues.","blanks":[["lauded","anticipated","panned"],["extolling","questioning","concealing"]],"answer":[2,0],"solution":"Idea clave: busca palabras que conecten el inicio y el final de la oración (\"once dismissed\").\nPaso a paso:\n1) \"Critics who had once dismissed it\" te dice qué hicieron al inicio → (i) panned (criticaron duramente).\n2) Una década después, esos críticos cambiaron de opinión → (ii) extolling (alabando).\nVocabulario: lauded = alabaron (contradice \"dismissed\"); anticipated = esperaron; questioning = cuestionando; concealing = ocultando.\nCómo comprobarlo: \"panned… but audiences embraced it… critics were extolling its virtues\" cuenta una historia coherente.\nTrampa: lauded contradice directamente la pista \"dismissed\".\nPara la próxima: las oraciones largas suelen repetir la misma idea con otras palabras; \"dismissed\" es la versión al final de lo que va en (i).","cat":"ver"},{"type":"tc","topic":"Dos espacios: causa y efecto","difficulty":"media","stem":"The species was long thought to be _____ (i), but recent surveys have found thriving populations in several _____ (ii) valleys that researchers had simply never visited.","blanks":[["ubiquitous","extinct","invasive"],["remote","crowded","cultivated"]],"answer":[1,0],"solution":"Idea clave: \"but\" invierte la expectativa. Lo que se creía es lo contrario de lo que se encontró.\nPaso a paso:\n1) Encontraron poblaciones prósperas → antes se creía que la especie no existía → (i) extinct.\n2) Valles que los investigadores nunca habían visitado → aislados → (ii) remote.\nVocabulario: ubiquitous = presente en todas partes; invasive = invasora; crowded = lleno de gente; cultivated = cultivado.\nCómo comprobarlo: \"thought to be extinct, but found in remote valleys\" es lógico.\nTrampa: ubiquitous lo hace incoherente: encontrar poblaciones no sorprendería.\nPara la próxima: una relación causa-efecto implícita (nunca visitados → aislados) también es una pista.","cat":"ver"},{"type":"tc","topic":"Dos espacios: expectativa","difficulty":"difícil","stem":"Her reputation for _____ (i) made the minister's sudden evasiveness all the more _____ (ii) to reporters.","blanks":[["candor","secrecy","frivolity"],["predictable","conspicuous","tedious"]],"answer":[0,1],"solution":"Idea clave: \"all the more\" significa que algo resaltó más por contraste con lo esperado.\nPaso a paso:\n1) \"Sudden evasiveness\" → evasiva repentina, fuera de lo normal.\n2) Para que contraste, ella debía ser conocida por lo contrario: franqueza → (i) candor.\n3) Si siempre era franca, su evasiva llamó la atención → (ii) conspicuous (notorio, evidente).\nVocabulario: secrecy = secretismo; frivolity = frivolidad; predictable = predecible; tedious = aburrido.\nCómo comprobarlo: \"reputation for candor made the sudden evasiveness all the more conspicuous\" es coherente.\nTrampa: secrecy + predictable es coherente en apariencia, pero \"sudden\" indica que la evasiva era inesperada.\nPara la próxima: \"sudden\", \"unexpectedly\" y \"all the more\" señalan contraste con un patrón previo.","cat":"ver"},{"type":"tc","topic":"Dos espacios: definición","difficulty":"difícil","stem":"The theory's appeal lay in its _____ (i): it explained a wide range of phenomena with a single principle, though critics argued that this simplicity came at the cost of _____ (ii).","blanks":[["parsimony","obscurity","novelty"],["brevity","accuracy","elegance"]],"answer":[0,1],"solution":"Idea clave: lo que sigue a los dos puntos define el primer espacio.\nPaso a paso:\n1) \"Explained a wide range of phenomena with a single principle\" = explicar mucho con poco → (i) parsimony (economía explicativa).\n2) \"This simplicity came at the cost of\" → la simplicidad suele sacrificar precisión → (ii) accuracy.\nVocabulario: obscurity = oscuridad; novelty = novedad; brevity = brevedad; elegance = elegancia.\nCómo comprobarlo: el atractivo (simplicidad) y su costo (precisión) son opuestos lógicos.\nTrampa: elegance es parte del atractivo, no un costo.\nPara la próxima: \"at the cost of\" introduce algo valioso que se pierde. Busca qué virtud se sacrifica normalmente por la propiedad mencionada.","cat":"ver"},{"type":"tc","topic":"Dos espacios: giro","difficulty":"media","stem":"The negotiations, which had seemed _____ (i) only a week earlier, collapsed abruptly when one delegation _____ (ii) a demand it had previously agreed to drop.","blanks":[["doomed","promising","irrelevant"],["reintroduced","abandoned","clarified"]],"answer":[1,0],"solution":"Idea clave: \"collapsed abruptly\" implica que la situación anterior era la opuesta.\nPaso a paso:\n1) Si colapsaron de pronto, antes parecían ir bien → (i) promising.\n2) La causa: una delegación volvió a poner sobre la mesa algo que había aceptado abandonar → (ii) reintroduced.\nVocabulario: doomed = condenado al fracaso; irrelevant = irrelevante; abandoned = abandonó; clarified = aclaró.\nCómo comprobarlo: \"seemed promising… collapsed when one delegation reintroduced a demand\" es coherente.\nTrampa: abandoned. Abandonar la exigencia ayudaría a la negociación, no la haría fracasar.\nPara la próxima: \"abruptly\" y \"suddenly\" indican un cambio de estado; el primer espacio describe el estado anterior.","cat":"ver"},{"type":"tc","topic":"Tres espacios","difficulty":"difícil","stem":"The professor's lectures were notoriously _____ (i); she would begin with a question about medieval trade, _____ (ii) into anecdotes about her own travels, and only rarely _____ (iii) to the topic announced on the syllabus.","blanks":[["rigorous","digressive","succinct"],["condense","ascend","wander"],["object","return","reduce"]],"answer":[1,2,1],"solution":"Idea clave: con tres espacios, la oración describe un patrón. Encuentra el patrón y cada espacio lo sigue.\nPaso a paso:\n1) Patrón: empieza con un tema, pasa a anécdotas y casi nunca vuelve al tema.\n2) (i) Clases que se desvían → digressive.\n3) (ii) Se desvía hacia anécdotas → wander.\n4) (iii) Rara vez regresa al tema → return.\nVocabulario: rigorous = riguroso; succinct = breve; condense = resumir; ascend = subir; object = objetar; reduce = reducir.\nCómo comprobarlo: lee la oración completa con las tres palabras; debe contar una historia coherente.\nTrampa: rigorous suena positivo para un profesor, pero contradice el patrón descrito.\nPara la próxima: en tres espacios, los últimos suelen tener pistas más claras. Resuelve de atrás hacia adelante si te atoras.","cat":"ver"},{"type":"tc","topic":"Tres espacios","difficulty":"difícil","stem":"Although the merger was presented to employees as a _____ (i) of equals, the subsequent departure of nearly every senior executive from the smaller firm suggested that it was in fact a _____ (ii); few observers were _____ (iii) when the smaller firm's name disappeared entirely the following year.","blanks":[["rivalry","partnership","dissolution"],["compromise","coincidence","takeover"],["surprised","consulted","relieved"]],"answer":[1,2,0],"solution":"Idea clave: \"Although… presented as… in fact\" opone la versión oficial a la realidad.\nPaso a paso:\n1) (i) Versión oficial: algo \"de iguales\" → partnership.\n2) (ii) Realidad: los ejecutivos de la empresa pequeña se fueron → la grande la absorbió → takeover.\n3) (iii) Si era una absorción, que desapareciera el nombre era esperable → pocos estaban surprised.\nVocabulario: rivalry = rivalidad; dissolution = disolución; compromise = acuerdo; coincidence = coincidencia; consulted = consultados; relieved = aliviados.\nCómo comprobarlo: \"few observers were surprised\" encaja con un resultado predecible.\nTrampa: relieved no tiene apoyo en el texto; nada habla de alivio.\nPara la próxima: en el tercer espacio, pregúntate cómo reaccionaría un observador lógico ante lo que ya sabes.","cat":"ver"},{"type":"tc","topic":"Tres espacios","difficulty":"difícil","stem":"Scientific consensus is rarely _____ (i); it typically emerges _____ (ii), as competing explanations are tested and discarded, so that by the time a textbook _____ (iii) a finding, the debate over it may be decades old.","blanks":[["instantaneous","provisional","contested"],["abruptly","incrementally","arbitrarily"],["enshrines","refutes","anticipates"]],"answer":[0,1,0],"solution":"Idea clave: la oración describe un proceso. Cada espacio describe una parte de ese proceso.\nPaso a paso:\n1) El consenso surge mientras se prueban y descartan explicaciones; es un proceso largo.\n2) (i) Entonces rara vez es inmediato → instantaneous.\n3) (ii) Surge poco a poco → incrementally.\n4) (iii) Cuando un libro de texto lo consagra, el debate ya es viejo → enshrines (consagra).\nVocabulario: provisional = provisional; contested = disputado; abruptly = de golpe; arbitrarily = arbitrariamente; refutes = refuta; anticipates = anticipa.\nCómo comprobarlo: \"rarely instantaneous; emerges incrementally\" son la misma idea dicha de dos maneras.\nTrampa: refutes. El libro de texto adopta el hallazgo, no lo refuta.\nPara la próxima: un punto y coma (;) suele unir dos ideas que se explican entre sí.","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"media","stem":"Despite the coach's _____ assurances, the team's owners began quietly interviewing replacements.","options":["repeated","confident","ironic","sanguine","belated","tentative"],"answer":[1,3],"solution":"Idea clave: en equivalencia de oraciones necesitas DOS palabras que den oraciones con el mismo significado. Casi siempre son sinónimos.\nPaso a paso:\n1) \"Despite\" marca contraste: el entrenador dio garantías, pero los dueños buscaban reemplazo.\n2) Entonces las garantías eran optimistas, de que todo iría bien.\n3) Busca el par: confident (seguro) y sanguine (optimista) ✓.\nVocabulario: sanguine = optimista, confiado, aun en mala situación; belated = tardío; tentative = provisional, dudoso; ironic = irónico.\nCómo comprobarlo: lee la oración con cada palabra del par; el significado no debe cambiar.\nTrampa: repeated encaja en la oración, pero no tiene sinónimo entre las opciones.\nPara la próxima: primero predice la palabra; después busca DOS opciones parecidas a tu predicción. Una palabra sin pareja no puede ser respuesta.","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"media","stem":"The essay's argument is _____: each paragraph seems to contradict the one before it.","options":["incoherent","persuasive","inconsistent","derivative","tendentious","concise"],"answer":[0,2],"solution":"Idea clave: lo que sigue a los dos puntos define la palabra.\nPaso a paso:\n1) Cada párrafo contradice al anterior → el argumento no se sostiene, no es lógico.\n2) Par: incoherent (incoherente) e inconsistent (contradictorio) ✓.\nVocabulario: tendentious = tendencioso, sesgado; derivative = poco original; concise = conciso.\nCómo comprobarlo: ambas palabras describen un argumento que se contradice.\nTrampa: tendentious se confunde con \"tender a\" algo, pero significa parcial o sesgado.\nPara la próxima: aprende las palabras \"falsos amigos\" del GRE: tendentious, pedestrian, sanguine, prodigal…","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"media","stem":"Known for her _____, the diplomat could defuse even the most heated disputes.","options":["tact","wealth","ambition","discretion","stubbornness","eloquence"],"answer":[0,3],"solution":"Idea clave: la cualidad tiene que explicar el resultado (calmar disputas).\nPaso a paso:\n1) Calmar disputas acaloradas requiere delicadeza y cuidado al hablar.\n2) Par: tact (tacto) y discretion (discreción, prudencia) ✓.\nVocabulario: stubbornness = terquedad (empeora las disputas); eloquence = elocuencia; ambition = ambición.\nCómo comprobarlo: \"Known for her tact / discretion, the diplomat could defuse disputes\" dicen lo mismo.\nTrampa: eloquence podría ayudar, pero no tiene sinónimo entre las opciones.\nPara la próxima: si una opción encaja pero queda sola, descártala; la respuesta siempre es un par.","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"difícil","stem":"The once-thriving port town has become _____, its warehouses empty and its streets largely deserted.","options":["moribund","picturesque","notorious","cosmopolitan","declining","prosperous"],"answer":[0,4],"solution":"Idea clave: \"once-thriving\" (antes próspero) + descripción actual de abandono = decadencia.\nPaso a paso:\n1) Almacenes vacíos y calles desiertas → el pueblo está en declive.\n2) Par: moribund (agonizante, en decadencia) y declining (en declive) ✓.\nVocabulario: picturesque = pintoresco; notorious = de mala fama; cosmopolitan = cosmopolita; prosperous = próspero (lo contrario).\nCómo comprobarlo: ambas describen un lugar que se apaga.\nTrampa: picturesque puede describir un pueblo viejo, pero no tiene par y no se relaciona con el abandono.\nPara la próxima: moribund viene de \"mori\" (morir). Fíjate en las raíces.","cat":"ver"},{"type":"se","topic":"Equivalencia: tono","difficulty":"media","stem":"The author's tone throughout the memoir is _____, as though she were recounting events that had happened to someone else.","options":["detached","bitter","impassive","nostalgic","effusive","sentimental"],"answer":[0,2],"solution":"Idea clave: \"as though…\" introduce una comparación que explica el tono.\nPaso a paso:\n1) Cuenta sus memorias como si le hubieran pasado a otra persona → sin emoción, distante.\n2) Par: detached (distante) e impassive (impasible) ✓.\nVocabulario: bitter = amargo; nostalgic = nostálgico; effusive = efusivo; sentimental = sentimental (todos con emoción).\nCómo comprobarlo: un narrador \"como si fuera otra persona\" no muestra emoción.\nTrampa: nostalgic parece natural en unas memorias, pero contradice la pista.\nPara la próxima: no elijas lo \"típico\" del tema; elige lo que diga la pista de esa oración.","cat":"ver"},{"type":"se","topic":"Equivalencia: contraste","difficulty":"media","stem":"Though he claimed to be _____ about the outcome, the candidate checked the vote count every few minutes.","options":["indifferent","anxious","optimistic","nonchalant","curious","ecstatic"],"answer":[0,3],"solution":"Idea clave: \"Though he claimed\" contrasta lo que decía con lo que hacía.\nPaso a paso:\n1) Lo que hacía: revisaba el conteo cada pocos minutos (estaba ansioso).\n2) Lo que decía: lo contrario, que no le importaba.\n3) Par: indifferent (indiferente) y nonchalant (despreocupado) ✓.\nVocabulario: anxious = ansioso (lo que realmente estaba); optimistic = optimista; curious = curioso; ecstatic = eufórico.\nCómo comprobarlo: \"claimed to be indifferent / nonchalant\" contrasta con su conducta.\nTrampa: anxious describe la conducta, no lo que afirmaba.\nPara la próxima: con \"claimed\", \"professed\" o \"seemed\", la palabra describe la apariencia, que suele ser opuesta a la realidad.","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"media","stem":"The proposal was criticized as _____, since it addressed the symptoms of the problem while ignoring its causes.","options":["expensive","radical","superficial","unpopular","cursory","ambitious"],"answer":[2,4],"solution":"Idea clave: \"since…\" explica la crítica: atender síntomas e ignorar causas.\nPaso a paso:\n1) Atender solo la superficie del problema → una solución poco profunda.\n2) Par: superficial y cursory (hecho de prisa, sin profundidad) ✓.\nVocabulario: radical = que va a la raíz (lo contrario); expensive = caro; unpopular = impopular; ambitious = ambicioso.\nCómo comprobarlo: ambas describen algo que se queda en la superficie.\nTrampa: radical, que viene de \"raíz\", es justo lo opuesto.\nPara la próxima: si conoces la etimología (radix = raíz), puedes descartar opciones con confianza.","cat":"ver"},{"type":"se","topic":"Equivalencia: carácter","difficulty":"difícil","stem":"Her manner was so _____ that new acquaintances often mistook her shyness for arrogance.","options":["reserved","aloof","gregarious","effusive","garrulous","timid"],"answer":[0,1],"solution":"Idea clave: la conducta que se confunde con arrogancia es la distancia o frialdad.\nPaso a paso:\n1) La timidez puede parecer arrogancia cuando la persona se ve distante.\n2) Par: reserved (reservado) y aloof (distante) ✓.\nVocabulario: gregarious = sociable; effusive = efusivo; garrulous = parlanchín (los tres son lo opuesto); timid = tímido.\nCómo comprobarlo: alguien reservado o distante puede parecer altivo.\nTrampa: timid describe la causa (la timidez), pero la oración pide el comportamiento visible que se malinterpreta.\nPara la próxima: lee con cuidado qué describe el espacio: la causa o la apariencia.","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"media","stem":"The company's _____ spending during the boom years left it with little cushion when demand collapsed.","options":["prudent","profligate","extravagant","modest","strategic","sporadic"],"answer":[1,2],"solution":"Idea clave: el resultado (sin colchón) explica cómo era el gasto.\nPaso a paso:\n1) Quedarse sin reservas cuando cae la demanda → gastó de más en los buenos tiempos.\n2) Par: profligate (despilfarrador) y extravagant (excesivo) ✓.\nVocabulario: prudent = prudente; modest = modesto (ambos dejarían reservas); strategic = estratégico; sporadic = esporádico.\nCómo comprobarlo: un gasto despilfarrador deja poco colchón.\nTrampa: confundir profligate con \"prolífico\". Significa derrochador.\nPara la próxima: profligate es palabra frecuente en el GRE (prodigal es sinónimo). Haz una lista de palabras de \"gastar de más\" y \"ahorrar\".","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"media","stem":"The witness's account was _____, consistent in every detail with the physical evidence.","options":["dramatic","verbose","credible","ambiguous","hesitant","plausible"],"answer":[2,5],"solution":"Idea clave: lo que sigue a la coma explica la palabra: coincide con la evidencia.\nPaso a paso:\n1) Coincidir en cada detalle con la evidencia física → el testimonio es digno de crédito.\n2) Par: credible (creíble) y plausible (verosímil) ✓.\nVocabulario: dramatic = dramático; verbose = que usa demasiadas palabras; ambiguous = ambiguo; hesitant = vacilante.\nCómo comprobarlo: ambas describen un relato creíble.\nTrampa: ninguna opción fuerte; el riesgo es elegir dramatic por asociar \"testigo\" con \"drama\".\nPara la próxima: las comas que añaden una descripción (aposiciones) suelen definir la palabra del espacio.","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"media","stem":"Rather than _____ the critics, the director simply ignored them and began work on her next film.","options":["rebutting","refuting","praising","imitating","flattering","hiring"],"answer":[0,1],"solution":"Idea clave: \"Rather than X, simply ignored them\" → X es una forma de responder a los críticos, lo contrario de ignorarlos.\nPaso a paso:\n1) La respuesta natural a una crítica, en lugar de ignorarla, es contestarla o contradecirla.\n2) Par: rebutting (rebatir) y refuting (refutar) ✓.\nVocabulario: praising y flattering = elogiar y halagar (forman otro par, pero no es lo natural frente a críticos); imitating = imitar; hiring = contratar.\nCómo comprobarlo: \"Rather than rebutting / refuting the critics, she ignored them\" es la frase más lógica.\nTrampa: praising/flattering también son sinónimos; cuando hay dos pares posibles, elige el que mejor encaja con el contexto.\nPara la próxima: si ves dos pares de sinónimos, vuelve a la pista y pregunta cuál produce la oración más lógica.","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"media","stem":"The new regulations were intended to _____ the pollution that had plagued the river for decades.","options":["curb","document","check","publicize","worsen","study"],"answer":[0,2],"solution":"Idea clave: \"intended to\" + un problema que se arrastra por décadas → buscan frenarlo.\nPaso a paso:\n1) Las regulaciones buscan reducir la contaminación.\n2) Par: curb (frenar, limitar) y check (detener, contener) ✓.\nVocabulario: check como verbo también significa \"contener\" (\"to check the spread\"); document = documentar; publicize = difundir; worsen = empeorar.\nCómo comprobarlo: ambas significan detener o limitar algo.\nTrampa: check en su sentido común es \"revisar\", pero aquí significa frenar.\nPara la próxima: el GRE usa sentidos secundarios de palabras comunes (check, qualify, temper, sanction). Aprende esos segundos significados.","cat":"ver"},{"type":"se","topic":"Equivalencia: contraste","difficulty":"difícil","stem":"The novelist's later works are marked by a _____ that contrasts sharply with the exuberance of her debut.","options":["playfulness","restraint","verbosity","whimsy","sobriety","ambition"],"answer":[1,4],"solution":"Idea clave: \"contrasts sharply with the exuberance\" pide un antónimo de exuberancia.\nPaso a paso:\n1) Exuberancia = energía, abundancia, entusiasmo. Lo opuesto: contención, seriedad.\n2) Par: restraint (contención) y sobriety (sobriedad) ✓.\nVocabulario: playfulness y whimsy = juguetón, caprichoso (parecidos a la exuberancia); verbosity = verborrea; ambition = ambición.\nCómo comprobarlo: ambas palabras contrastan con exuberancia.\nTrampa: playfulness y whimsy forman un par, pero son parecidos a la exuberancia, no opuestos.\nPara la próxima: con \"contrasts with\", predice el antónimo antes de ver las opciones.","cat":"ver"},{"type":"se","topic":"Equivalencia: sinónimos","difficulty":"media","stem":"The speaker's remarks were so _____ that the audience grew restless within minutes.","options":["tedious","provocative","insightful","monotonous","brief","humorous"],"answer":[0,3],"solution":"Idea clave: \"so ___ that\" + efecto (el público se inquietó) → la palabra causa aburrimiento.\nPaso a paso:\n1) La gente se inquieta en minutos → los comentarios aburrían.\n2) Par: tedious (tedioso) y monotonous (monótono) ✓.\nVocabulario: provocative = provocador; insightful = perspicaz; brief = breve; humorous = gracioso.\nCómo comprobarlo: ambas causan aburrimiento.\nTrampa: provocative podría inquietar al público, pero no tiene par.\nPara la próxima: si una opción solo encaja con una interpretación forzada y no tiene pareja, descártala.","cat":"ver"},{"type":"rc","pid":"P1","topic":"Lectura: idea principal","difficulty":"media","stem":"The passage is primarily concerned with","options":["arguing that the beak hypothesis has been conclusively disproven","describing two explanations for a biological ability and evidence bearing on them","explaining why migratory birds have difficulty navigating near cities","challenging the claim that birds can detect magnetic fields","proposing a new mechanism for magnetic sensing in birds"],"answer":1,"solution":"Idea clave: la idea principal debe cubrir TODO el texto, no un solo párrafo ni un detalle.\nPaso a paso:\n1) Resume cada párrafo: (1) dos hipótesis sobre cómo detectan el campo magnético; (2) evidencia a favor y en contra de cada una.\n2) Une los resúmenes: \"describe dos explicaciones y la evidencia sobre ellas\" → B.\n3) Descarta: A exagera (\"conclusively\"); C es un detalle menor; D contradice el texto; E (nadie propone algo nuevo).\nCómo comprobarlo: B debe poder ser el título de todo el texto. Lo es.\nTrampa: A usa palabras del texto, pero con \"conclusively\". El texto dice \"setback\", no \"refutación definitiva\".\nPara la próxima: desconfía de palabras extremas (conclusively, always, never, entirely) en las opciones de lectura.","cat":"ver"},{"type":"rc","pid":"P1","topic":"Lectura: detalle","difficulty":"media","stem":"According to the passage, the iron-rich cells in the upper beak","options":["transmit magnetic information through the trigeminal nerve","contain light-sensitive proteins","turned out to be immune cells unconnected to nerves","are disrupted by weak radio-frequency noise","are found only in migratory species"],"answer":2,"solution":"Idea clave: en preguntas de detalle (\"According to the passage\"), la respuesta está escrita en el texto. Búscala.\nPaso a paso:\n1) Ubica \"iron-rich cells\": aparecen en el párrafo 1 (la hipótesis) y en el párrafo 2 (lo que se descubrió).\n2) El párrafo 2 dice que se identificaron como células inmunes sin conexión con nervios → C.\nCómo comprobarlo: la respuesta casi repite el texto con otras palabras.\nTrampa: A es lo que proponía la hipótesis, no lo que se encontró.\nPara la próxima: en preguntas de detalle, regresa al texto y lee la oración exacta antes de responder; no confíes en la memoria.","cat":"ver"},{"type":"rc","pid":"P1","multi":true,"topic":"Lectura: inferencia","difficulty":"difícil","stem":"Which of the following can be inferred from the passage about the eye hypothesis?","options":["It predicts that magnetic orientation can be disrupted by weak radio-frequency noise.","It gains direct support from the finding that the beak cells are immune cells.","Its proponents can offer an explanation for why a fragile sense might nevertheless have evolved."],"answer":[0,2],"solution":"Idea clave: en \"select all that apply\", evalúa cada opción por separado como verdadero o falso según el texto.\nPaso a paso:\n1) A: \"the eye hypothesis makes a striking prediction… disrupted by weak radio-frequency noise\" ✓.\n2) B: que las células del pico sean inmunes debilita la hipótesis del pico; el texto no dice que eso respalde la del ojo ✗.\n3) C: la última oración da una explicación de por qué un sentido frágil pudo evolucionar (antes casi no había ese ruido) ✓.\nCómo comprobarlo: para cada opción marcada, encuentra la oración del texto que la respalda.\nTrampa: B suena lógica (si una hipótesis cae, la otra gana), pero el texto no lo afirma.\nPara la próxima: inferir en el GRE significa \"lo que el texto obliga a concluir\", no \"lo que suena razonable\".","cat":"ver"},{"type":"rc","pid":"P2","topic":"Lectura: propósito","difficulty":"media","stem":"The author's primary purpose is to","options":["defend Hardin's recommendation that common resources be privatized","compare irrigation systems in Switzerland and the Philippines","argue that common ownership is superior to private ownership","describe how a scholar qualified a widely accepted conclusion","explain why monitoring is the most important condition for managing shared resources"],"answer":3,"solution":"Idea clave: el propósito del autor es la acción que hace el texto completo: describir, argumentar, criticar, comparar.\nPaso a paso:\n1) Párrafo 1: Hardin concluye algo y Ostrom cuestiona sus supuestos.\n2) Párrafo 2: los hallazgos de Ostrom y su verdadero alcance.\n3) Acción del texto: describir cómo una investigadora matizó una conclusión aceptada → D.\nCómo comprobarlo: \"qualified\" = matizó, no rechazó por completo. El final (\"not always succeeds… contingent\") es justo un matiz.\nTrampa: C exagera; el texto dice que muchas experiencias fallaron.\nPara la próxima: fíjate en el verbo de cada opción (defend, compare, argue, describe, explain) y compáralo con lo que hace el texto.","cat":"ver"},{"type":"rc","pid":"P2","topic":"Lectura: detalle","difficulty":"media","stem":"According to the passage, Ostrom's challenge to Hardin consisted mainly in","options":["showing that Hardin's reasoning contained a logical error","arguing that state control is more effective than privatization","questioning the assumptions on which his model was based","demonstrating that all common resources can be sustained indefinitely","proving that resource users always communicate with one another"],"answer":2,"solution":"Idea clave: busca en el texto la oración que describe el método de Ostrom.\nPaso a paso:\n1) El texto dice: \"not by disputing Hardin's logic but by questioning its premises\".\n2) Premisas = supuestos → C.\nCómo comprobarlo: el texto enumera esos supuestos (usuarios que no se comunican, no se observan, no hacen acuerdos).\nTrampa: A dice justo lo que el texto niega. E usa \"always\", pero el texto dice \"frequently\".\nPara la próxima: la estructura \"not X but Y\" te da la respuesta (Y) y una trampa (X) en la misma oración.","cat":"ver"},{"type":"rc","pid":"P2","multi":true,"topic":"Lectura: inferencia","difficulty":"difícil","stem":"The passage suggests which of the following about the cases Ostrom studied?","options":["Some involved shared resources that were not sustained successfully.","They included resources that users had managed for very long periods.","They showed that graduated sanctions are unnecessary when boundaries are clearly defined."],"answer":[0,1],"solution":"Idea clave: evalúa cada afirmación contra una frase concreta del texto.\nPaso a paso:\n1) A: \"many of her cases were failures\" ✓.\n2) B: recursos sostenidos \"for centuries\" ✓.\n3) C: las sanciones graduales son una de las condiciones de éxito, no algo innecesario ✗.\nCómo comprobarlo: subraya las frases que respaldan A y B.\nTrampa: C mezcla dos condiciones de la lista y crea una relación que el texto no establece.\nPara la próxima: en \"select all\", cuidado con las opciones que conectan dos ideas del texto de forma inventada.","cat":"ver"},{"type":"rc","pid":"P2","topic":"Lectura: vocabulario en contexto","difficulty":"media","stem":"In the context in which it appears, \"contingent\" most nearly means","options":["inevitable","dependent on circumstances","temporary","accidental","widely disputed"],"answer":1,"solution":"Idea clave: en preguntas de vocabulario en contexto, la palabra suele usarse en un sentido distinto al más común. Sustituye cada opción en la oración.\nPaso a paso:\n1) Contexto: Hardin dijo que el resultado era \"inevitable\"; Ostrom mostró que depende de condiciones (límites, reglas, monitoreo).\n2) Contingent aquí = que depende de las circunstancias → B.\n3) Sustituye: \"the outcome… is, in fact, dependent on circumstances\" ✓.\nTrampa: accidental es otro significado de contingent, pero el texto habla de condiciones identificables, no de azar.\nPara la próxima: la palabra suele oponerse a algo cercano (aquí, \"inevitable\"). Usa ese opuesto como pista.","cat":"ver"},{"type":"rc","pid":"P3","topic":"Lectura: actitud del autor","difficulty":"media","stem":"The author's attitude toward \"the familiar story of embattled outsiders\" is best described as","options":["wholehearted endorsement","amused indifference","outright contempt","qualified skepticism","reluctant acceptance"],"answer":3,"solution":"Idea clave: la actitud del autor se ve en palabras que matizan: \"in one sense\", \"yet\", \"overstates\".\nPaso a paso:\n1) El autor admite que hubo una ruptura real (\"in one sense it was\").\n2) Pero dice que la historia exagera (\"overstates the break\").\n3) Acepta parte y cuestiona parte → escepticismo matizado → D.\nCómo comprobarlo: no rechaza la historia por completo ni la acepta del todo.\nTrampa: C (desprecio total) y A (aprobación total) son extremos.\nPara la próxima: en preguntas de actitud del GRE, las respuestas correctas casi siempre son moderadas (qualified, measured, cautious).","cat":"ver"},{"type":"rc","pid":"P3","topic":"Lectura: detalle","difficulty":"media","stem":"According to the passage, the oil sketch was","options":["a genre invented by the Impressionists","a preparatory exercise long required in academic training","forbidden by the official Salon","characterized by historical subjects","rarely practiced before the 1870s"],"answer":1,"solution":"Idea clave: pregunta de detalle; la respuesta está en una oración específica del texto.\nPaso a paso:\n1) Ubica \"oil sketch\": \"a genre that academic teachers had long required of their students as a preparatory exercise\".\n2) Eso es B.\nCómo comprobarlo: la opción B casi repite el texto con otras palabras.\nTrampa: A. Los impresionistas no inventaron el boceto; lo exhibieron como obra terminada.\nPara la próxima: si una opción atribuye un \"invento\" o una \"primera vez\", verifica que el texto lo diga literalmente.","cat":"ver"},{"type":"rc","pid":"P3","multi":true,"topic":"Lectura: inferencia","difficulty":"difícil","stem":"It can be inferred that the author would agree with which of the following statements?","options":["The Impressionists' rejection of academic subject matter was genuine.","The Impressionists' treatment of light had roots in academic practice.","The Impressionists developed a painting technique unknown to academic painters."],"answer":[0,1],"solution":"Idea clave: el autor \"would agree\" con lo que se desprende directamente de sus afirmaciones.\nPaso a paso:\n1) A: \"in one sense it was\" una revuelta real contra los temas académicos ✓.\n2) B: su atención a la luz \"owed much to the oil sketch\", una práctica académica ✓.\n3) C: el autor dice que la innovación NO fue una técnica nueva ✗.\nCómo comprobarlo: la última oración del texto contradice C de forma directa.\nTrampa: C suena a la versión popular del impresionismo, que es justo lo que el autor matiza.\nPara la próxima: si el autor corrige una creencia popular, las opciones que repiten esa creencia son trampa.","cat":"ver"},{"type":"rc","pid":"P4","topic":"Lectura: idea principal","difficulty":"media","stem":"The passage is primarily concerned with","options":["refuting the claim that sleep benefits memory","describing techniques for improving recall","evaluating two explanations for an observed effect","explaining the phases of slow-wave sleep","arguing that interference has no effect on memory"],"answer":2,"solution":"Idea clave: la idea principal resume la estructura del texto: dos explicaciones, sus predicciones y la evidencia.\nPaso a paso:\n1) Párrafo 1: el efecto (dormir ayuda a recordar) y dos explicaciones (pasiva y activa).\n2) Párrafo 2: cómo distinguirlas y qué dice la evidencia.\n3) Resumen: evaluar dos explicaciones de un efecto observado → C.\nTrampa: A contradice el texto, que da por hecho que el sueño ayuda.\nPara la próxima: si el texto presenta \"two accounts\", \"two hypotheses\" o \"competing views\", la idea principal casi siempre es compararlas o evaluarlas.","cat":"ver"},{"type":"rc","pid":"P4","topic":"Lectura: función","difficulty":"difícil","stem":"The author mentions \"a period of quiet wakefulness without new input\" primarily in order to","options":["suggest that rest is preferable to sleep for learning","show that replay can occur while a person is awake","refute the active account of memory consolidation","explain why people remember less after waking","identify a condition under which the passive account predicts the same benefit as sleep"],"answer":4,"solution":"Idea clave: en preguntas de función (\"in order to\"), pregunta qué papel cumple esa frase en el argumento.\nPaso a paso:\n1) La frase aparece en: \"If sleep only prevents interference, then a period of quiet wakefulness… should benefit memory as much as sleep does.\"\n2) Es una prueba: la explicación pasiva predice que la vigilia tranquila debería dar el mismo beneficio que el sueño.\n3) Su función: identificar esa condición de prueba → E.\nTrampa: C. El resultado sí favorece la explicación activa, pero la frase en sí define la prueba; no refuta nada.\nPara la próxima: distingue entre lo que dice una frase y para qué la usa el autor. Las preguntas de función piden lo segundo.","cat":"ver"},{"type":"rc","pid":"P4","multi":true,"topic":"Lectura: afirmaciones respaldadas","difficulty":"difícil","stem":"Which of the following statements are supported by the passage?","options":["Quiet wakefulness without new input improves memory to some degree.","Playing a cue during sleep improved recall of all learned material equally.","The author considers the passive account to have been conclusively disproven."
