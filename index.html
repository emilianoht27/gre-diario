<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRE diario</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GRE diario">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#24475E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF0; --paper:#FFFFFF; --ink:#1B2430; --muted:#5B6673; --line:#C9D2DA; --soft:#F3F6F8;
  --bar:#24475E; --bar-ink:#FFFFFF; --bar2:#D7E0E7; --bar2-ink:#1F3445;
  --accent:#0F6E8C; --accent-ink:#FFFFFF; --mark:#A86A12; --ok:#2F7D4F; --bad:#B23B3B; --focus:#F2B705;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171C; --paper:#1A2229; --ink:#E4E9EE; --muted:#9AA6B2; --line:#34424E; --soft:#212B33;
    --bar:#0E2A3A; --bar-ink:#EAF2F7; --bar2:#22313C; --bar2-ink:#D5E0E8;
    --accent:#5FB3D1; --accent-ink:#0B1A22; --mark:#E0A84A; --ok:#6CC08E; --bad:#F08080; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171C; --paper:#1A2229; --ink:#E4E9EE; --muted:#9AA6B2; --line:#34424E; --soft:#212B33;
  --bar:#0E2A3A; --bar-ink:#EAF2F7; --bar2:#22313C; --bar2-ink:#D5E0E8;
  --accent:#5FB3D1; --accent-ink:#0B1A22; --mark:#E0A84A; --ok:#6CC08E; --bad:#F08080; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.serif{font-family:"Source Serif 4",Georgia,serif}
.muted{color:var(--muted)} .small{font-size:.875rem} .pre{white-space:pre-wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.link{border:none;background:none;padding:6px;color:var(--accent);text-decoration:underline;min-height:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* shell */
.shell{height:100%;display:flex;flex-direction:column}
.head{background:var(--bar);color:var(--bar-ink);padding:14px 18px 12px}
.head h1{margin:0;font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.5rem;line-height:1.2}
.head p{margin:2px 0 0;opacity:.8;font-size:.9rem}
.main{flex:1;overflow:auto;padding:16px;min-height:0}
.wrap{max-width:640px;margin:0 auto}
.nav{display:flex;background:var(--paper);border-top:1px solid var(--line)}
.nav button{flex:1;background:none;border:none;padding:10px 4px 12px;font-weight:600;font-size:.8rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:1.1rem}
.big{font-family:"Source Serif 4",Georgia,serif;font-size:2.6rem;font-weight:600;line-height:1}
.notice{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:.92rem}
.notice.err{border-color:var(--bad)} .notice.warn{border-color:var(--mark)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stat div{background:var(--soft);border-radius:6px;padding:10px;text-align:center}
.stat strong{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.list button{all:unset;box-sizing:border-box;display:flex;width:100%;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list button:focus-visible{outline:3px solid var(--focus)}
.pill{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.field{margin:14px 0}
.field > label,.field > .lbl{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.input{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--paper);width:100%;min-height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
input[type=range]{width:100%}

/* exam */
.exam{height:100%;display:flex;flex-direction:column;background:var(--paper)}
.tbar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:52px}
.tbar .ttl{font-weight:600;font-size:.95rem}
.tbtn{background:transparent;color:var(--bar-ink);border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:.85rem;min-height:36px}
.tbtn[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.sbar{background:var(--bar2);color:var(--bar2-ink);display:flex;align-items:center;gap:12px;padding:6px 12px;font-size:.85rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.stage{flex:1;overflow:auto;min-height:0}
.qpad{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.passage{font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem;line-height:1.65;white-space:pre-wrap;background:var(--soft);border-left:3px solid var(--line);padding:14px 16px;margin-bottom:18px;border-radius:0 6px 6px 0}
.q-dir{font-size:.88rem;color:var(--muted);margin:0 0 12px;font-style:italic}
.q-stem{font-family:"Source Serif 4",Georgia,serif;font-size:1.12rem;line-height:1.6;white-space:pre-wrap;margin-bottom:18px}
.qc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.qc div{border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center}
.qc b{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-family:"Public Sans",sans-serif}
.qc span{font-family:"Source Serif 4",Georgia,serif;font-size:1.1rem;white-space:pre-wrap}
.qc-info{text-align:center;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;margin-bottom:12px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:none;border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;width:100%;min-height:48px}
.opt .mk{flex:none;width:22px;height:22px;border:2px solid var(--ink);margin-top:1px;display:grid;place-items:center;border-radius:50%}
.opt.sq .mk{border-radius:3px}
.opt[aria-checked="true"]{border-color:var(--ink)}
.opt[aria-checked="true"] .mk{background:var(--ink)}
.opt[aria-checked="true"] .mk::after{content:"";width:8px;height:8px;background:var(--paper);border-radius:50%}
.opt.sq[aria-checked="true"] .mk::after{border-radius:0;width:10px;height:5px;background:none;border-left:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.opt .ot{font-family:"Source Serif 4",Georgia,serif;font-size:1.04rem;white-space:pre-wrap}
.blank{margin-bottom:14px}
.blank h3{font-size:.85rem;margin:0 0 6px;color:var(--muted)}
.numbox{font-size:1.25rem;width:12ch;padding:10px;border:2px solid var(--ink);border-radius:3px;background:var(--paper);font-variant-numeric:tabular-nums}
.foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--paper)}
.foot .btn{flex:1}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.dots button{width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.dots button.done{background:var(--soft);border-color:var(--ink)}
.dots button.cur{outline:3px solid var(--accent);outline-offset:1px}
.dots button.flag{border-color:var(--mark);color:var(--mark)}

/* results */
.res-q{border-top:1px solid var(--line);padding:16px 0}
.res-q .tag{font-size:.78rem;color:var(--muted)}
.ok{color:var(--ok);font-weight:700} .bad{color:var(--bad);font-weight:700}
.sol{background:var(--soft);border-radius:6px;padding:12px 14px;margin-top:10px;white-space:pre-wrap;font-size:.95rem;line-height:1.55}
.sol b{display:block;margin-bottom:4px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;padding:4px 0}
.ansline{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.92rem;margin-top:8px}

/* calculator */
.calc{position:fixed;z-index:30;width:260px;background:var(--soft);border:2px solid var(--bar);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none}
.calc-h{background:var(--bar);color:var(--bar-ink);padding:6px 8px 6px 12px;display:flex;align-items:center;cursor:move;touch-action:none;font-weight:600;font-size:.9rem;border-radius:5px 5px 0 0}
.calc-h button{margin-left:auto;background:none;border:none;color:inherit;font-size:1.3rem;cursor:pointer;padding:0 8px}
.calc-d{margin:10px;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums;font-size:1.5rem;min-height:48px;position:relative;white-space:nowrap;overflow:hidden}
.calc-d .m{position:absolute;left:8px;top:4px;font-size:.7rem;color:var(--muted)}
.calc-g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 10px 10px}
.calc-g button{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:10px 0;cursor:pointer;font-weight:600;touch-action:manipulation}
.calc-g button.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.calc-t{margin:0 10px 10px;width:calc(100% - 20px)}
@media (max-width:560px){
  .calc{left:0 !important;right:0;top:auto !important;bottom:0;width:100%;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .calc-h{cursor:default}
}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--paper);width:100%;max-width:520px;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));border-radius:12px 12px 0 0}
.modal h2{margin:0 0 8px;font-size:1.2rem}
@media (min-width:561px){.ov{align-items:center}.modal{border-radius:10px}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;z-index:60;font-weight:500;max-width:90vw}

.data{margin:0 0 18px;padding:0}
.data figcaption{font-weight:700;font-size:.92rem;margin-bottom:8px;text-align:center}
.tblwrap{overflow-x:auto}
.tbl{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 12px;text-align:right}
.tbl thead th{background:var(--bar2);color:var(--bar2-ink);text-align:center}
.tbl tbody th{text-align:left;font-weight:600}
.chartwrap,.figwrap{overflow-x:auto;text-align:center}
svg.chart{width:100%;max-width:440px;height:auto}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .axis{stroke:var(--ink);stroke-width:1.2}
svg.chart .tick{font-size:10px;fill:var(--muted);font-family:"Public Sans",system-ui,sans-serif}
svg.chart .val{font-size:9.5px;fill:var(--ink);font-family:"Public Sans",system-ui,sans-serif}
svg.chart .bar.s0{fill:var(--accent)} svg.chart .bar.s1{fill:var(--mark)} svg.chart .bar.s2{fill:var(--ok)}
svg.chart .ln{fill:none;stroke-width:2.2} svg.chart .ln.s0{stroke:var(--accent)} svg.chart .ln.s1{stroke:var(--mark)} svg.chart .ln.s2{stroke:var(--ok)}
svg.chart .dot.s0{fill:var(--accent)} svg.chart .dot.s1{fill:var(--mark)} svg.chart .dot.s2{fill:var(--ok)}
.legend{display:flex;gap:14px;justify-content:center;font-size:.85rem;margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.s0{background:var(--accent)} .legend i.s1{background:var(--mark)} .legend i.s2{background:var(--ok)}
svg.fig{width:100%;max-width:360px;height:auto}
svg.fig .shape{fill:none;stroke:var(--ink);stroke-width:1.6}
svg.fig .shape.dash{stroke-dasharray:5 4} svg.fig .shape.thin{stroke-width:1.1}
svg.fig .axis2{stroke:var(--muted);stroke-width:1.2}
svg.fig .pdot{fill:var(--ink)}
svg.fig .flabel{font-size:14px;fill:var(--ink);font-family:"Source Serif 4",Georgia,serif}
svg.fig .flabel.sm{font-size:13px} svg.fig .flabel.it{font-style:italic}
.passage.sp p{margin:0 0 12px}
.passage.sp .sent{cursor:pointer;border-radius:3px;padding:1px 0;transition:background .15s}
.passage.sp .sent:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.passage.sp .sent[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 30%,transparent);outline:1px solid var(--accent)}
.awa-prompt{font-family:"Source Serif 4",Georgia,serif;font-size:1.1rem;line-height:1.55;font-weight:600;white-space:pre-wrap;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin-bottom:12px}
textarea.essay{width:100%;min-height:52vh;border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--paper);font-family:"Public Sans",system-ui,sans-serif;font-size:1rem;line-height:1.55;resize:vertical}
.sol{white-space:normal}
.sol .sol-h{font-size:1rem;margin-bottom:6px}
.sol p{margin:6px 0}
.sol .sol-l strong{color:var(--accent)}
.sol .sol-s.step{padding-left:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ---------------- helpers ---------------- */
const app = document.getElementById('app');
function h(tag, attrs, ...kids){
  const el = document.createElement(tag); let val;
  if(attrs){ for(const k in attrs){ const v = attrs[k]; if(v == null || v === false) continue;
    if(k === 'class') el.className = v; else if(k === 'text') el.textContent = v; else if(k === 'value') val = v;
    else if(k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if(typeof v === 'boolean') el[k] = v; else el.setAttribute(k, v); } }
  for(const c of kids.flat(Infinity)){ if(c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  if(val !== undefined) el.value = val; return el;
}
const clone = o => JSON.parse(JSON.stringify(o == null ? null : o));
const L5 = 'ABCDEFGH';
function toast(m){ const t = h('div',{class:'toast',role:'status',text:m}); document.body.append(t); setTimeout(()=>t.remove(), 3000); }
function fmtTime(s){ s = Math.max(0, Math.ceil(s)); const m = Math.floor(s/60); return m + ':' + String(s%60).padStart(2,'0'); }
function dkey(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dlabel(k){ const [y,m,d] = k.split('-').map(Number); const dt = new Date(y, m-1, d); const today = dkey(); const t2 = new Date(); t2.setDate(t2.getDate()-1);
  if(k === today) return 'Hoy'; if(k === dkey(t2)) return 'Ayer';
  return dt.toLocaleDateString('es-MX',{weekday:'long', day:'numeric', month:'short'}); }
function parseNum(s){
  if(s == null) return null; s = String(s).trim().replace(/\s/g,''); if(!s) return null;
  if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){ const [n,d] = s.split('/').map(Number); return d ? n/d : null; }
  if(/^-?\d+,\d+$/.test(s)) s = s.replace(',','.'); else s = s.replace(/,/g,'');
  const n = Number(s); return isFinite(n) ? n : null;
}
const sameSet = (a,b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length && [...a].sort().every((x,i)=>x === [...b].sort()[i]);

/* ---------------- item model ---------------- */
const TYPES = {
  qc:{sec:'Q', name:'Comparación cuantitativa'}, mc:{sec:'Q', name:'Opción única'}, ms:{sec:'Q', name:'Una o más respuestas'}, ne:{sec:'Q', name:'Respuesta numérica'},
  tc:{sec:'V', name:'Completar texto'}, se:{sec:'V', name:'Equivalencia de oraciones'}, rc:{sec:'V', name:'Comprensión de lectura'}, sp:{sec:'V', name:'Seleccionar oración del texto'}
};
const QC_OPTS = ['Quantity A is greater.','Quantity B is greater.','The two quantities are equal.','The relationship cannot be determined from the information given.'];
const EN_TYPE = {qc:'Quantitative Comparison', mc:'Multiple Choice', ms:'Multiple Choice: Select One or More', ne:'Numeric Entry', tc:'Text Completion', se:'Sentence Equivalence', rc:'Reading Comprehension', sp:'Reading Comprehension: Select in Passage'};
function sentencesOf(p){ const out = []; String(p||'').split(/\n\s*\n/).forEach((para, pi) => { (para.match(/[^.!?]+(?:[.!?]+["”’)]*|$)/g) || []).forEach(x => { const t = x.trim(); if(t) out.push({t, p:pi}); }); }); return out; }
function isMultiPick(q){ return q.type === 'ms' || q.type === 'se' || (q.type === 'rc' && q.multi); }
function optsOf(q){ return q.type === 'qc' ? QC_OPTS : q.type === 'sp' ? sentencesOf(q.passage).map(x => x.t) : (q.options || []); }
function isAnswered(q, v){
  if(v == null) return false;
  if(q.type === 'tc') return Array.isArray(v) && v.length === q.blanks.length && v.every(x => typeof x === 'number');
  if(q.type === 'se') return Array.isArray(v) && v.length === 2;
  if(isMultiPick(q)) return Array.isArray(v) && v.length > 0;
  if(q.type === 'ne') return String(v).trim() !== '';
  return typeof v === 'number';
}
function isCorrect(q, v){
  if(!isAnswered(q, v)) return false;
  if(q.type === 'tc') return v.every((x,i) => x === q.answer[i]);
  if(isMultiPick(q)) return sameSet(v, q.answer);
  if(q.type === 'ne'){ const a = parseNum(v), b = parseNum(q.answer); if(a == null || b == null) return false; const t = Math.abs(parseNum(q.tolerance) || 0); return Math.abs(a-b) <= t + 1e-9*Math.max(1,Math.abs(b)); }
  return v === q.answer;
}
function ansText(q, v){
  if(!isAnswered(q, v) && !(q.type==='se' && Array.isArray(v) && v.length)) return 'Sin respuesta';
  const o = optsOf(q);
  if(q.type === 'tc') return v.map((x,i) => x == null ? '—' : q.blanks[i][x]).join(' / ');
  if(q.type === 'sp') return '“' + (o[v] || '') + '”';
  if(Array.isArray(v)) return [...v].sort().map(i => L5[i] + ') ' + o[i]).join(' · ');
  if(q.type === 'ne') return String(v);
  return L5[v] + ') ' + o[v];
}
function keyText(q){
  const o = optsOf(q);
  if(q.type === 'tc') return q.answer.map((x,i) => q.blanks[i][x]).join(' / ');
  if(q.type === 'sp') return '“' + (o[q.answer] || '') + '”';
  if(Array.isArray(q.answer)) return [...q.answer].sort().map(i => L5[i] + ') ' + o[i]).join(' · ');
  if(q.type === 'ne') return String(q.answer);
  return L5[q.answer] + ') ' + o[q.answer];
}
function validItem(q){
  try{
    if(!q || !TYPES[q.type] || !validData(q) || typeof q.stem !== 'string' || (!q.stem.trim() && q.type !== 'qc') || typeof q.solution !== 'string' || !q.solution.trim()) return false;
    const n = (q.options||[]).length, ix = i => Number.isInteger(i) && i >= 0;
    switch(q.type){
      case 'qc': return typeof q.quantityA === 'string' && typeof q.quantityB === 'string' && ix(q.answer) && q.answer < 4;
      case 'mc': return n === 5 && ix(q.answer) && q.answer < n;
      case 'ms': return n >= 3 && n <= 8 && Array.isArray(q.answer) && q.answer.length >= 1 && q.answer.every(i => ix(i) && i < n);
      case 'ne': return parseNum(q.answer) != null;
      case 'tc': return Array.isArray(q.blanks) && q.blanks.length >= 1 && q.blanks.length <= 3 && q.blanks.every(b => Array.isArray(b) && b.length === (q.blanks.length === 1 ? 5 : 3)) && Array.isArray(q.answer) && q.answer.length === q.blanks.length && q.answer.every((a,i) => ix(a) && a < q.blanks[i].length);
      case 'se': return n === 6 && Array.isArray(q.answer) && q.answer.length === 2 && q.answer.every(i => ix(i) && i < 6) && q.answer[0] !== q.answer[1];
      case 'sp': return typeof q.passage === 'string' && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < sentencesOf(q.passage).length && sentencesOf(q.passage).length >= 3;
      case 'rc': return typeof q.passage === 'string' && q.passage.trim().length > 40 && (q.multi ? n === 3 && Array.isArray(q.answer) && q.answer.length >= 1 && q.answer.every(i => ix(i) && i < 3) : n === 5 && ix(q.answer) && q.answer < 5);
    }
  }catch(e){}
  return false;
}
function normalizeItem(q){
  if(typeof q.stem !== 'string') q.stem = q.stem == null ? '' : String(q.stem);
  if(q.type === 'sp'){ q.options = []; if(typeof q.answerSentence === 'string' && q.answerSentence.trim() && typeof q.passage === 'string'){ const ss = sentencesOf(q.passage).map(x => norm2(x.t)); const a = norm2(q.answerSentence); let k = ss.findIndex(x => x === a); if(k < 0) k = ss.findIndex(x => x.includes(a) || a.includes(x)); if(k >= 0) q.answer = k; } }
  if(q.type === 'tc' && typeof q.answer === 'number') q.answer = [q.answer];
  if((q.type === 'ms' || q.type === 'se' || (q.type === 'rc' && q.multi)) && typeof q.answer === 'number') q.answer = [q.answer];
  if(q.type === 'rc' && !q.multi && Array.isArray(q.answer) && q.answer.length === 1) q.answer = q.answer[0];
  if(q.type === 'ne') q.answer = String(q.answer);
  if(Array.isArray(q.answer) && q.type !== 'tc') q.answer = [...new Set(q.answer)].sort((a,b)=>a-b);
  return q;
}
function keyMatches(q, a){
  if(a == null || a === 'flag') return false;
  if(q.type === 'tc'){ const arr = Array.isArray(a) ? a : [a]; return arr.length === q.answer.length && arr.every((x,i) => Number(x) === q.answer[i]); }
  if(isMultiPick(q)){ const arr = (Array.isArray(a) ? a : [a]).map(Number); return sameSet([...new Set(arr)], q.answer); }
  if(q.type === 'ne'){ const x = parseNum(a), y = parseNum(q.answer); return x != null && y != null && Math.abs(x-y) <= Math.abs(parseNum(q.tolerance)||0) + 1e-9*Math.max(1,Math.abs(y)); }
  return Number(Array.isArray(a) ? a[0] : a) === q.answer;
}


function norm2(s){ return String(s||'').toLowerCase().replace(/[“”"’']/g,'').replace(/\s+/g,' ').trim(); }
const isNum = x => typeof x === 'number' && isFinite(x);
const isPt = p => Array.isArray(p) && p.length === 2 && isNum(p[0]) && isNum(p[1]);
function validData(q){
  if(q.table != null){ const t = q.table; if(typeof t !== 'object' || !Array.isArray(t.headers) || !Array.isArray(t.rows) || !t.rows.length || t.rows.length > 15 || !t.rows.every(r => Array.isArray(r) && r.length === t.headers.length)) return false; }
  if(q.chart != null){ const c = q.chart; if(typeof c !== 'object' || !['bar','line'].includes(c.type) || !Array.isArray(c.categories) || !c.categories.length || c.categories.length > 12 || !Array.isArray(c.series) || !c.series.length || c.series.length > 3 || !c.series.every(s => Array.isArray(s.values) && s.values.length === c.categories.length && s.values.every(isNum))) return false; }
  if(q.figure != null){ const f = q.figure; if(typeof f !== 'object' || !isNum(f.width) || !isNum(f.height) || f.width > 500 || f.height > 500) return false;
    const pts = f.points || {}; if(typeof pts !== 'object' || !Object.values(pts).every(isPt)) return false;
    if(f.segments && !(Array.isArray(f.segments) && f.segments.every(s => Array.isArray(s) && pts[s[0]] && pts[s[1]]))) return false;
    if(f.lines && !(Array.isArray(f.lines) && f.lines.every(l => isPt(l.from) && isPt(l.to)))) return false;
    if(f.circles && !(Array.isArray(f.circles) && f.circles.every(c => pts[c.center] && isNum(c.radius)))) return false;
    if(f.labels && !(Array.isArray(f.labels) && f.labels.every(l => isPt(l.at) && typeof l.text === 'string'))) return false; }
  return true;
}
const BANK = {"passages":{"P1":"For decades, researchers have known that many migratory birds can detect Earth's magnetic field, but the mechanism has remained elusive. One hypothesis holds that iron-rich cells in the upper beak act as tiny compasses, transmitting information to the brain through the trigeminal nerve. A competing hypothesis locates the sense in the eye, where light-sensitive proteins called cryptochromes may undergo chemical reactions whose outcomes depend on the orientation of the magnetic field.\n\nThe beak hypothesis suffered a serious setback when the iron-rich cells were identified as immune cells with no connection to nerves. The eye hypothesis, meanwhile, makes a striking prediction: because the reactions it posits are extremely delicate, they should be disrupted by weak radio-frequency noise. Experiments have borne this out—birds exposed to the faint electromagnetic noise of ordinary electronic equipment lose their ability to orient. Some researchers regard this sensitivity as strong evidence for the eye hypothesis, since an iron-based compass would not be so fragile. Others treat it as a puzzle: how could natural selection have favored a sense so easily jammed? A likely answer is that, until very recently, the natural environment contained almost no radio-frequency noise of the relevant strength.","P2":"In 1968 the ecologist Garrett Hardin argued that any resource held in common—a pasture, a fishery—would inevitably be overused, because each user captures the full benefit of taking a little more while bearing only a fraction of the cost. Hardin concluded that such resources must be either privatized or placed under state control. The political economist Elinor Ostrom challenged this conclusion not by disputing Hardin's logic but by questioning its premises. Hardin's model, she noted, assumed users who cannot communicate, cannot observe one another, and cannot make binding agreements. Real communities, she found, frequently can do all three.\n\nDrawing on case studies ranging from Swiss alpine meadows to Philippine irrigation systems, Ostrom identified conditions under which users had sustained shared resources for centuries: clearly defined boundaries, rules adapted to local circumstances, monitoring by the users themselves, and graduated sanctions for violators. Her work did not show that common ownership always succeeds; many of her cases were failures. It showed instead that the outcome Hardin called inevitable is, in fact, contingent.","P3":"Impressionism is often described as a revolt against the academic painting of nineteenth-century France, and in one sense it was: the Impressionists rejected the polished surfaces, historical subjects, and studio lighting favored by the official Salon. Yet the familiar story of embattled outsiders overstates the break. Several leading Impressionists had trained in academic studios, and their celebrated attention to the fleeting effects of light owed much to the oil sketch, a genre that academic teachers had long required of their students as a preparatory exercise. What the Impressionists did was to exhibit such sketches as finished works. The innovation, in other words, lay less in a new technique than in a new judgment about which of the painter's existing practices deserved to be called art.","P4":"It has long been known that people remember newly learned material better after a night's sleep than after an equal period of wakefulness. The simplest explanation is passive: sleep merely shields new memories from the interference of fresh experiences. A more ambitious account holds that sleep actively strengthens memories, as the brain replays the day's experiences during particular phases of slow-wave sleep.\n\nThe two accounts make different predictions. If sleep only prevents interference, then a period of quiet wakefulness without new input should benefit memory as much as sleep does. Studies have found that quiet wakefulness does help—but not as much. Moreover, researchers who play a sound associated with a learned task to sleeping subjects, thereby apparently prompting replay of that task, find selectively improved recall of the cued material. Neither finding refutes the passive account outright, but together they are difficult to explain without some active process.","P5":"A city council found that neighborhoods with more streetlights had lower rates of nighttime burglary than neighborhoods with fewer streetlights. The council therefore proposed installing additional streetlights in the neighborhoods with the highest burglary rates, predicting that nighttime burglary in those neighborhoods would decline.","P6":"Readers of Victorian fiction often complain about its coincidences: the long-lost relative who appears at the decisive moment, the letter that arrives a day too late. Modern critics have tended to treat such devices as lapses, concessions to the demands of serial publication or to a public that cared more about suspense than plausibility. But this judgment may say more about our assumptions than about the novels. Many Victorian writers and readers inhabited a religious culture in which the idea of providence—an order guiding apparently random events—was taken seriously. For them, a well-timed coincidence need not signal authorial carelessness; it could express a conviction that the world itself was meaningfully arranged. To read such moments as failures of realism is to assume that the novelists were attempting, and falling short of, a kind of realism they may not have wanted."},"items":[{"type":"qc","topic":"Álgebra: potencias","difficulty":"media","info":"x > 1","quantityA":"x²","quantityB":"x","answer":0,"solution":"Idea clave: multiplicar ambos lados de una desigualdad por un número positivo no cambia el sentido de la desigualdad.\nPaso a paso:\n1) Partes de lo que sabes: x > 1.\n2) Como x > 1, x es positivo. Multiplica ambos lados por x: x·x > 1·x, es decir, x² > x.\n3) Entonces A (x²) siempre es mayor que B (x).\nCómo comprobarlo: prueba un número cerca del límite y uno grande. x = 1.1 → 1.21 > 1.1; x = 10 → 100 > 10. En ambos casos gana A.\nTrampa: elegir D porque \"x² vs x depende\". Sí depende, pero solo cuando x puede estar entre 0 y 1 o ser negativo; la condición x > 1 elimina esos casos.\nPara la próxima: en comparación cuantitativa, antes de probar números, mira la condición centrada. Te dice qué casos están permitidos."},{"type":"qc","topic":"Álgebra: casos con enteros","difficulty":"media","info":"x is an integer and −2 ≤ x ≤ 2","quantityA":"x²","quantityB":"x","answer":3,"solution":"Idea clave: en comparación cuantitativa, si encuentras dos casos válidos con resultados distintos, la respuesta es D.\nPaso a paso:\n1) Los valores permitidos son solo los enteros −2, −1, 0, 1, 2. Son pocos: pruébalos todos.\n2) x = 0 → A = 0, B = 0: iguales.\n3) x = 2 → A = 4, B = 2: A mayor.\n4) Ya tienes dos relaciones distintas (igual y mayor), así que no se puede determinar.\nCómo comprobarlo: completa la tabla. x = −2 → 4 vs −2; x = −1 → 1 vs −1; x = 1 → 1 vs 1. Hay casos iguales y casos con A mayor.\nTrampa: probar solo x = 2 y elegir A. Un solo número nunca basta para descartar D.\nPara la próxima: usa la lista \"FROZEN\" de números a probar: Fracciones, Repetidos, Uno, Cero, Extremos, Negativos. Cuando el rango es pequeño y entero, pruébalos todos."},{"type":"qc","topic":"Estadística: promedio","difficulty":"media","quantityA":"The average (arithmetic mean) of 17, 23, and 29","quantityB":"23","answer":2,"solution":"Idea clave: en una lista de números igualmente espaciados, el promedio es el número del centro.\nPaso a paso:\n1) Revisa el espaciado: 23 − 17 = 6 y 29 − 23 = 6. Es igual.\n2) Por lo tanto, el promedio es el central: 23.\n3) A = 23 y B = 23 → iguales.\nCómo comprobarlo: suma y divide. (17 + 23 + 29)/3 = 69/3 = 23.\nTrampa: ninguna fuerte; el riesgo es perder tiempo sumando cuando hay un atajo.\nPara la próxima: si los números están igualmente espaciados, promedio = mediana = (primero + último)/2. Te ahorra cuentas en listas largas."},{"type":"qc","topic":"Potencias de fracciones","difficulty":"media","quantityA":"(0.9)¹⁰","quantityB":"0.9","answer":1,"solution":"Idea clave: un número entre 0 y 1 se hace más pequeño cada vez que lo multiplicas por sí mismo.\nPaso a paso:\n1) 0.9 está entre 0 y 1.\n2) (0.9)² = 0.81, menor que 0.9. Cada potencia adicional multiplica por 0.9 y vuelve a reducir el resultado.\n3) Por lo tanto, (0.9)¹⁰ < 0.9 → B mayor.\nCómo comprobarlo: (0.9)⁵ ≈ 0.59, así que (0.9)¹⁰ ≈ 0.59² ≈ 0.35. Está muy por debajo de 0.9.\nTrampa: pensar \"elevar a una potencia agranda\". Eso solo pasa con números mayores que 1.\nPara la próxima: memoriza el comportamiento por zonas: mayor que 1 → crece; entre 0 y 1 → se achica; 0 y 1 → no cambian; negativos → el signo depende de si el exponente es par o impar."},{"type":"qc","topic":"Geometría: círculos","difficulty":"difícil","info":"A circle has circumference 10π.","quantityA":"The area of the circle","quantityB":"78","answer":0,"solution":"Idea clave: con la circunferencia obtienes el radio, y con el radio el área. Luego decide si una aproximación de π basta.\nPaso a paso:\n1) Circunferencia = 2πr = 10π → r = 5.\n2) Área = πr² = 25π.\n3) Compara 25π con 78: 25 × 3.14 = 78.5. Como π > 3.14, el área es mayor que 78.5.\n4) A mayor.\nCómo comprobarlo: el límite exacto sería π = 78/25 = 3.12. Como π ≈ 3.1416 > 3.12, A gana.\nTrampa: redondear π a 3 da 75 y te lleva a B. Con π = 3.14 sale bien.\nPara la próxima: cuando B está muy cerca de un número con π, divide B entre el coeficiente (78/25 = 3.12) y compara contra π ≈ 3.14."},{"type":"qc","topic":"Sistemas de ecuaciones","difficulty":"media","info":"x + y = 10 and x − y = 4","quantityA":"x","quantityB":"2y","answer":0,"solution":"Idea clave: un sistema de dos ecuaciones con suma y resta se resuelve sumándolas para eliminar una variable.\nPaso a paso:\n1) Suma las ecuaciones: (x + y) + (x − y) = 10 + 4 → 2x = 14 → x = 7.\n2) Sustituye x = 7 en x + y = 10: y = 3.\n3) 2y = 6. Compara A = 7 contra B = 6 → A mayor.\nCómo comprobarlo: sustituye en ambas ecuaciones. 7 + 3 = 10 ✓ y 7 − 3 = 4 ✓.\nTrampa: comparar x con y (7 vs 3) en vez de con 2y.\nPara la próxima: cuando las ecuaciones son \"suma\" y \"resta\" de las mismas variables, súmalas o réstalas; es más rápido que despejar."},{"type":"qc","topic":"Divisibilidad: residuos","difficulty":"media","info":"n is a positive integer.","quantityA":"The remainder when 7n is divided by 7","quantityB":"0","answer":2,"solution":"Idea clave: un múltiplo de 7 siempre deja residuo 0 al dividirlo entre 7.\nPaso a paso:\n1) 7n significa 7 multiplicado por un entero, así que es múltiplo de 7.\n2) Cualquier múltiplo de 7 dividido entre 7 da un resultado exacto, con residuo 0.\n3) A = 0 y B = 0 → iguales.\nCómo comprobarlo: prueba n = 1, 2, 3: 7, 14 y 21 divididos entre 7 dan residuo 0.\nTrampa: elegir D porque n es variable. Aunque n cambie, el residuo no cambia.\nPara la próxima: \"variable\" no significa \"indeterminado\". Pregúntate si el valor de la cantidad realmente cambia con la variable."},{"type":"qc","topic":"Divisores","difficulty":"media","quantityA":"The number of positive divisors of 36","quantityB":"The number of positive divisors of 40","answer":0,"solution":"Idea clave: para contar divisores, factoriza en primos, suma 1 a cada exponente y multiplica.\nPaso a paso:\n1) 36 = 2² × 3². Divisores: (2 + 1)(2 + 1) = 9.\n2) 40 = 2³ × 5¹. Divisores: (3 + 1)(1 + 1) = 8.\n3) 9 > 8 → A mayor.\nCómo comprobarlo: lista los de 36: 1, 2, 3, 4, 6, 9, 12, 18, 36 (9). Los de 40: 1, 2, 4, 5, 8, 10, 20, 40 (8).\nTrampa: pensar que 40 tiene más divisores por ser mayor que 36. El tamaño del número no determina cuántos divisores tiene.\nPara la próxima: listar divisores en pares (1×36, 2×18, 3×12, 4×9, 6×6) evita olvidar alguno. La fórmula de exponentes es más rápida con números grandes."},{"type":"qc","topic":"Fracciones: comparación","difficulty":"difícil","info":"0 < a < b","quantityA":"a/b","quantityB":"(a + 1)/(b + 1)","answer":1,"solution":"Idea clave: si sumas lo mismo al numerador y al denominador de una fracción menor que 1, la fracción se acerca a 1, es decir, aumenta.\nPaso a paso:\n1) Como 0 < a < b, a/b está entre 0 y 1.\n2) Compara restando: (a+1)/(b+1) − a/b = [b(a+1) − a(b+1)] / [b(b+1)] = (b − a) / [b(b+1)].\n3) b − a > 0 y el denominador es positivo, así que la resta es positiva → B mayor.\nCómo comprobarlo: a = 1, b = 2 → A = 0.5, B = 2/3 ≈ 0.67. Con otro caso: a = 1, b = 100 → A = 0.01, B = 2/101 ≈ 0.02. B gana en ambos.\nTrampa: pensar que sumar 1 arriba y abajo no cambia la fracción. Sí la cambia.\nPara la próxima: para comparar dos fracciones, multiplica en cruz o réstalas. Y recuerda la regla: sumar lo mismo arriba y abajo acerca la fracción a 1."},{"type":"qc","topic":"Geometría: triángulos","difficulty":"difícil","info":"In triangle PQR, the measure of angle P is 50° and the measure of angle Q is 60°.","quantityA":"The length of side QR","quantityB":"The length of side PQ","answer":1,"solution":"Idea clave: en un triángulo, el lado más largo está frente al ángulo más grande.\nPaso a paso:\n1) Ángulo R = 180 − 50 − 60 = 70°.\n2) Identifica qué lado está frente a qué ángulo. QR no toca el vértice P, así que está frente a P (50°). PQ no toca R, así que está frente a R (70°).\n3) El lado frente a 70° es mayor que el lado frente a 50° → PQ > QR → B mayor.\nCómo comprobarlo: el lado opuesto a un vértice es el que NO contiene esa letra. QR no tiene P; PQ no tiene R.\nTrampa: confundir el lado \"opuesto\" con un lado \"adyacente\" al ángulo.\nPara la próxima: ordena los ángulos y los lados quedan en el mismo orden. Aquí: P (50) < Q (60) < R (70), así que QR < PR < PQ."},{"type":"qc","topic":"Probabilidad sin reemplazo","difficulty":"difícil","info":"A bag contains 3 red marbles and 5 blue marbles. Two marbles are drawn at random without replacement.","quantityA":"The probability that both marbles drawn are blue","quantityB":"1/3","answer":0,"solution":"Idea clave: sin reemplazo, la segunda probabilidad cambia porque ya hay una canica menos en la bolsa.\nPaso a paso:\n1) Primera azul: 5 azules de 8 canicas → 5/8.\n2) Segunda azul, sabiendo que ya salió una: quedan 4 azules de 7 → 4/7.\n3) Ambas: 5/8 × 4/7 = 20/56 = 5/14.\n4) Compara 5/14 con 1/3. Multiplica en cruz: 5 × 3 = 15 contra 14 × 1 = 14. Como 15 > 14, A mayor.\nCómo comprobarlo: con combinaciones. C(5,2)/C(8,2) = 10/28 = 5/14. El mismo resultado.\nTrampa: usar 5/8 × 5/8 como si hubiera reemplazo.\nPara la próxima: para comparar fracciones, multiplica en cruz en lugar de convertir a decimales."},{"type":"qc","topic":"Valor absoluto","difficulty":"media","info":"x ≠ 0","quantityA":"x/|x|","quantityB":"1","answer":3,"solution":"Idea clave: x/|x| solo puede valer 1 o −1, según el signo de x.\nPaso a paso:\n1) Si x > 0, |x| = x → x/|x| = 1. A = B.\n2) Si x < 0, |x| = −x → x/|x| = −1. B mayor.\n3) Hay dos resultados posibles → no se puede determinar.\nCómo comprobarlo: x = 3 → 3/3 = 1; x = −3 → −3/3 = −1.\nTrampa: probar solo números positivos y concluir que son iguales.\nPara la próxima: cuando aparezca un valor absoluto, prueba siempre un número positivo y uno negativo."},{"type":"qc","topic":"Potencias: estimación","difficulty":"difícil","quantityA":"2³⁰","quantityB":"10⁹","answer":0,"solution":"Idea clave: 2¹⁰ = 1024, que es un poco más que 10³ = 1000. Eso permite comparar potencias de 2 con potencias de 10.\nPaso a paso:\n1) Escribe 2³⁰ como (2¹⁰)³ = 1024³.\n2) Escribe 10⁹ como (10³)³ = 1000³.\n3) 1024 > 1000, así que 1024³ > 1000³ → A mayor.\nCómo comprobarlo: 2³⁰ = 1,073,741,824, que supera a 10⁹ = 1,000,000,000.\nTrampa: pensar que 10⁹ es más grande porque la base 10 es mayor que la base 2.\nPara la próxima: para comparar potencias con bases distintas, reescríbelas con el mismo exponente: (algo)³ contra (algo)³."},{"type":"qc","topic":"Porcentajes sucesivos","difficulty":"media","info":"The price of an item is increased by 20 percent, and then the new price is decreased by 20 percent.","quantityA":"The final price","quantityB":"The original price","answer":1,"solution":"Idea clave: los porcentajes sucesivos se multiplican, no se suman.\nPaso a paso:\n1) Subir 20% = multiplicar por 1.20.\n2) Bajar 20% = multiplicar por 0.80.\n3) Resultado: 1.20 × 0.80 = 0.96 del precio original → el precio final es menor → B mayor.\nCómo comprobarlo: usa 100. Sube a 120 y luego baja 20% de 120 (24) → 96. 96 < 100.\nTrampa: pensar que +20% y −20% se cancelan. El segundo 20% se calcula sobre una base mayor.\nPara la próxima: con porcentajes, usa 100 como precio inicial y aplica cada cambio por separado."},{"type":"qc","topic":"Signos y potencias","difficulty":"media","info":"k < 0","quantityA":"k³","quantityB":"k²","answer":1,"solution":"Idea clave: una potencia par de un negativo es positiva; una potencia impar de un negativo es negativa.\nPaso a paso:\n1) k < 0.\n2) k³ es negativo (exponente impar).\n3) k² es positivo (exponente par).\n4) Un positivo siempre es mayor que un negativo → B mayor.\nCómo comprobarlo: k = −2 → k³ = −8, k² = 4. k = −0.5 → k³ = −0.125, k² = 0.25. B gana en ambos.\nTrampa: pensar que k³ es \"más grande\" por tener mayor exponente.\nPara la próxima: antes de hacer cuentas, revisa el signo de cada cantidad. Muchas comparaciones se resuelven solo con eso."},{"type":"qc","topic":"Estadística: media y mediana","difficulty":"media","info":"S = {3, 7, 7, 10, 13}","quantityA":"The mean of S","quantityB":"The median of S","answer":0,"solution":"Idea clave: la media usa todos los valores; la mediana es el valor del centro. Un valor alto jala la media hacia arriba.\nPaso a paso:\n1) Media: (3 + 7 + 7 + 10 + 13)/5 = 40/5 = 8.\n2) Mediana: la lista ya está ordenada, el central (3.º de 5) es 7.\n3) 8 > 7 → A mayor.\nCómo comprobarlo: los valores altos (10 y 13) se alejan más de 7 que el valor bajo (3). Eso jala la media por encima de la mediana.\nTrampa: tomar como mediana un número que no es el del centro, o no ordenar la lista primero.\nPara la próxima: siempre ordena la lista antes de buscar la mediana. Si hay valores extremos de un solo lado, ya sabes hacia dónde se mueve la media."},{"type":"qc","topic":"Ecuaciones cuadráticas","difficulty":"media","info":"x² = 16","quantityA":"x","quantityB":"4","answer":3,"solution":"Idea clave: x² = 16 tiene dos soluciones: 4 y −4.\nPaso a paso:\n1) Las raíces de 16 son 4 y −4.\n2) Si x = 4 → A = B.\n3) Si x = −4 → B mayor.\n4) Dos relaciones posibles → no se puede determinar.\nCómo comprobarlo: (−4)² = 16 ✓ y 4² = 16 ✓.\nTrampa: tomar solo la raíz positiva.\nPara la próxima: cuando la información viene como x² = algo, escribe siempre las dos soluciones."},{"type":"qc","topic":"Geometría: área y perímetro","difficulty":"difícil","info":"A rectangle has a perimeter of 20.","quantityA":"The area of the rectangle","quantityB":"25","answer":3,"solution":"Idea clave: con un perímetro fijo, el rectángulo de área máxima es el cuadrado. Pero el área puede ser mucho menor.\nPaso a paso:\n1) Perímetro 20 → largo + ancho = 10.\n2) Cuadrado 5 × 5 → área 25 → iguales a B.\n3) Rectángulo 9 × 1 → área 9 → B mayor.\n4) Dos relaciones posibles → no se puede determinar.\nCómo comprobarlo: el área es L(10 − L). Su valor más alto (25) ocurre en L = 5; con cualquier otro L es menor.\nTrampa: olvidar que un cuadrado también es un rectángulo y elegir B.\nPara la próxima: en geometría de comparación, prueba la figura \"perfecta\" (cuadrado, equilátero) y una muy alargada."},{"type":"qc","topic":"Radicales","difficulty":"media","quantityA":"√50 + √18","quantityB":"√128","answer":2,"solution":"Idea clave: para sumar raíces, primero simplifícalas sacando cuadrados perfectos.\nPaso a paso:\n1) √50 = √(25 × 2) = 5√2.\n2) √18 = √(9 × 2) = 3√2.\n3) A = 5√2 + 3√2 = 8√2.\n4) √128 = √(64 × 2) = 8√2. Iguales.\nCómo comprobarlo: eleva al cuadrado. (8√2)² = 64 × 2 = 128, y (√128)² = 128.\nTrampa: sumar dentro de la raíz: √50 + √18 = √68. Las raíces no se suman así.\nPara la próxima: busca el mayor cuadrado perfecto que divida al número (4, 9, 16, 25, 36, 49, 64…)."},{"type":"qc","topic":"Enteros: casos","difficulty":"difícil","info":"a and b are positive integers, and a + b = 7.","quantityA":"ab","quantityB":"12","answer":3,"solution":"Idea clave: cuando las variables son enteros positivos, puedes listar todos los casos posibles.\nPaso a paso:\n1) Pares (a, b) con a + b = 7: (1,6), (2,5), (3,4) y sus inversos.\n2) Productos: 6, 10, 12.\n3) ab puede ser menor que 12 o igual a 12 → no se puede determinar.\nCómo comprobarlo: ningún par da más de 12, pero eso no basta; necesitas que siempre gane el mismo lado, y aquí no pasa.\nTrampa: probar solo (3, 4), ver 12 y elegir C.\nPara la próxima: cuando una cantidad puede igualar a B en un caso y ser menor en otro, la respuesta es D."},{"type":"mc","topic":"Ecuaciones lineales","difficulty":"media","stem":"If 3x − 7 = 2x + 5, what is the value of 2x?","options":["12","18","20","22","24"],"answer":4,"solution":"Idea clave: despeja la variable y luego responde exactamente lo que te piden.\nPaso a paso:\n1) 3x − 7 = 2x + 5.\n2) Resta 2x de ambos lados: x − 7 = 5.\n3) Suma 7: x = 12.\n4) Te piden 2x: 2 × 12 = 24.\nCómo comprobarlo: sustituye x = 12 en la ecuación original. 3(12) − 7 = 29 y 2(12) + 5 = 29 ✓.\nTrampa: 12 está en las opciones a propósito; es x, no 2x.\nPara la próxima: antes de marcar, vuelve a leer qué te piden. El GRE pone el valor intermedio como opción para atraparte."},{"type":"mc","topic":"Porcentajes: descuento","difficulty":"media","stem":"A shirt costs $40 after a 20 percent discount. What was the original price of the shirt?","options":["$32","$48","$50","$52","$60"],"answer":2,"solution":"Idea clave: el descuento se calcula sobre el precio original, no sobre el precio final.\nPaso a paso:\n1) Con 20% de descuento pagas el 80% del original: 0.80 × P = 40.\n2) P = 40/0.80 = 50.\nCómo comprobarlo: 20% de 50 es 10; 50 − 10 = 40 ✓.\nTrampa: sumar 20% a 40 (40 × 1.2 = 48). Ese 20% se calcula sobre la base equivocada.\nPara la próxima: cuando conoces el precio después de un cambio porcentual, divide entre el multiplicador (0.80, 1.15, etc.), no sumes el porcentaje."},{"type":"mc","topic":"Promedio de enteros consecutivos","difficulty":"media","stem":"What is the average (arithmetic mean) of all the integers from 12 to 48, inclusive?","options":["29","30","31","32","33"],"answer":1,"solution":"Idea clave: el promedio de enteros consecutivos es (primero + último)/2.\nPaso a paso:\n1) Los enteros de 12 a 48 están igualmente espaciados.\n2) Promedio = (12 + 48)/2 = 30.\nCómo comprobarlo: empareja extremos. 12 + 48 = 60, 13 + 47 = 60… Cada par promedia 30.\nTrampa: sumar todos a mano y equivocarte con la cantidad de números (de 12 a 48 hay 37, no 36).\nPara la próxima: cantidad de enteros de a a b inclusive = b − a + 1. Útil para sumas: suma = promedio × cantidad."},{"type":"mc","topic":"Razones","difficulty":"media","stem":"The ratio of boys to girls in a class is 3 to 5. If there are 40 students in the class, how many more girls than boys are there?","options":["10","12","15","20","25"],"answer":0,"solution":"Idea clave: una razón 3:5 divide el total en 3 + 5 = 8 partes iguales.\nPaso a paso:\n1) Partes totales: 8.\n2) Cada parte: 40/8 = 5 estudiantes.\n3) Niños = 3 × 5 = 15, niñas = 5 × 5 = 25.\n4) Diferencia: 25 − 15 = 10 (o directamente 2 partes × 5 = 10).\nCómo comprobarlo: 15 + 25 = 40 ✓ y 15:25 = 3:5 ✓.\nTrampa: elegir 15 o 25, que son los totales de cada grupo, no la diferencia.\nPara la próxima: con razones, calcula primero \"cuánto vale una parte\". Todo lo demás sale multiplicando."},{"type":"mc","topic":"Funciones","difficulty":"media","stem":"If f(x) = 2x² − 3x + 1, what is the value of f(−2)?","options":["3","7","11","15","19"],"answer":3,"solution":"Idea clave: evaluar una función es sustituir el valor, con mucho cuidado con los signos.\nPaso a paso:\n1) f(−2) = 2(−2)² − 3(−2) + 1.\n2) (−2)² = 4 → 2 × 4 = 8.\n3) −3 × (−2) = +6.\n4) 8 + 6 + 1 = 15.\nCómo comprobarlo: escribe el número negativo siempre entre paréntesis antes de operar.\nTrampa: hacer (−2)² = −4 o −3(−2) = −6 da 3 o 7, y ambos están entre las opciones.\nPara la próxima: un negativo al cuadrado siempre da positivo, y menos por menos da más. Usa paréntesis siempre."},{"type":"mc","topic":"Combinaciones","difficulty":"media","stem":"In how many different ways can a committee of 3 people be selected from a group of 7 people?","options":["21","35","42","105","210"],"answer":1,"solution":"Idea clave: si el orden no importa (un comité), es una combinación: C(n, k) = n! / [k!(n − k)!].\nPaso a paso:\n1) ¿Importa el orden? No: el comité {Ana, Ben, Carla} es el mismo que {Carla, Ana, Ben}.\n2) C(7, 3) = (7 × 6 × 5)/(3 × 2 × 1) = 210/6 = 35.\nCómo comprobarlo: cuenta con orden (7 × 6 × 5 = 210) y divide entre las 3! = 6 maneras de ordenar a cada grupo de 3.\nTrampa: 210 cuenta cada comité 6 veces (una por cada orden).\nPara la próxima: pregúntate si cambiar el orden crea un resultado distinto. Si sí (presidente, secretario…), es permutación; si no (grupo, comité), es combinación."},{"type":"mc","topic":"Velocidad promedio","difficulty":"difícil","stem":"A car travels 150 miles at 50 miles per hour and then returns along the same route at 75 miles per hour. What is the car's average speed for the entire trip, in miles per hour?","options":["55","60","62.5","65","70"],"answer":1,"solution":"Idea clave: la velocidad promedio es distancia total entre tiempo total, no el promedio de las velocidades.\nPaso a paso:\n1) Ida: 150/50 = 3 horas.\n2) Regreso: 150/75 = 2 horas.\n3) Distancia total = 300; tiempo total = 5 horas.\n4) Velocidad promedio = 300/5 = 60.\nCómo comprobarlo: el auto pasa más tiempo a 50 que a 75, así que el promedio debe quedar más cerca de 50 que el punto medio (62.5). 60 lo cumple.\nTrampa: (50 + 75)/2 = 62.5 está en las opciones a propósito.\nPara la próxima: para la misma distancia a dos velocidades, el promedio es 2ab/(a + b) = 2(50)(75)/125 = 60."},{"type":"mc","topic":"Residuos y ciclos","difficulty":"difícil","stem":"What is the remainder when 2²⁰ is divided by 7?","options":["1","2","3","4","6"],"answer":3,"solution":"Idea clave: los residuos de las potencias se repiten en ciclos. Encuentra el ciclo en lugar de calcular la potencia.\nPaso a paso:\n1) Residuos de 2ⁿ entre 7: 2¹ = 2 → 2; 2² = 4 → 4; 2³ = 8 → 1; 2⁴ = 16 → 2…\n2) El ciclo es (2, 4, 1) y tiene longitud 3.\n3) 20 ÷ 3 = 6 con residuo 2 → 2²⁰ ocupa la 2.ª posición del ciclo → residuo 4.\nCómo comprobarlo: 2²⁰ = (2³)⁶ × 2². Como 2³ deja residuo 1, (2³)⁶ deja 1, y el resultado deja el residuo de 2² = 4.\nTrampa: confundirte con la posición del ciclo cuando el residuo de la división es 0 (que corresponde a la última posición, no a la primera).\nPara la próxima: escribe la tabla hasta que se repita el primer valor, divide el exponente entre la longitud del ciclo y usa el residuo para ubicarte."},{"type":"mc","topic":"Pitágoras","difficulty":"media","stem":"The hypotenuse of a right triangle has length 13 and one leg has length 5. What is the area of the triangle?","options":["30","32.5","60","65","78"],"answer":0,"solution":"Idea clave: con dos lados de un triángulo rectángulo, Pitágoras te da el tercero.\nPaso a paso:\n1) a² + 5² = 13² → a² = 169 − 25 = 144 → a = 12.\n2) Los catetos son la base y la altura: área = (5 × 12)/2 = 30.\nCómo comprobarlo: 5-12-13 es una terna pitagórica conocida.\nTrampa: 60 olvida dividir entre 2; 32.5 usa la hipotenusa como altura.\nPara la próxima: memoriza las ternas 3-4-5, 5-12-13, 8-15-17, 7-24-25 y sus múltiplos (6-8-10, 9-12-15). Te ahorran el cálculo."},{"type":"mc","topic":"Porcentajes pequeños","difficulty":"media","stem":"If 0.2 percent of x is 6, what is the value of x?","options":["30","300","1,200","3,000","12,000"],"answer":3,"solution":"Idea clave: para usar un porcentaje en una cuenta, divídelo entre 100 y cuida dónde queda el punto decimal.\nPaso a paso:\n1) 0.2% = 0.2/100 = 0.002.\n2) 0.002 × x = 6 → x = 6/0.002 = 3,000.\nCómo comprobarlo: 1% de 3,000 es 30, así que 0.2% es 30/5 = 6 ✓.\nTrampa: tratar 0.2% como 0.2 (que es 20%) da 30.\nPara la próxima: verifica con el 1%. Calcula el 1% del resultado y escala; detecta enseguida un punto decimal mal puesto."},{"type":"mc","topic":"Porcentajes sucesivos","difficulty":"media","stem":"A number is increased by 25 percent, and the result is then decreased by 40 percent. The final number is how much greater or less than the original number?","options":["25 percent less","20 percent less","15 percent less","No change","15 percent greater"],"answer":0,"solution":"Idea clave: los porcentajes sucesivos se multiplican.\nPaso a paso:\n1) +25% → × 1.25.\n2) −40% → × 0.60.\n3) 1.25 × 0.60 = 0.75 → el resultado es 75% del original, una disminución de 25%.\nCómo comprobarlo: empieza con 100. Sube a 125; 40% de 125 es 50; queda 75. Bajó 25.\nTrampa: restar los porcentajes (40 − 25 = 15) da \"15% menos\".\nPara la próxima: con cambios porcentuales encadenados, usa 100 como valor inicial y aplica un cambio a la vez."},{"type":"mc","topic":"Identidades algebraicas","difficulty":"difícil","stem":"If x and y are integers such that xy = 12 and x + y = −7, what is the value of x² + y²?","options":["13","25","37","49","73"],"answer":1,"solution":"Idea clave: la identidad (x + y)² = x² + 2xy + y² te da x² + y² sin despejar las variables.\nPaso a paso:\n1) Despeja: x² + y² = (x + y)² − 2xy.\n2) Sustituye: (−7)² − 2(12) = 49 − 24 = 25.\nCómo comprobarlo: busca dos enteros con producto 12 y suma −7: −3 y −4. Entonces 9 + 16 = 25 ✓.\nTrampa: 49 es (x + y)² sin restar 2xy.\nPara la próxima: si te dan la suma y el producto y te piden una suma de cuadrados, usa la identidad. Las tres que más aparecen: (a + b)², (a − b)² y a² − b² = (a + b)(a − b)."},{"type":"mc","topic":"Enteros consecutivos","difficulty":"media","stem":"The sum of five consecutive even integers is 150. What is the greatest of the five integers?","options":["26","28","30","32","34"],"answer":4,"solution":"Idea clave: en números igualmente espaciados, el promedio es el número del centro.\nPaso a paso:\n1) Promedio = 150/5 = 30. Con 5 números, ese es el 3.º.\n2) Pares consecutivos alrededor de 30: 26, 28, 30, 32, 34.\n3) El mayor es 34.\nCómo comprobarlo: 26 + 28 + 30 + 32 + 34 = 150 ✓.\nTrampa: 30 es el número del centro, no el mayor.\nPara la próxima: con consecutivos, divide la suma entre la cantidad para obtener el centro y luego cuenta hacia los lados."},{"type":"mc","topic":"Geometría: longitud de arco","difficulty":"media","stem":"A circle has radius 6. What is the length of an arc of the circle with a central angle of 60 degrees?","options":["2π","3π","4π","6π","12π"],"answer":0,"solution":"Idea clave: un arco es una fracción de la circunferencia: (ángulo central/360) × 2πr.\nPaso a paso:\n1) Circunferencia: 2π × 6 = 12π.\n2) Fracción del círculo: 60/360 = 1/6.\n3) Arco = 12π/6 = 2π.\nCómo comprobarlo: 6 arcos de 60° deben dar la vuelta completa: 6 × 2π = 12π ✓.\nTrampa: 6π es el área del sector (36π/6), no la longitud del arco.\nPara la próxima: arco y sector usan la misma fracción del círculo. El arco aplica esa fracción a la circunferencia (2πr); el sector, al área (πr²)."},{"type":"mc","topic":"Valor absoluto","difficulty":"media","stem":"What is the sum of all values of x that satisfy |2x − 3| = 7?","options":["−2","1","3","5","7"],"answer":2,"solution":"Idea clave: |algo| = 7 significa que \"algo\" vale 7 o −7. Resuelve los dos casos.\nPaso a paso:\n1) Caso 1: 2x − 3 = 7 → 2x = 10 → x = 5.\n2) Caso 2: 2x − 3 = −7 → 2x = −4 → x = −2.\n3) Suma de las soluciones: 5 + (−2) = 3.\nCómo comprobarlo: |2(5) − 3| = |7| = 7 ✓ y |2(−2) − 3| = |−7| = 7 ✓.\nTrampa: resolver solo el caso positivo y marcar 5.\nPara la próxima: valor absoluto = dos ecuaciones. Escríbelas las dos siempre."},{"type":"mc","topic":"Geometría analítica","difficulty":"media","stem":"A line passes through the points (1, 2) and (4, 11). What is the y-intercept of the line?","options":["−5","−4","−3","−2","−1"],"answer":4,"solution":"Idea clave: con dos puntos sacas la pendiente, y con la pendiente y un punto sacas b en y = mx + b.\nPaso a paso:\n1) Pendiente: (11 − 2)/(4 − 1) = 9/3 = 3.\n2) y = 3x + b. Sustituye el punto (1, 2): 2 = 3(1) + b → b = −1.\n3) La intersección con el eje y es −1.\nCómo comprobarlo: con el otro punto, 3(4) − 1 = 11 ✓.\nTrampa: restar las coordenadas en distinto orden arriba y abajo da la pendiente con el signo equivocado.\nPara la próxima: resta en el mismo orden arriba y abajo: (y₂ − y₁)/(x₂ − x₁). Verifica siempre con el segundo punto."},{"type":"mc","topic":"Exponentes","difficulty":"media","stem":"If 2^(x + 3) = 32, what is the value of x?","options":["−2","−1","0","1","2"],"answer":4,"solution":"Idea clave: si las bases son iguales, los exponentes también deben ser iguales.\nPaso a paso:\n1) Escribe 32 como potencia de 2: 32 = 2⁵.\n2) 2^(x + 3) = 2⁵ → x + 3 = 5 → x = 2.\nCómo comprobarlo: 2^(2 + 3) = 2⁵ = 32 ✓.\nTrampa: marcar 5, que es el exponente completo y no x.\nPara la próxima: memoriza las potencias de 2 hasta 2¹⁰ (2, 4, 8, 16, 32, 64, 128, 256, 512, 1024) y las de 3 hasta 3⁵ (3, 9, 27, 81, 243)."},{"type":"mc","topic":"Mezclas","difficulty":"difícil","stem":"A 20-liter mixture is 30 percent alcohol by volume. How many liters of pure alcohol must be added to make the mixture 50 percent alcohol?","options":["4","6","8","10","12"],"answer":2,"solution":"Idea clave: en mezclas, sigue la cantidad de la sustancia pura. Al agregar sustancia pura, cambian tanto la sustancia como el volumen total.\nPaso a paso:\n1) Alcohol inicial: 0.30 × 20 = 6 L.\n2) Si agregas a litros de alcohol puro: alcohol = 6 + a, total = 20 + a.\n3) (6 + a)/(20 + a) = 0.5 → 6 + a = 10 + 0.5a → 0.5a = 4 → a = 8.\nCómo comprobarlo: 6 + 8 = 14 de alcohol en 28 L totales → 14/28 = 50% ✓.\nTrampa: 4 sale de pensar \"me faltan 4 L para llegar a 10 de 20\", olvidando que el total también crece.\nPara la próxima: plantea \"cantidad pura / total = porcentaje\" y recuerda sumar lo agregado arriba y abajo."},{"type":"mc","topic":"Desviación estándar","difficulty":"media","stem":"Which of the following lists of numbers has the greatest standard deviation?","options":["10, 10, 10, 10","8, 9, 11, 12","5, 10, 10, 15","1, 10, 10, 19","9, 10, 10, 11"],"answer":3,"solution":"Idea clave: la desviación estándar mide qué tan lejos están, en promedio, los datos de la media. Más dispersión significa más desviación.\nPaso a paso:\n1) Todas las listas tienen media 10.\n2) Mide qué tan lejos está cada lista de 10: la A no se aleja nada; la B, 1 o 2; la C, 5; la D, 9; la E, 1.\n3) La D (1, 10, 10, 19) tiene los valores más alejados → mayor desviación.\nCómo comprobarlo: no hace falta la fórmula. Si una lista tiene valores más lejanos y el mismo número de datos, su desviación es mayor.\nTrampa: elegir la lista con más valores distintos (la B). Lo que importa es qué tan lejos están, no cuántos valores distintos hay.\nPara la próxima: en el GRE casi nunca calculas la desviación estándar; la comparas mirando qué tan alejados están los datos del centro."},{"type":"mc","topic":"Probabilidad: dados","difficulty":"media","stem":"Two fair six-sided dice are rolled. What is the probability that the sum of the numbers rolled is 8?","options":["1/12","5/36","1/6","7/36","2/9"],"answer":1,"solution":"Idea clave: probabilidad = casos favorables / casos totales. Con dos dados, (2,6) y (6,2) son resultados distintos.\nPaso a paso:\n1) Total de resultados: 6 × 6 = 36.\n2) Suman 8: (2,6), (3,5), (4,4), (5,3), (6,2) → 5 casos.\n3) P = 5/36.\nCómo comprobarlo: las sumas de 2 a 12 tienen 1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1 casos. A la suma 8 le corresponden 5.\nTrampa: contar (2,6) y (6,2) como uno solo da 3/36, y contar (4,4) dos veces da 6/36 = 1/6.\nPara la próxima: imagina los dados de dos colores; así queda claro que (2,6) y (6,2) son distintos y que (4,4) solo ocurre una vez."},{"type":"mc","topic":"Interés compuesto","difficulty":"media","stem":"An investment of $2,000 earns 5 percent annual interest, compounded annually. How much interest does it earn in 2 years?","options":["$195","$200","$205","$210","$220"],"answer":2,"solution":"Idea clave: con interés compuesto, el interés de cada año se calcula sobre el saldo acumulado, incluido el interés anterior.\nPaso a paso:\n1) Año 1: 5% de 2,000 = 100 → saldo 2,100.\n2) Año 2: 5% de 2,100 = 105 → saldo 2,205.\n3) Interés total: 100 + 105 = 205.\nCómo comprobarlo: 2,000 × 1.05² = 2,000 × 1.1025 = 2,205.\nTrampa: 200 es interés simple (100 por año).\nPara la próxima: saldo compuesto = P(1 + r)ⁿ; el interés es ese saldo menos P. Lee bien si te piden el saldo final o solo el interés."},{"type":"mc","topic":"Razones encadenadas","difficulty":"media","stem":"If a/b = 3/4 and b/c = 2/5, what is the value of a/c?","options":["1/10","3/20","1/5","3/10","8/15"],"answer":3,"solution":"Idea clave: puedes encadenar razones multiplicándolas cuando la variable de en medio se cancela.\nPaso a paso:\n1) a/c = (a/b) × (b/c): la b se cancela.\n2) (3/4) × (2/5) = 6/20 = 3/10.\nCómo comprobarlo: elige b = 4. Entonces a = 3 y c = 10 (porque 4/c = 2/5). a/c = 3/10 ✓.\nTrampa: sumar las razones o invertir una de ellas.\nPara la próxima: si dudas, asigna un número cómodo a la variable que se repite (aquí b) y calcula las otras."},{"type":"mc","topic":"Polígonos","difficulty":"media","stem":"Each interior angle of a regular polygon measures 140 degrees. How many sides does the polygon have?","options":["7","8","9","10","12"],"answer":2,"solution":"Idea clave: en un polígono regular, interior + exterior = 180° y los exteriores suman siempre 360°.\nPaso a paso:\n1) Ángulo exterior = 180 − 140 = 40°.\n2) Lados = 360/40 = 9.\nCómo comprobarlo: suma de interiores = (9 − 2) × 180 = 1,260, y 1,260/9 = 140 ✓.\nTrampa: intentar despejar (n − 2)180/n = 140 sin cuidado y equivocarte con el álgebra.\nPara la próxima: con polígonos regulares, el ángulo exterior es el atajo: lados = 360/exterior."},{"type":"mc","topic":"Trabajo conjunto","difficulty":"media","stem":"Working alone, Ana can paint a fence in 6 hours and Ben can paint the same fence in 3 hours. Working together at these rates, how long will it take them to paint the fence?","options":["1 hour","1.5 hours","1.75 hours","2 hours","4.5 hours"],"answer":3,"solution":"Idea clave: en trabajo conjunto se suman las tasas (fracción de trabajo por hora), no los tiempos.\nPaso a paso:\n1) Ana hace 1/6 de la cerca por hora; Ben, 1/3.\n2) Juntos: 1/6 + 2/6 = 3/6 = 1/2 de cerca por hora.\n3) Tiempo = 1 ÷ (1/2) = 2 horas.\nCómo comprobarlo: en 2 horas, Ana pinta 2/6 y Ben 4/6 → total 6/6 = 1 cerca ✓.\nTrampa: promediar tiempos (4.5 h) o sumarlos (9 h). Juntos siempre tardan menos que el más rápido solo (3 h).\nPara la próxima: tiempo juntos = (a × b)/(a + b) = (6 × 3)/9 = 2. Revisa que el resultado sea menor que el tiempo del más rápido."},{"type":"mc","topic":"Dígito de las unidades","difficulty":"media","stem":"What is the units digit of 3⁴⁷?","options":["1","3","5","7","9"],"answer":3,"solution":"Idea clave: las unidades de las potencias se repiten en ciclos.\nPaso a paso:\n1) Unidades de 3ⁿ: 3, 9, 27 → 7, 81 → 1, y vuelve a 3. El ciclo es (3, 9, 7, 1), de longitud 4.\n2) 47 ÷ 4 = 11 con residuo 3 → 3.ª posición del ciclo → 7.\nCómo comprobarlo: 3⁴⁴ = (3⁴)¹¹ termina en 1. Multiplica por 3³ = 27 → termina en 7.\nTrampa: equivocarte de posición. Si el residuo es 0, corresponde a la 4.ª posición (1), no a la primera.\nPara la próxima: casi todos los ciclos de unidades tienen longitud 1, 2 o 4. Basta con mirar el último dígito."},{"type":"ms","topic":"Divisores","difficulty":"media","stem":"Which of the following are factors of 84?\n\nIndicate all such numbers.","options":["3","8","12","14","21","28"],"answer":[0,2,3,4,5],"solution":"Idea clave: un número divide a 84 si su factorización en primos \"cabe\" dentro de la de 84.\nPaso a paso:\n1) Factoriza: 84 = 2² × 3 × 7.\n2) 3 ✓ (84 tiene un 3).\n3) 8 = 2³ ✗: 84 solo tiene dos factores 2.\n4) 12 = 2² × 3 ✓. 14 = 2 × 7 ✓. 21 = 3 × 7 ✓. 28 = 2² × 7 ✓.\nCómo comprobarlo: divide directamente. 84/12 = 7, 84/14 = 6, 84/21 = 4, 84/28 = 3; 84/8 = 10.5 no es entero.\nTrampa: incluir 8 porque 84 es par. Ser par solo garantiza un factor 2.\nPara la próxima: factoriza el número grande una sola vez y compara cada opción contra esa factorización."},{"type":"ms","topic":"Desigualdades cuadráticas","difficulty":"difícil","stem":"Which of the following values of x satisfy the inequality x² − 5x + 6 < 0?\n\nIndicate all such values.","options":["1.5","2","2.5","2.9","3","3.5"],"answer":[2,3],"solution":"Idea clave: para resolver una desigualdad cuadrática, factoriza, encuentra las raíces y averigua en qué intervalo el producto es negativo.\nPaso a paso:\n1) x² − 5x + 6 = (x − 2)(x − 3).\n2) Las raíces 2 y 3 dividen la recta en tres zonas.\n3) Prueba un punto de cada zona: x = 0 → (−)(−) = + ; x = 2.5 → (+)(−) = − ; x = 4 → (+)(+) = +.\n4) Es negativo solo en 2 < x < 3 → sirven 2.5 y 2.9.\nCómo comprobarlo: x = 2.9 → 8.41 − 14.5 + 6 = −0.09 < 0 ✓.\nTrampa: incluir 2 y 3. Ahí la expresión vale 0, y la desigualdad pide \"< 0\", estrictamente.\nPara la próxima: una parábola que abre hacia arriba es negativa solo entre sus raíces."},{"type":"ms","topic":"Paridad","difficulty":"media","stem":"If n is an odd integer, which of the following must be even?\n\nIndicate all such expressions.","options":["n + 1","2n + 1","n²","n² + n","3n + 3","n³"],"answer":[0,3,4],"solution":"Idea clave: reglas de paridad: impar + impar = par; impar × impar = impar; par × cualquiera = par.\nPaso a paso:\n1) n + 1: impar + 1 = par ✓.\n2) 2n + 1: par + 1 = impar ✗.\n3) n²: impar × impar = impar ✗.\n4) n² + n: impar + impar = par ✓.\n5) 3n + 3: impar + impar = par ✓.\n6) n³: impar ✗.\nCómo comprobarlo: sustituye n = 1 (2, 3, 1, 2, 6, 1) y n = 3 (4, 7, 9, 12, 12, 27). Los pares coinciden en ambos casos.\nTrampa: en preguntas de \"must be\", un ejemplo que funcione no prueba nada; tiene que funcionar siempre.\nPara la próxima: prueba con dos valores distintos. Si una expresión cambia de paridad entre ellos, descártala."},{"type":"ms","topic":"Desigualdad del triángulo","difficulty":"media","stem":"Two sides of a triangle have lengths 7 and 10. Which of the following could be the length of the third side?\n\nIndicate all such lengths.","options":["2","3","5","12","16","17"],"answer":[2,3,4],"solution":"Idea clave: desigualdad del triángulo: cada lado debe ser mayor que la diferencia de los otros dos y menor que su suma.\nPaso a paso:\n1) Diferencia: 10 − 7 = 3. Suma: 10 + 7 = 17.\n2) El tercer lado s cumple 3 < s < 17.\n3) Sirven 5, 12 y 16. Quedan fuera 2 y 3 (no mayores que 3) y 17 (no menor que 17).\nCómo comprobarlo: con s = 3, los lados 3 y 7 suman exactamente 10: los tres puntos quedan en línea recta y no se forma triángulo.\nTrampa: incluir los límites 3 o 17.\nPara la próxima: diferencia < tercer lado < suma, con desigualdades estrictas."},{"type":"ms","topic":"Comparación de fracciones","difficulty":"media","stem":"Which of the following numbers are greater than 1/3?\n\nIndicate all such numbers.","options":["0.3","3/8","5/16","0.34","7/20","4/13"],"answer":[1,3,4],"solution":"Idea clave: para comparar fracciones con 1/3, conviértelas a decimal o multiplica en cruz.\nPaso a paso:\n1) 1/3 ≈ 0.3333.\n2) 0.3 ✗. 3/8 = 0.375 ✓. 5/16 = 0.3125 ✗. 0.34 ✓. 7/20 = 0.35 ✓. 4/13 ≈ 0.3077 ✗.\nCómo comprobarlo: multiplica en cruz contra 1/3. 3/8: 3 × 3 = 9 > 8 ✓. 4/13: 4 × 3 = 12 < 13 ✗.\nTrampa: 0.3 parece igual a 1/3, pero es menor.\nPara la próxima: una fracción a/b es mayor que 1/3 si 3a > b. Es más rápido que convertir a decimal."},{"type":"ms","topic":"Estadística: media y mediana","difficulty":"difícil","stem":"The median of a list of five different positive integers is 10, and the average (arithmetic mean) of the five integers is 12. Which of the following could be the greatest integer in the list?\n\nIndicate all such integers.","options":["15","17","25","36","37"],"answer":[1,2,3],"solution":"Idea clave: con la media obtienes la suma total. Para el valor máximo posible, haz los otros valores lo más pequeños posible; para el mínimo, lo más grandes posible.\nPaso a paso:\n1) Suma total = 5 × 12 = 60. Lista ordenada: a < b < 10 < d < e.\n2) Máximo de e: a = 1, b = 2, d = 11 → e = 60 − 1 − 2 − 10 − 11 = 36.\n3) Mínimo de e: a = 8, b = 9 → d + e = 33 con d < e → d = 16, e = 17.\n4) e puede ir de 17 a 36 → sirven 17, 25 y 36.\nCómo comprobarlo: para 25, a = 5, b = 9, d = 11 → 5 + 9 + 10 + 11 + 25 = 60 ✓.\nTrampa: olvidar que los números deben ser distintos y poner d = 10.\nPara la próxima: para el valor más grande de un número, haz los demás lo más pequeños que permitan las reglas, y al revés."},{"type":"ms","topic":"Razones y proporciones","difficulty":"difícil","stem":"x and y are positive numbers and x/y = 0.6. Which of the following must be true?\n\nIndicate all such statements.","options":["x < y","x + y = 1.6y","y − x = 0.4x","x/(x + y) = 3/8","5x = 3y"],"answer":[0,1,3,4],"solution":"Idea clave: traduce la razón a una ecuación (x = 0.6y) y revisa cada afirmación con álgebra o con números concretos.\nPaso a paso:\n1) x = 0.6y. Usa y = 10 → x = 6.\n2) x < y: 6 < 10 ✓.\n3) x + y = 1.6y: 16 = 16 ✓.\n4) y − x = 0.4x: 4 vs 2.4 ✗ (en realidad y − x = 0.4y).\n5) x/(x + y) = 6/16 = 3/8 ✓.\n6) 5x = 3y: 30 = 30 ✓.\nCómo comprobarlo: con y = 5, x = 3 se cumplen las mismas cuatro.\nTrampa: la opción C usa 0.4 de x en lugar de 0.4 de y; es fácil no notarlo.\nPara la próxima: con razones, asigna valores concretos que respeten la razón (aquí 6 y 10) y verifica cada opción."},{"type":"ms","topic":"Números primos","difficulty":"media","stem":"Which of the following numbers are prime?\n\nIndicate all such numbers.","options":["51","53","57","59","87","91"],"answer":[1,3],"solution":"Idea clave: para saber si n es primo, basta probar divisores primos hasta √n.\nPaso a paso:\n1) √91 < 10, así que prueba 2, 3, 5 y 7.\n2) 51: dígitos suman 6 → divisible entre 3 (= 3 × 17) ✗.\n3) 53: no es divisible entre 2, 3, 5 ni 7 → primo ✓.\n4) 57: dígitos suman 12 → 3 × 19 ✗.\n5) 59: no es divisible → primo ✓.\n6) 87: dígitos suman 15 → 3 × 29 ✗. 91 = 7 × 13 ✗.\nCómo comprobarlo: verifica las multiplicaciones: 3 × 17 = 51, 3 × 19 = 57, 3 × 29 = 87, 7 × 13 = 91.\nTrampa: 91, 51 y 57 parecen primos y no lo son.\nPara la próxima: regla del 3: si la suma de los dígitos es múltiplo de 3, el número también. Y memoriza 91 = 7 × 13."},{"type":"ms","topic":"Desviación estándar","difficulty":"difícil","stem":"A data set has a mean of 20 and a standard deviation of 4. Which of the following values are more than 1.5 standard deviations away from the mean?\n\nIndicate all such values.","options":["13","14","15","25","26","27"],"answer":[0,5],"solution":"Idea clave: \"k desviaciones estándar de la media\" significa una distancia de k × desviación a partir de la media.\nPaso a paso:\n1) 1.5 × 4 = 6.\n2) A 1.5 desviaciones de distancia están 20 − 6 = 14 y 20 + 6 = 26.\n3) \"Más de 1.5 desviaciones\" significa estrictamente fuera: menor que 14 o mayor que 26.\n4) Cumplen 13 y 27.\nCómo comprobarlo: calcula cuántas desviaciones se aleja cada valor. 13 → |13 − 20|/4 = 1.75 ✓; 14 → 1.5 (igual, no más) ✗.\nTrampa: incluir 14 o 26, que están exactamente a 1.5.\nPara la próxima: convierte cada valor a \"número de desviaciones\": (valor − media)/desviación."},{"type":"ms","topic":"Leyes de exponentes","difficulty":"media","stem":"Which of the following are equal to 2¹²?\n\nIndicate all such expressions.","options":["4⁶","8³","16³","2⁶ + 2⁶","(2⁴)³","2¹⁰ × 4"],"answer":[0,2,4,5],"solution":"Idea clave: para comparar potencias, escríbelas todas con la misma base (aquí, base 2).\nPaso a paso:\n1) 4⁶ = (2²)⁶ = 2¹² ✓.\n2) 8³ = (2³)³ = 2⁹ ✗.\n3) 16³ = (2⁴)³ = 2¹² ✓.\n4) 2⁶ + 2⁶ = 2 × 2⁶ = 2⁷ ✗.\n5) (2⁴)³ = 2¹² ✓.\n6) 2¹⁰ × 4 = 2¹⁰ × 2² = 2¹² ✓.\nReglas que usaste: (aᵐ)ⁿ = aᵐⁿ (potencia de potencia multiplica exponentes) y aᵐ × aⁿ = aᵐ⁺ⁿ (producto de misma base suma exponentes).\nCómo comprobarlo: 2¹² = 4,096. 16³ = 4,096 ✓; 8³ = 512 ✗.\nTrampa: 2⁶ + 2⁶ parece 2¹². Sumar potencias iguales solo duplica: x + x = 2x.\nPara la próxima: reescribe todo en la base más pequeña (2, 3 o 5) y compara exponentes."},{"type":"ne","topic":"Porcentajes","difficulty":"media","stem":"What is 35 percent of 240?","answer":"84","solution":"Idea clave: los porcentajes se arman con piezas fáciles: 10%, 5% y 1%.\nPaso a paso:\n1) 10% de 240 = 24 → 30% = 72.\n2) 5% = la mitad de 10% = 12.\n3) 35% = 72 + 12 = 84.\nCómo comprobarlo: 0.35 × 240 = 84.\nTrampa: equivocarte con el punto decimal al multiplicar directamente.\nPara la próxima: descompone el porcentaje (35 = 30 + 5) y calcula con 10% y 5%; es rápido y seguro sin calculadora."},{"type":"ne","topic":"Ecuaciones con decimales","difficulty":"media","stem":"If 4/x = 0.16, what is the value of x?","answer":"25","solution":"Idea clave: si la incógnita está en el denominador, intercambia la incógnita con el resultado.\nPaso a paso:\n1) 4/x = 0.16 → x = 4/0.16.\n2) Quita decimales multiplicando arriba y abajo por 100: 400/16 = 25.\nCómo comprobarlo: 4/25 = 0.16 ✓.\nTrampa: hacer 4 × 0.16 = 0.64 (multiplicar en lugar de dividir).\nPara la próxima: si a/x = b, entonces x = a/b. Quita los decimales antes de dividir."},{"type":"ne","topic":"Promedios","difficulty":"media","stem":"The average (arithmetic mean) of six numbers is 15. When one of the numbers is removed, the average of the remaining five numbers is 14. What number was removed?","answer":"20","solution":"Idea clave: con promedios, trabaja con sumas: suma = promedio × cantidad.\nPaso a paso:\n1) Suma de los 6 = 6 × 15 = 90.\n2) Suma de los 5 restantes = 5 × 14 = 70.\n3) El número quitado = 90 − 70 = 20.\nCómo comprobarlo: si quitas un número mayor que el promedio (20 > 15), el promedio debe bajar. Bajó de 15 a 14 ✓.\nTrampa: restar los promedios (15 − 14 = 1).\nPara la próxima: cualquier problema de \"se agrega o se quita un valor\" se resuelve con sumas totales."},{"type":"ne","topic":"Geometría: rectángulos","difficulty":"media","stem":"The length of a rectangle is 3 more than its width, and its area is 70. What is the perimeter of the rectangle?","answer":"34","solution":"Idea clave: traduce el texto a una ecuación y resuélvela factorizando.\nPaso a paso:\n1) Ancho = w, largo = w + 3. Área: w(w + 3) = 70.\n2) w² + 3w − 70 = 0 → busca dos números con producto −70 y suma 3: 10 y −7 → (w + 10)(w − 7) = 0.\n3) w = 7 (no puede ser negativo). Largo = 10.\n4) Perímetro = 2(7 + 10) = 34.\nCómo comprobarlo: 7 × 10 = 70 ✓ y 10 − 7 = 3 ✓.\nTrampa: contestar el área o el largo; te piden el perímetro.\nPara la próxima: puedes probar pares de factores de 70 (1×70, 2×35, 5×14, 7×10) hasta encontrar dos que difieran en 3."},{"type":"ne","topic":"Conteo: múltiplos","difficulty":"difícil","stem":"How many integers from 1 to 100, inclusive, are multiples of 3 or multiples of 5 (or both)?","answer":"47","solution":"Idea clave: principio de inclusión-exclusión: |A o B| = |A| + |B| − |A y B|.\nPaso a paso:\n1) Múltiplos de 3 entre 1 y 100: ⌊100/3⌋ = 33.\n2) Múltiplos de 5: ⌊100/5⌋ = 20.\n3) Múltiplos de ambos, es decir, de 15: ⌊100/15⌋ = 6. Esos se contaron dos veces.\n4) Total: 33 + 20 − 6 = 47.\nCómo comprobarlo: hasta 15 hay 3, 5, 6, 9, 10, 12, 15 = 7 números. 7 × 6 bloques de 15 = 42 (hasta 90); de 91 a 100 se suman 93, 95, 96, 99, 100 = 5 → 47 ✓.\nTrampa: no restar la intersección (53).\nPara la próxima: \"A o B\" siempre lleva resta de la intersección. La intersección de \"múltiplos de a\" y \"múltiplos de b\" son los múltiplos del mínimo común múltiplo."},{"type":"ne","topic":"Probabilidad: monedas","difficulty":"media","stem":"A fair coin is flipped 3 times. What is the probability of getting exactly 2 heads? Give your answer as a fraction.","answer":"3/8","solution":"Idea clave: probabilidad = casos favorables / casos totales. Con n monedas hay 2ⁿ resultados equiprobables.\nPaso a paso:\n1) Total: 2³ = 8.\n2) Exactamente 2 caras: elegir cuáles 2 de los 3 lanzamientos son cara = C(3,2) = 3 (HHT, HTH, THH).\n3) P = 3/8.\nCómo comprobarlo: las probabilidades de 0, 1, 2 y 3 caras son 1/8, 3/8, 3/8, 1/8 y suman 1 ✓.\nTrampa: contar solo HHT, como si el orden no importara, y obtener 1/8.\nPara la próxima: P(exactamente k éxitos en n lanzamientos de moneda) = C(n, k)/2ⁿ."},{"type":"ne","topic":"Identidades algebraicas","difficulty":"difícil","stem":"If x + 1/x = 5, what is the value of x² + 1/x²?","answer":"23","solution":"Idea clave: eleva al cuadrado la expresión que te dan; el término cruzado x · (1/x) vale 1.\nPaso a paso:\n1) (x + 1/x)² = x² + 2·x·(1/x) + 1/x² = x² + 2 + 1/x².\n2) 5² = 25 = x² + 2 + 1/x².\n3) x² + 1/x² = 23.\nCómo comprobarlo: x = (5 + √21)/2 ≈ 4.79 → x² ≈ 22.96, 1/x² ≈ 0.04 → suma ≈ 23 ✓.\nTrampa: elevar término por término y obtener 25.\nPara la próxima: si ves x + 1/x y te piden x² + 1/x², eleva al cuadrado y resta 2."},{"type":"ne","topic":"Proporciones: precio","difficulty":"media","stem":"A store sells pens at a price of 3 pens for $2. At this rate, how many dollars would 27 pens cost?","answer":"18","solution":"Idea clave: una tasa (\"3 por $2\") se escala con una proporción.\nPaso a paso:\n1) 27 plumas = 27/3 = 9 grupos de 3.\n2) Cada grupo cuesta $2 → 9 × 2 = $18.\nCómo comprobarlo: precio por pluma = 2/3. 27 × 2/3 = 18 ✓.\nTrampa: dividir al revés (27 × 3/2 = 40.5).\nPara la próxima: escribe las unidades: (27 plumas) × ($2 / 3 plumas). Las plumas se cancelan y quedan dólares."},{"type":"ne","topic":"Polígonos","difficulty":"media","stem":"What is the sum, in degrees, of the interior angles of a hexagon?","answer":"720","solution":"Idea clave: la suma de los ángulos interiores de un polígono de n lados es (n − 2) × 180°.\nPaso a paso:\n1) Hexágono: n = 6.\n2) (6 − 2) × 180 = 720.\nCómo comprobarlo: desde un vérti
