licación de los críticos, no el foco del autor.\nPara la próxima: estructura frecuente en el GRE: opinión común → \"But/However\" → la visión del autor. El propósito es presentar la visión del autor."},{"type":"rc","pid":"P6","topic":"Lectura: inferencia","difficulty":"difícil","stem":"The author would most likely agree that the modern critics mentioned in the passage","options":["underestimate the influence of serial publication","are correct that coincidences are lapses of craft","have ignored Victorian fiction entirely","apply a standard that the novelists may not have shared","share the Victorians' belief in providence"],"answer":3,"solution":"Idea clave: para predecir qué pensaría el autor, usa su conclusión final.\nPaso a paso:\n1) Última oración: leer esas coincidencias como fallas de realismo es suponer que los novelistas buscaban un realismo que tal vez no querían.\n2) Es decir, los críticos aplican un criterio (el realismo moderno) que los novelistas quizá no compartían → D.\nTrampa: B es la postura que el autor cuestiona. A habla de la publicación por entregas, que el autor no discute.\nPara la próxima: la última oración suele resumir la postura del autor. Úsala para responder preguntas de \"would agree\"."},{"type":"rc","pid":"P6","multi":true,"topic":"Lectura: detalle","difficulty":"media","stem":"According to the passage, modern critics have attributed Victorian coincidences to which of the following?","options":["The demands of serial publication","A reading public that valued suspense over plausibility","A belief in providence"],"answer":[0,1],"solution":"Idea clave: separa lo que dicen otros (los críticos) de lo que dice el autor.\nPaso a paso:\n1) Los críticos modernos atribuyen las coincidencias a la publicación por entregas (A ✓) y a un público que prefería el suspenso (B ✓).\n2) La providencia (C) es la explicación del autor, no la de los críticos ✗.\nCómo comprobarlo: A y B aparecen en la oración que empieza con \"Modern critics have tended to…\"; C aparece después del \"But\".\nTrampa: C está en el texto, pero atribuida a otra voz.\nPara la próxima: marca quién dice cada cosa en el texto. Muchas trampas del GRE confunden la voz del autor con la de otros."},{"type":"sp","pid":"P2","topic":"Lectura: seleccionar oración","difficulty":"media","stem":"Select the sentence in the passage that identifies the assumptions on which Hardin's model depended.","answer":3,"solution":"Idea clave: en \"select in passage\", busca la oración que hace exactamente lo que pide la pregunta, no solo una que trate el tema.\nPaso a paso:\n1) La pregunta pide los SUPUESTOS del modelo de Hardin.\n2) Revisa las oraciones que hablan de Hardin: la 1.ª describe su argumento, la 2.ª su conclusión y la 4.ª lo que su modelo \"assumed\".\n3) \"Hardin's model, she noted, assumed users who cannot communicate…\" → enumera los supuestos ✓.\nTrampa: la primera oración explica el razonamiento de Hardin, pero no son sus supuestos.\nPara la próxima: subraya la palabra clave de la pregunta (aquí \"assumptions\") y busca en el texto esa idea o un sinónimo (assumed, premise, take for granted)."},{"type":"sp","pid":"P4","topic":"Lectura: seleccionar oración","difficulty":"media","stem":"Select the sentence in the passage that describes an experimental manipulation carried out while subjects were asleep.","answer":6,"solution":"Idea clave: la pregunta describe una acción concreta: una manipulación experimental mientras dormían.\nPaso a paso:\n1) Busca oraciones sobre experimentos: \"Studies have found that quiet wakefulness…\" (vigilia, no sueño) y \"Moreover, researchers who play a sound… to sleeping subjects…\" (sueño ✓).\n2) La segunda describe hacer algo durante el sueño: poner un sonido → esa es.\nTrampa: la oración de la vigilia tranquila también es un estudio, pero no ocurre durante el sueño.\nPara la próxima: revisa que la oración cumpla TODAS las condiciones de la pregunta (aquí: manipulación + sujetos dormidos)."},{"type":"sp","pid":"P6","topic":"Lectura: seleccionar oración","difficulty":"difícil","stem":"Select the sentence in which the author suggests that the critics' judgment reveals more about the critics than about the works they judge.","answer":2,"solution":"Idea clave: busca la oración donde el autor cambia el foco de las novelas hacia quienes las juzgan.\nPaso a paso:\n1) \"But this judgment may say more about our assumptions than about the novels.\"\n2) Dice que el juicio revela los supuestos de los críticos, más que algo sobre las novelas ✓.\nTrampa: la última oración desarrolla la misma idea, pero no la plantea en términos de \"revela más sobre…\".\nPara la próxima: busca la oración que tenga la misma estructura lógica que la pregunta (\"more about X than about Y\")."}]};

function hashStr(s){ let x = 0; for(let i=0;i<s.length;i++){ x = (x*31 + s.charCodeAt(i)) | 0; } return x; }
function groupKey(q){
  if(q.gid) return 'g:' + q.gid;

  if(q.type === 'rc' || q.type === 'sp') return 'h:' + hashStr(q.passage || '');

function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }

function setsSorted(){ return Object.entries(DB.sets).map(([id,x]) => Object.assign({id}, x)).sort((a,b) => (b.date + (b.createdAt||'')).localeCompare(a.date + (a.createdAt||''))); }
function isScheduled(d){ return DB.settings.days.includes(d.getDay()); }
function setMinutes(qs){ return Math.round(qs.reduce((a,q) => a + (TYPES[q.type].sec === 'Q' ? 105 : 90), 0) / 60); }
function scoreRange(set, from, to){ const qs = set.questions || []; let c = 0, t = 0; for(let i = from; i < to; i++){ t++; if(isCorrect(qs[i], (set.answers||{})[i])) c++; } return {c, t}; }
function scoreOf(set){ const qs = set.questions || []; let c = 0, cq = 0, tq = 0, cv = 0, tv = 0;
  qs.forEach((q,i) => { const ok = isCorrect(q, (set.answers||{})[i]); if(ok) c++; if(TYPES[q.type].sec === 'Q'){ tq++; if(ok) cq++; } else { tv++; if(ok) cv++; } });
  return {c, t:qs.length, cq, tq, cv, tv}; }
function missedTopics(){
  const cnt = {};
  setsSorted().filter(s => s.status === 'done').slice(0, 10).forEach(s => (s.questions||[]).forEach((q,i) => { if(!isCorrect(q, (s.answers||{})[i]) && q.topic) cnt[q.topic] = (cnt[q.topic]||0) + 1; }));
  return Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0, 6).map(x => x[0]);
}
function poolFor(sec, o){
  o = o || {}; const st = DB.settings; const types = o.types || st.types; const diff = o.difficulty || st.difficulty; const ex = o.exclude || new Set();
  return allItems().filter(q => TYPES[q.type].sec === sec && types.includes(q.type) && !ex.has(q.id) && (diff === 'mixta' || norm(q.difficulty) === (diff === 'dificil' ? 'dificil' : 'media')));
}
function unseenCount(sec){ return poolFor(sec).filter(q => !DB.seen[q.id]).length; }
function pickUnits(sec, n, o){
  if(n <= 0) return [];
  const weak = new Set(missedTopics()); const focus = norm(DB.settings.focus);
  let pool = poolFor(sec, o);
  if(o && o.difficulty && o.difficulty !== 'mixta' && pool.length < n) pool = pool.concat(poolFor(sec, Object.assign({}, o, {difficulty:'mixta'})).filter(q => !pool.includes(q)));
  const units = {};
  for(const q of pool){ const k = groupKey(q); (units[k] = units[k] || []).push(q); }
  const scored = Object.values(units).map(items => {
    const fresh = items.filter(q => !DB.seen[q.id]);
    const missed = items.filter(q => DB.seen[q.id] && DB.seen[q.id].ok === false);
    const use = fresh.length ? fresh : (missed.length ? missed : items);
    let score = fresh.length ? 1000 : missed.length ? 500 : 0;
    if(use.some(q => weak.has(q.topic))) score += 60;
    if(focus && use.some(q => focus.split(/[,;]/).some(f => f.trim() && norm(q.topic).includes(f.trim())))) score += 80;
    if(!fresh.length) score -= Math.min(400, use.reduce((a,q) => a + ((DB.seen[q.id]||{}).n||0), 0) * 20);
    return {use, score: score + Math.random() * 50};
  }).sort((a,b) => b.score - a.score);
  const out = [];
  for(const u of scored){ if(out.length >= n) break; out.push(...u.use.slice(0, n - out.length)); }
  // keep set-based items (passage / data) together, standalone items after
  return out;
}
function newSet(kind, date, questions, sections, extra){
  const id = 'set-' + date + (kind === 'daily' ? '' : '-' + kind + Date.now().toString(36));
  DB.sets[id] = Object.assign({kind, date, createdAt:new Date().toISOString(), status:'pending', questions:clone(questions), answers:{}, marked:{}, idx:0, secIdx:0, secStart:{}, sections, extra: kind !== 'daily'}, extra || {});
  save(); return id;
}
function buildSet(date, extra){
  const st = DB.settings; const n = Math.max(1, Math.min(40, st.perDay|0));
  const hasQ = st.types.some(t => TYPES[t].sec === 'Q'), hasV = st.types.some(t => TYPES[t].sec === 'V');
  if(!hasQ && !hasV){ toast('Activa al menos un tipo de ejercicio en Ajustes.'); return null; }
  const nq = hasQ ? (hasV ? Math.round(n * st.quantPct / 100) : n) : 0; const nv = n - nq;
  const qs = pickUnits('Q', nq).concat(pickUnits('V', nv));
  if(!qs.length){ toast('No hay ejercicios con esos ajustes. Revisa tipos y dificultad.'); return null; }
  return newSet(extra ? 'extra' : 'daily', date, qs, [{kind:'mixed', en:'Practice Session', from:0, to:qs.length, min: st.timed ? setMinutes(qs) : null}]);
}
const MOCK_PLAN = [ {sec:'V', en:'Verbal Reasoning', n:12, min:18}, {sec:'Q', en:'Quantitative Reasoning', n:12, min:21}, {sec:'V', en:'Verbal Reasoning', n:15, min:23, adaptive:0}, {sec:'Q', en:'Quantitative Reasoning', n:15, min:26, adaptive:1} ];
function buildMock(withAwa){
  const sections = []; let qs = [];
  if(withAwa) sections.push({kind:'awa', en:'Analytical Writing', from:0, to:0, min:30});
  const used = new Set();
  MOCK_PLAN.forEach((p, i) => {
    const s = {kind:p.sec.toLowerCase(), en:p.en, n:p.n, min:p.min, sec:p.sec, plan:i};
    if(p.adaptive == null){ const items = pickUnits(p.sec, p.n, {types:ALL_TYPES, difficulty:'mixta', exclude:used}); items.forEach(q => used.add(q.id)); s.from = qs.length; qs = qs.concat(items); s.to = qs.length; }
    sections.push(s);
  });
  return newSet('mock', dkey(), qs, sections, withAwa ? {awaPrompt: pickAwa()} : {});
}
function fillAdaptive(set, si){
  const s = set.sections[si]; if(s.from != null) return;
  const firstIdx = set.sections.findIndex(x => x.plan === MOCK_PLAN[s.plan].adaptive);
  const f = set.sections[firstIdx]; const sc = scoreRange(set, f.from, f.to);
  const hard = sc.t && sc.c / sc.t >= 0.6; s.level = hard ? 'difícil' : 'media';
  const used = new Set(set.questions.map(q => q.id));
  const items = pickUnits(s.sec, s.n, {types:ALL_TYPES, difficulty: hard ? 'dificil' : 'media', exclude:used});
  s.from = set.questions.length; set.questions = set.questions.concat(clone(items)); s.to = set.questions.length; save();
}
function buildAwa(){ return newSet('awa', dkey(), [], [{kind:'awa', en:'Analytical Writing', from:0, to:0, min:30}], {awaPrompt: pickAwa()}); }

function sv(tag, attrs, text){ const e = document.createElementNS(SVGNS, tag); for(const k in attrs || {}) e.setAttribute(k, attrs[k]); if(text != null) e.textContent = text; return e; }

function niceMax(m){ if(m <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); for(const k of [1,2,2.5,5,10]) if(k*p >= m) return k*p; return 10*p; }
function renderChart(c){
  const W = 360, H = 230, L = 40, R = 10, T = 14, B = 34; const pw = W - L - R, ph = H - T - B;
  const vals = c.series.flatMap(s => s.values); const max = isNum(c.yMax) && c.yMax >= Math.max(...vals) ? c.yMax : niceMax(Math.max(...vals));
  const svg = sv('svg',{viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':c.title || 'Chart', class:'chart'});
  const y = v => T + ph - v / max * ph;
  for(let i=0;i<=5;i++){ const v = max * i / 5; const yy = y(v); svg.append(sv('line',{x1:L, x2:W-R, y1:yy, y2:yy, class:'grid'})); svg.append(sv('text',{x:L-6, y:yy+4, 'text-anchor':'end', class:'tick'}, String(Math.round(v*100)/100))); }
  svg.append(sv('line',{x1:L, x2:L, y1:T, y2:T+ph, class:'axis'})); svg.append(sv('line',{x1:L, x2:W-R, y1:T+ph, y2:T+ph, class:'axis'}));
  const n = c.categories.length, slot = pw / n; const colors = ['s0','s1','s2'];
  c.categories.forEach((cat, i) => svg.append(sv('text',{x:L + slot*i + slot/2, y:T+ph+16, 'text-anchor':'middle', class:'tick'}, String(cat))));
  if(c.type === 'bar'){
    const k = c.series.length, bw = Math.min(26, slot*0.75/k);
    c.series.forEach((s, si) => s.values.forEach((v, i) => { const x = L + slot*i + slot/2 - bw*k/2 + bw*si;
      svg.append(sv('rect',{x, y:y(v), width:bw-2, height:T+ph-y(v), class:'bar ' + colors[si]}));
      svg.append(sv('text',{x:x + (bw-2)/2, y:y(v)-3, 'text-anchor':'middle', class:'val'}, String(v))); }));
  } else {
    c.series.forEach((s, si) => { const pts = s.values.map((v,i) => [L + slot*i + slot/2, y(v)]);
      svg.append(sv('polyline',{points:pts.map(p => p.join(',')).join(' '), class:'ln ' + colors[si]}));
      pts.forEach((p,i) => { svg.append(sv('circle',{cx:p[0], cy:p[1], r:3.5, class:'dot ' + colors[si]})); svg.append(sv('text',{x:p[0], y:p[1]-8, 'text-anchor':'middle', class:'val'}, String(s.values[i]))); }); });
  }
  const legend = c.series.length > 1 ? h('div',{class:'legend'}, c.series.map((s,si) => h('span',null, h('i',{class:colors[si]}), String(s.name)))) : null;
  return h('figure',{class:'data'}, c.title ? h('figcaption',{text:c.title}) : null, h('div',{class:'chartwrap'}, svg), legend, c.yLabel ? h('p',{class:'small muted',text:c.yLabel}) : null);
}

/* ---------------- calculator ---------------- */
const C = {entry:'0', tokens:[], active:false, replace:true, mem:0, err:false, x:null, y:null};
function cFmt(n){ if(!isFinite(n) || Math.abs(n) >= 1e12) return null; let s = String(Number(n.toPrecision(10))); if(s === '-0') s = '0'; return s; }
function cPushNum(n){ const l = C.tokens[C.tokens.length-1]; if(typeof l === 'number' || l === ')') C.tokens.push('×'); C.tokens.push(n); }
function cEval(tokens){

    else { while(ops.length && ops[ops.length-1] !== '(' && prec[ops[ops.length-1]] >= prec[t]) apply(); ops.push(t); } }
  while(ops.length){ if(ops[ops.length-1] === '(') ops.pop(); else apply(); }

}
function cErr(){ C.err = true; C.entry = 'Error'; C.tokens = []; C.active = false; C.replace = true; updCalc(); }
function calcPress(k){

    if(C.tokens.length){ try{ const s = cFmt(cEval(C.tokens)); if(s == null) return cErr(); C.entry = s; }catch(e){ return cErr(); } C.tokens = []; }
    C.active = true; C.replace = true; }
  else if(k === 'C'){ C.entry = '0'; C.tokens = []; C.active = false; C.replace = true; C.err = false; }
  else if(k === 'CE'){ C.entry = '0'; C.active = false; C.replace = true; }
