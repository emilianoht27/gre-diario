],"answer":[0],"solution":"Idea clave: \"supported by the passage\" = el texto lo dice o lo implica sin lugar a dudas.\nPaso a paso:\n1) A: \"quiet wakefulness does help—but not as much\" → mejora la memoria en cierto grado ✓.\n2) B: la mejora fue \"selectively improved recall of the cued material\", no de todo ✗.\n3) C: \"Neither finding refutes the passive account outright\" → no está refutada ✗.\nCómo comprobarlo: B y C contradicen palabras específicas del texto (selectively, outright).\nTrampa: puede haber solo una respuesta correcta en \"select all\"; no asumas que siempre son dos o más.\nPara la próxima: busca palabras de grado en el texto (selectively, outright, partly) y compáralas con las de cada opción.","cat":"ver"},{"type":"rc","pid":"P5","topic":"Argumentos: debilitar","difficulty":"media","stem":"Which of the following, if true, most seriously weakens the council's prediction?","options":["Streetlights cost less to operate than they did a decade ago.","The neighborhoods with more streetlights are also those with the highest household incomes and the most private security patrols.","Some burglaries in the city occur during the day.","Residents of the high-burglary neighborhoods support the proposal.","Burglary rates have declined citywide over the past five years."],"answer":1,"solution":"Idea clave: para debilitar un argumento causal (A causa B), busca otra causa que explique la correlación.\nPaso a paso:\n1) El argumento: barrios con más luces tienen menos robos → las luces reducen los robos.\n2) Supuesto oculto: no hay otra diferencia entre esos barrios.\n3) B rompe el supuesto: esos barrios también son más ricos y tienen patrullas privadas, que podrían explicar los pocos robos.\nCómo comprobarlo: si B es cierta, agregar luces a barrios pobres no necesariamente reduciría los robos.\nTrampa: C (robos de día) no toca un argumento sobre robos nocturnos. E (baja general) no explica la diferencia entre barrios.\nPara la próxima: estructura típica del GRE: correlación → causa → plan. Debilitar = otra causa; fortalecer = descartar otras causas.","cat":"ver"},{"type":"rc","pid":"P5","topic":"Argumentos: fortalecer","difficulty":"media","stem":"Which of the following, if true, most strengthens the council's prediction?","options":["Most residents of the city consider streetlights unattractive.","Burglars tend to operate in neighborhoods far from where they live.","The council has installed streetlights in other neighborhoods in the past.","In other cities, adding streetlights to high-burglary areas was followed by declines in nighttime burglary not seen in comparable areas without new lights.","Some streetlights in the city are frequently out of service."],"answer":3,"solution":"Idea clave: para fortalecer un argumento causal, busca evidencia de que la causa propuesta funciona en condiciones comparables.\nPaso a paso:\n1) La predicción: poner luces → bajarán los robos.\n2) D: en otras ciudades, poner luces en zonas con muchos robos fue seguido de una baja que no ocurrió en zonas comparables sin luces nuevas.\n3) Eso es casi un experimento con grupo de control → apoya que las luces causan el efecto.\nTrampa: C. Que el consejo haya puesto luces antes no dice nada sobre el resultado.\nPara la próxima: las opciones de \"strengthen\" más fuertes muestran que, al cambiar la causa y mantener todo lo demás igual, cambia el efecto.","cat":"ver"},{"type":"rc","pid":"P5","topic":"Argumentos: suposición","difficulty":"difícil","stem":"The council's prediction depends on which of the following assumptions?","options":["Residents of high-burglary neighborhoods are more likely to report crimes.","Nighttime burglary is the most common crime in the city.","The cost of new streetlights will be covered by the state.","Daytime burglary will not increase in the affected neighborhoods.","The lower burglary rates in well-lit neighborhoods are at least partly caused by the streetlights."],"answer":4,"solution":"Idea clave: una suposición necesaria es algo que el argumento da por hecho sin decirlo. Prueba de negación: si niegas la opción y el argumento se cae, es la suposición.\nPaso a paso:\n1) El argumento pasa de \"más luces se asocian con menos robos\" a \"poner luces reducirá los robos\".\n2) Para eso necesita que las luces causen, al menos en parte, la menor cantidad de robos.\n3) Niega E: \"las luces no causan nada\". El plan ya no tiene sentido → E es la suposición.\nCómo comprobarlo: niega D: \"los robos de día aumentarán\". La predicción sobre robos nocturnos sigue en pie, así que D no es necesaria.\nTrampa: B y C son afirmaciones relacionadas, pero el argumento no depende de ellas.\nPara la próxima: técnica de negación. Si al negar la opción el argumento sigue en pie, esa opción no es la suposición.","cat":"ver"},{"type":"rc","pid":"P6","topic":"Lectura: propósito","difficulty":"media","stem":"The primary purpose of the passage is to","options":["argue that Victorian novels are more realistic than modern ones","explain the effects of serial publication on Victorian plots","criticize Victorian readers for preferring suspense to plausibility","trace the decline of religious belief in the nineteenth century","offer an alternative interpretation of a feature commonly regarded as a flaw"],"answer":4,"solution":"Idea clave: el propósito del texto suele aparecer después de un \"But\" que corrige una opinión común.\nPaso a paso:\n1) Inicio: la gente y los críticos ven las coincidencias como un defecto.\n2) Giro: \"But this judgment may say more about our assumptions…\"\n3) Desarrollo: propone leer las coincidencias como expresión de la idea de providencia.\n4) Propósito: ofrecer otra interpretación de algo considerado un defecto → E.\nTrampa: B es la explicación de los críticos, no el foco del autor.\nPara la próxima: estructura frecuente en el GRE: opinión común → \"But/However\" → la visión del autor. El propósito es presentar la visión del autor.","cat":"ver"},{"type":"rc","pid":"P6","topic":"Lectura: inferencia","difficulty":"difícil","stem":"The author would most likely agree that the modern critics mentioned in the passage","options":["underestimate the influence of serial publication","are correct that coincidences are lapses of craft","have ignored Victorian fiction entirely","apply a standard that the novelists may not have shared","share the Victorians' belief in providence"],"answer":3,"solution":"Idea clave: para predecir qué pensaría el autor, usa su conclusión final.\nPaso a paso:\n1) Última oración: leer esas coincidencias como fallas de realismo es suponer que los novelistas buscaban un realismo que tal vez no querían.\n2) Es decir, los críticos aplican un criterio (el realismo moderno) que los novelistas quizá no compartían → D.\nTrampa: B es la postura que el autor cuestiona. A habla de la publicación por entregas, que el autor no discute.\nPara la próxima: la última oración suele resumir la postura del autor. Úsala para responder preguntas de \"would agree\".","cat":"ver"},{"type":"rc","pid":"P6","multi":true,"topic":"Lectura: detalle","difficulty":"media","stem":"According to the passage, modern critics have attributed Victorian coincidences to which of the following?","options":["The demands of serial publication","A reading public that valued suspense over plausibility","A belief in providence"],"answer":[0,1],"solution":"Idea clave: separa lo que dicen otros (los críticos) de lo que dice el autor.\nPaso a paso:\n1) Los críticos modernos atribuyen las coincidencias a la publicación por entregas (A ✓) y a un público que prefería el suspenso (B ✓).\n2) La providencia (C) es la explicación del autor, no la de los críticos ✗.\nCómo comprobarlo: A y B aparecen en la oración que empieza con \"Modern critics have tended to…\"; C aparece después del \"But\".\nTrampa: C está en el texto, pero atribuida a otra voz.\nPara la próxima: marca quién dice cada cosa en el texto. Muchas trampas del GRE confunden la voz del autor con la de otros.","cat":"ver"},{"type":"sp","pid":"P2","topic":"Lectura: seleccionar oración","difficulty":"media","stem":"Select the sentence in the passage that identifies the assumptions on which Hardin's model depended.","answer":3,"solution":"Idea clave: en \"select in passage\", busca la oración que hace exactamente lo que pide la pregunta, no solo una que trate el tema.\nPaso a paso:\n1) La pregunta pide los SUPUESTOS del modelo de Hardin.\n2) Revisa las oraciones que hablan de Hardin: la 1.ª describe su argumento, la 2.ª su conclusión y la 4.ª lo que su modelo \"assumed\".\n3) \"Hardin's model, she noted, assumed users who cannot communicate…\" → enumera los supuestos ✓.\nTrampa: la primera oración explica el razonamiento de Hardin, pero no son sus supuestos.\nPara la próxima: subraya la palabra clave de la pregunta (aquí \"assumptions\") y busca en el texto esa idea o un sinónimo (assumed, premise, take for granted).","cat":"ver"},{"type":"sp","pid":"P4","topic":"Lectura: seleccionar oración","difficulty":"media","stem":"Select the sentence in the passage that describes an experimental manipulation carried out while subjects were asleep.","answer":6,"solution":"Idea clave: la pregunta describe una acción concreta: una manipulación experimental mientras dormían.\nPaso a paso:\n1) Busca oraciones sobre experimentos: \"Studies have found that quiet wakefulness…\" (vigilia, no sueño) y \"Moreover, researchers who play a sound… to sleeping subjects…\" (sueño ✓).\n2) La segunda describe hacer algo durante el sueño: poner un sonido → esa es.\nTrampa: la oración de la vigilia tranquila también es un estudio, pero no ocurre durante el sueño.\nPara la próxima: revisa que la oración cumpla TODAS las condiciones de la pregunta (aquí: manipulación + sujetos dormidos).","cat":"ver"},{"type":"sp","pid":"P6","topic":"Lectura: seleccionar oración","difficulty":"difícil","stem":"Select the sentence in which the author suggests that the critics' judgment reveals more about the critics than about the works they judge.","answer":2,"solution":"Idea clave: busca la oración donde el autor cambia el foco de las novelas hacia quienes las juzgan.\nPaso a paso:\n1) \"But this judgment may say more about our assumptions than about the novels.\"\n2) Dice que el juicio revela los supuestos de los críticos, más que algo sobre las novelas ✓.\nTrampa: la última oración desarrolla la misma idea, pero no la plantea en términos de \"revela más sobre…\".\nPara la próxima: busca la oración que tenga la misma estructura lógica que la pregunta (\"more about X than about Y\").","cat":"ver"}]};

{id:'arit-div', cat:'arit', t:'Divisibilidad, primos y residuos', min:25,

  "Para saber si N es primo, prueba los primos hasta √N (para 91 basta probar 2, 3, 5 y 7: 91 = 7 × 13).",
  "Divisibilidad: entre 3 si la suma de los dígitos lo es (igual con 9); entre 4 si los dos últimos dígitos lo son; entre 8, los tres últimos; entre 6 si es par y múltiplo de 3; entre 11 si la suma alternada de dígitos lo es."],
 rules:["N = pᵃ · qᵇ · rᶜ → número de divisores positivos = (a + 1)(b + 1)(c + 1).",

  "Unidades de potencias: 2 → 2, 4, 8, 6 · 3 → 3, 9, 7, 1 · 7 → 7, 9, 3, 1 · 8 → 8, 4, 2, 6 · 4 → 4, 6 · 9 → 9, 1 · 0, 1, 5 y 6 se quedan igual."],

{id:'arit-exp', cat:'arit', t:'Exponentes, raíces y valor absoluto', min:20,
 key:["Leyes: aᵐ·aⁿ = aᵐ⁺ⁿ; aᵐ/aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ; (ab)ⁿ = aⁿbⁿ; a⁰ = 1; a⁻ⁿ = 1/aⁿ; a^(1/n) es la raíz n-ésima de a.",
  "Para comparar o igualar potencias, reescribe todo con la misma base (2, 3 o 5).",

  "Entre 0 y 1, elevar a una potencia mayor achica el número. Con negativos: exponente par → positivo; impar → negativo."],

{id:'pct-pct', cat:'pct', t:'Porcentajes y cambio porcentual', min:25,

const SPEC = `ITEM JSON FORMAT (one object per item):

 "difficulty": "media" | "difícil",

 "passage": reading passage (rc and sp only; repeat the full passage in every item that uses it),
 "stem": the question text ("" allowed only for qc),
 "info": centered given information (qc only),
 "quantityA": "...", "quantityB": "..." (qc only),
 "options": answer choices (mc: exactly 5; ms: 3 to 7; se: exactly 6; rc single: exactly 5; rc multi: exactly 3; others: []),
 "blanks": tc only: 1 blank → [[5 choices]]; 2 or 3 blanks → 3 choices each,
 "multi": true only for rc "select all that apply",
 "answer": qc/mc/rc-single → 0-based index; ms/se/rc-multi → array of indices; tc → array with one index per blank; ne → exact number as a string; sp → 0-based sentence index,
 "answerSentence": sp only — the exact text of the correct sentence, copied from the passage,
 "tolerance": ne only, if rounding is asked (e.g. "0.5" for "nearest whole percent"),
 "table": optional {"title": "...", "headers": [...], "rows": [[...], ...]} (all cells as strings),
 "chart": optional {"type": "bar" | "line", "title": "...", "categories": [...], "series": [{"name": "...", "values": [numbers]}], "yMax": number},
 "figure": optional geometry figure in a pixel coordinate system (y grows downward), max 360×260: {"width": 300, "height": 220, "points": {"A": [x, y], ...}, "segments": [["A","B"], ...], "circles": [{"center": "O", "radius": 80}], "rightAngles": [["A","C","B"]], "labels": [{"at": [x, y], "text": "35°"}], "note": "Note: Figure not drawn to scale."},
 "solution": teaching explanation in SPANISH with the labeled lines described in the rules}
qc answer codes: 0 = Quantity A is greater, 1 = Quantity B is greater, 2 = equal, 3 = cannot be determined.
sp = Reading Comprehension "select the sentence in the passage" item; sentences are split at . ! ? within each paragraph.`;

/* ---------------- records & analytics ---------------- */
function allRecords(){
  const out = [];
  Object.entries(DB.sets).forEach(([sid, s]) => { if(s.status !== 'done') return;
    (s.questions || []).forEach((q, i) => { const a = (s.answers || {})[i];
      const sec = (s.sections || []).find(x => x.from != null && i >= x.from && i < x.to);
      out.push({q, sid, i, kind:s.kind, date:s.date, cat:catOf(q), type:q.type, diff:norm(q.difficulty) === 'dificil' ? 'dificil' : 'media', ok:isCorrect(q, a), blank:!isAnswered(q, a), t:(s.qtime || {})[i] != null ? s.qtime[i] : null, cause:(s.cause || {})[i] || null, secLevel: sec ? sec.level : null}); }); });
  return out;
}
function catStats(recs){
  const out = {}; (recs || allRecords()).forEach(r => { if(r.cat === 'ver') return; const o = out[r.cat] = out[r.cat] || {n:0, c:0, t:0, tn:0}; o.n++; if(r.ok) o.c++; if(r.t != null){ o.t += r.t; o.tn++; } });
  DB.manual.forEach(m => { if(!m.cat || m.cat === 'ver') return; const o = out[m.cat] = out[m.cat] || {n:0, c:0, t:0, tn:0}; o.n++; });
  return out;
}
function weakCats(k){

  return arr.length >= 2 ? arr.slice(0, k).map(a => a[0]) : null;
}
function missedQuestions(){
  const last = {}; setsSorted().slice().reverse().filter(s => s.status === 'done').forEach(s => (s.questions || []).forEach((q, i) => { last[q.id] = {q, ok:isCorrect(q, (s.answers || {})[i]), sid:s.id, i, date:s.date}; }));
  return Object.values(last).filter(x => !x.ok);
}
function median(a){ if(!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; }
function sectionResults(){

}

function composeQuant(n, o){

  let items = pickUnits('Q', nb, {types:o.types || ALL_TYPES, difficulty: hard ? 'dificil' : 'mixta', cats:o.cats, exclude:o.exclude});
  const used = new Set((o.exclude ? [...o.exclude] : []).concat(items.map(q => q.id)));
  const gen = genItems(o.cats, n - items.length, {lv: hard ? 'hard' : (o.lv === 'easy' ? 'easy' : 'mix'), qcOnly});
  items = items.concat(gen); gen.forEach(q => used.add(q.id));
  if(items.length < n){ const extra = pickUnits('Q', n - items.length, {types:o.types || ALL_TYPES, difficulty:'mixta', cats:o.cats, exclude:used}); items = items.concat(extra); }
  return items.slice(0, n);
}

/* ---------------- progress ---------------- */
function analysis(){
  const recs = allRecords().filter(r => r.cat !== 'ver'); const A = {recs, n:recs.length, c:recs.filter(r => r.ok).length};
  A.cats = catStats(recs); A.diff = {media:{n:0, c:0}, dificil:{n:0, c:0}}; recs.forEach(r => { const o = A.diff[r.diff]; o.n++; if(r.ok) o.c++; });
  A.types = {}; recs.forEach(r => { const o = A.types[r.type] = A.types[r.type] || {n:0, c:0, t:[]}; o.n++; if(r.ok) o.c++; if(r.t != null) o.t.push(r.t); });
  A.causes = {}; recs.filter(r => !r.ok && r.cause).forEach(r => { A.causes[r.cause] = (A.causes[r.cause] || 0) + 1; }); DB.manual.forEach(m => { if(m.cause) A.causes[m.cause] = (A.causes[m.cause] || 0) + 1; });
  A.unclassified = recs.filter(r => !r.ok && !r.cause).length;
  const tm = recs.filter(r => r.t != null);
  A.time = {med: median(tm.map(r => r.t)), hard: median(tm.filter(r => r.diff === 'dificil').map(r => r.t)), okSlow: tm.filter(r => r.ok && r.t > 150).length, fastWrong: tm.filter(r => !r.ok && !r.blank && r.t < 45).length, wrongTimed: tm.filter(r => !r.ok && !r.blank).length, blank: recs.filter(r => r.blank).length};
  A.sections = sectionResults(); return A;
}
function recommendations(A){
  const R = []; if(A.n < 10){ R.push('Completa al menos 10 ejercicios para ver recomendaciones basadas en tus datos.'); return R; }
  const cs = Object.entries(A.cats).filter(([, o]) => o.n >= 5).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n);
  if(cs.length){ const [c, o] = cs[0]; const acc = Math.round(o.c / o.n * 100); if(acc < 85) R.push(`Tu tema más débil es ${CATS[c]} (${acc}% en ${o.n} ejercicios). Prioridad: lección + 15 ejercicios dos veces por semana.`); }
  if(A.diff.dificil.n >= 6){ const a = Math.round(A.diff.dificil.c / A.diff.dificil.n * 100); if(a < 80) R.push(`En el nivel difícil aciertas ${a}%. Como tu primera sección ya te manda a la difícil, ahí se decide tu puntaje: apunta a 85% o más.`); }
  const top = Object.entries(A.causes).sort((a, b) => b[1] - a[1])[0];
  const msg = {calculo:'Tu causa principal de errores son las cuentas: comprueba cada respuesta con otro método y entrena los drills de datos.', leido:'Muchos errores son de lectura: antes de responder, vuelve a leer qué piden (valor, expresión, unidades, ≥ o >).', nosabia:'Los errores por «no sabía» son huecos de contenido: repasa las lecciones de los temas donde fallas.', tiempo:'Pierdes puntos por tiempo: usa dos pasadas y la regla de 45 segundos.', adivine:'Estás adivinando bastante: son temas que aún no dominas; repásalos con su lección.'};
  if(top && top[1] >= 3) R.push(msg[top[0]]);
  if(A.unclassified >= 5) R.push(`Tienes ${A.unclassified} errores sin clasificar. Marca su causa (Progreso › Errores): es el dato que más ayuda a mejorar.`);
  if(A.time.wrongTimed >= 6 && A.time.fastWrong / A.time.wrongTimed > 0.35) R.push('Muchos errores ocurren en menos de 45 segundos: prisa o lectura apresurada. Lee dos veces antes de empezar.');
  if(A.time.hard && A.time.hard > 135) R.push(`Tu tiempo mediano en preguntas difíciles es ${fmtTime(A.time.hard)} (objetivo ≈ 1:45). Practica sustitución y estimación.`);
  if(A.time.okSlow >= 3) R.push(`${A.time.okSlow} respuestas correctas tardaron más de 2:30. Revisa su explicación: casi siempre hay un camino más corto.`);
  if(A.time.blank >= 3) R.push(`Dejaste ${A.time.blank} preguntas sin responder. En el examen nunca se deja una en blanco: adivina con descarte.`);
  const q2 = A.sections.filter(s => s.sec === 'Q2'); if(q2.length){ const l = q2[q2.length - 1]; R.push(`Tu última sección difícil (Q2): ${l.c}/${l.t}. Meta: ${Math.ceil(l.t * 0.87)}/${l.t} o más.`); }

  if(S.packFocus) kids.push(h('div',{class:'notice'}, h('strong',{text:'Paquete de la semana: '}), S.packFocus.title + '. Las instrucciones de abajo ya piden ejercicios de ese tema, solo Quant y de nivel difícil. ', h('button',{class:'btn link',style:'padding:0',text:'Quitar enfoque',onclick:()=>{ S.packFocus = null; renderKeep(); }})));
  return kids.concat(bankView());
}

/* ---------------- settings ---------------- */
function settingsView(){
  const st = DB.settings; const DAYS = ['D','L','M','M','J','V','S']; const order = [1,2,3,4,5,6,0];
  const upd = () => { save(); renderKeep(); };
  const restoreTa = h('textarea',{class:'input',style:'min-height:80px;font-size:.8rem',placeholder:'Pega aquí un respaldo para restaurarlo'});

    h('div',{class:'card'},
      h('div',{class:'field'}, h('label',{for:'mix',text:`Mezcla: ${st.quantPct}% cuantitativo · ${100-st.quantPct}% verbal`}), h('input',{type:'range',id:'mix',min:'0',max:'100',step:'10',value:String(st.quantPct),oninput:e=>{ st.quantPct = Number(e.target.value); e.target.previousSibling.textContent = `Mezcla: ${st.quantPct}% cuantitativo · ${100-st.quantPct}% verbal`; save(); }})),
      h('div',{class:'field'}, h('span',{class:'lbl',text:'Dificultad'}), h('div',{class:'chips'}, [['mixta','Mixta'],['media','Media'],['dificil','Difícil']].map(([k,l]) => h('button',{class:'chip','aria-pressed': st.difficulty===k?'true':'false',text:l,onclick:()=>{ st.difficulty = k; upd(); }}))))),
    h('div',{class:'card'}, h('h2',{text:'Tipos de ejercicio en paquetes de Claude'}),
      ['Q','V'].map(sec => h('div',null, h('div',{class:'small muted',style:'margin-top:8px',text: sec === 'Q' ? 'Cuantitativo' : 'Verbal'}),
        Object.keys(TYPES).filter(k => TYPES[k].sec === sec).map(k => h('label',{class:'check'}, h('input',{type:'checkbox',checked:st.types.includes(k),onchange:e=>{ st.types = e.target.checked ? st.types.concat(k) : st.types.filter(x=>x!==k); save(); }}), h('span',{text:TYPES[k].name}))))),
      h('p',{class:'small muted',text:'Estas preferencias (mezcla, dificultad, tipos y temas) se usan al pedir paquetes nuevos a Claude. El plan y el simulacro usan todos los tipos.'})),
    h('div',{class:'card'},
      h('label',{class:'check'}, h('input',{type:'checkbox',checked:st.timed,onchange:e=>{ st.timed = e.target.checked; save(); }}), h('span',null, h('strong',{text:'Cronómetro con ritmo GRE en el set diario'}), h('br'), h('span',{class:'small muted',text:'Unos 1:45 por ejercicio cuantitativo y 1:30 por verbal. Al llegar a cero la sesión se cierra. El simulacro y el ensayo siempre tienen tiempo.'}))),
      h('div',{class:'field'}, h('label',{for:'focus',text:'Temas que quieres reforzar (opcional)'}), h('input',{class:'input',id:'focus',value:st.focus,placeholder:'Ej. probabilidad, comparación, vocabulario',oninput:e=>{ st.focus = e.target.value; save(); }}))),
    h('div',{class:'card'}, h('h2',{text:'Respaldo'}),
      h('p',{class:'small muted',style:'margin:0 0 10px',text:'Tu progreso y los ejercicios que agregues viven solo en este teléfono. Copia un respaldo de vez en cuando y guárdalo en Notas.'}),
      h('div',{class:'row'}, h('button',{class:'btn',text:'Copiar respaldo',onclick:async()=>{ toast(await copyText(JSON.stringify({app:'gre-diario',v:3,data:DB})) ? 'Respaldo copiado.' : 'No se pudo copiar.'); }})),
      h('div',{class:'field'}, restoreTa),
      h('div',{class:'row'}, h('button',{class:'btn',text:'Restaurar respaldo',onclick:()=>{ try{ const x = JSON.parse(restoreTa.value); if(!x || x.app !== 'gre-diario' || !x.data) throw 0;
          openModal(h('div',{class:'modal'}, h('h2',{text:'¿Restaurar respaldo?'}), h('p',{text:'Reemplaza el progreso actual de este teléfono.'}), h('div',{class:'row',style:'justify-content:flex-end'}, h('button',{class:'btn',text:'Cancelar',onclick:closeModal}), h('button',{class:'btn primary',text:'Restaurar',onclick:()=>{ localStorage.setItem(LS, JSON.stringify(x.data)); DB = loadDB(); closeModal(); toast('Respaldo restaurado.'); S.tab = 'home'; render(); }}))));
        }catch(e){ toast('Ese texto no es un respaldo válido.'); } }}))),
    h('p',{class:'small muted',text:'Ejercicios originales con el formato del GRE General Test, no preguntas oficiales de ETS. Para material oficial usa los exámenes POWERPREP.'})

/* ---------------- modal ---------------- */
function openModal(c){ closeModal(); const ov = h('div',{class:'ov',id:'ov',onclick:e=>{ if(e.target === ov) closeModal(); }}, c); document.body.append(ov); }
function closeModal(){ const o = document.getElementById('ov'); if(o) o.remove(); }
/* ---------------- calculator ---------------- */
const C = {entry:'0', tokens:[], active:false, replace:true, mem:0, err:false, x:null, y:null};
function cFmt(n){ if(!isFinite(n) || Math.abs(n) >= 1e12) return null; let s = String(Number(n.toPrecision(10))); if(s === '-0') s = '0'; return s; }
function cPushNum(n){ const l = C.tokens[C.tokens.length-1]; if(typeof l === 'number' || l === ')') C.tokens.push('×'); C.tokens.push(n); }
function cEval(tokens){
  const prec = {'+':1,'−':1,'×':2,'÷':2}; const out = [], ops = [];
  const apply = () => { const op = ops.pop(); const b = out.pop(), a = out.pop(); if(a == null || b == null) throw 0; if(op === '÷' && b === 0) throw 'div'; out.push(op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:a/b); };
  for(const t of tokens){ if(typeof t === 'number') out.push(t); else if(t === '(') ops.push(t); else if(t === ')'){ while(ops.length && ops[ops.length-1] !== '(') apply(); ops.pop(); }
    else { while(ops.length && ops[ops.length-1] !== '(' && prec[ops[ops.length-1]] >= prec[t]) apply(); ops.push(t); } }
  while(ops.length){ if(ops[ops.length-1] === '(') ops.pop(); else apply(); }
  if(out.length !== 1) throw 0; return out[0];
}
function cErr(){ C.err = true; C.entry = 'Error'; C.tokens = []; C.active = false; C.replace = true; updCalc(); }
function calcPress(k){
  if(C.err && k !== 'C') return; const isOp = t => typeof t === 'string' && '+−×÷'.includes(t) && t.length === 1;
  const open = () => C.tokens.filter(t=>t==='(').length - C.tokens.filter(t=>t===')').length;
  if(/^[0-9]$/.test(k)){ if(C.replace || !C.active){ C.entry = k; C.replace = false; } else if(C.entry.replace(/[-.]/g,'').length < 10) C.entry = C.entry === '0' ? k : C.entry === '-0' ? '-'+k : C.entry + k; C.active = true; }
  else if(k === '.'){ if(C.replace || !C.active){ C.entry = '0.'; C.replace = false; } else if(!C.entry.includes('.')) C.entry += '.'; C.active = true; }
  else if(k === '±'){ if(C.entry !== '0') C.entry = C.entry.startsWith('-') ? C.entry.slice(1) : '-' + C.entry; C.active = true; }
  else if(k === '√'){ const v = Number(C.entry); if(v < 0) return cErr(); const s = cFmt(Math.sqrt(v)); if(s == null) return cErr(); C.entry = s; C.active = true; C.replace = true; }
  else if(isOp(k)){ const l = C.tokens[C.tokens.length-1];
    if(C.active){ cPushNum(Number(C.entry)); C.active = false; } else if(isOp(l)) C.tokens.pop(); else if(l === '(' || !C.tokens.length) C.tokens.push(Number(C.entry));
    try{ if(open() === 0){ const p = cFmt(cEval(C.tokens)); if(p != null) C.entry = p; } }catch(e){ if(e === 'div') return cErr(); }
    C.tokens.push(k); C.replace = true; }
  else if(k === '('){ if(C.active){ cPushNum(Number(C.entry)); C.active = false; } const l = C.tokens[C.tokens.length-1]; if(typeof l === 'number' || l === ')') C.tokens.push('×'); C.tokens.push('('); C.replace = true; }
  else if(k === ')'){ if(open() <= 0) return; if(C.active){ cPushNum(Number(C.entry)); C.active = false; } else if(isOp(C.tokens[C.tokens.length-1]) || C.tokens[C.tokens.length-1] === '(') return;
    C.tokens.push(')'); let depth = 0, i = C.tokens.length-1; for(; i>=0; i--){ if(C.tokens[i]===')') depth++; else if(C.tokens[i]==='('){ depth--; if(depth===0) break; } }
    try{ const p = cFmt(cEval(C.tokens.slice(i+1,-1))); if(p != null) C.entry = p; }catch(e){ if(e === 'div') return cErr(); } C.replace = true; }
  else if(k === '='){ if(C.active){ cPushNum(Number(C.entry)); C.active = false; }
    while(C.tokens.length && (isOp(C.tokens[C.tokens.length-1]) || C.tokens[C.tokens.length-1] === '(')) C.tokens.pop();
    if(C.tokens.length){ try{ const s = cFmt(cEval(C.tokens)); if(s == null) return cErr(); C.entry = s; }catch(e){ return cErr(); } C.tokens = []; }
    C.active = true; C.replace = true; }
  else if(k === 'C'){ C.entry = '0'; C.tokens = []; C.active = false; C.replace = true; C.err = false; }
  else if(k === 'CE'){ C.entry = '0'; C.active = false; C.replace = true; }
  else if(k === 'M+'){ const v = Number(C.entry); if(isFinite(v)) C.mem += v; C.replace = true; }
  else if(k === 'MR'){ C.entry = cFmt(C.mem) || '0'; C.active = true; C.replace = true; }
  else if(k === 'MC'){ C.mem = 0; }
  updCalc();
}
function updCalc(){ const d = document.getElementById('calcv'); if(d) d.textContent = C.entry; const m = document.getElementById('calcm'); if(m) m.textContent = C.mem ? 'M' : ''; }
function removeCalc(){ const c = document.getElementById('calc'); if(c) c.remove(); }
function toggleCalc(){ const r = S.run; r.calcOpen = !r.calcOpen; if(r.calcOpen) mountCalc(); else removeCalc(); const b = document.getElementById('calcbtn'); if(b) b.setAttribute('aria-pressed', r.calcOpen ? 'true':'false'); }
function mountCalc(){
  const r = S.run; const q = r && !r.intro && r.set.questions[r.set.idx];
  if(!q || r.review || TYPES[q.type].sec !== 'Q'){ removeCalc(); return; }
  let el = document.getElementById('calc');
  if(el){ refreshTransfer(); return; }
  const keys = ['MR','MC','M+','(',')','7','8','9','÷','C','4','5','6','×','CE','1','2','3','−','√','0','.','±','+','='];
  const head = h('div',{class:'calc-h'}, h('span',{text:'Calculator'}), h('button',{'aria-label':'Close calculator',text:'×',onclick:toggleCalc}));
  el = h('div',{class:'calc',id:'calc',role:'dialog','aria-label':'Calculator',tabindex:'-1'}, head,
    h('div',{class:'calc-d','aria-live':'polite'}, h('span',{class:'m',id:'calcm'}), h('span',{id:'calcv',text:C.entry})),
    h('div',{class:'calc-g'}, keys.map(k => h('button',{class: k === '=' ? 'eq' : '', text:k, 'aria-label': {'√':'Square root','±':'Change sign','CE':'Clear entry','C':'Clear all'}[k] || k, onclick:()=>calcPress(k)}))),
    h('button',{class:'btn calc-t',id:'calctr',text:'Transfer Display',onclick:()=>{ const rr = S.run, qq = rr.set.questions[rr.set.idx]; if(qq.type !== 'ne' || C.err) return; rr.set.answers[rr.set.idx] = C.entry; const inp = document.getElementById('numans'); if(inp) inp.value = C.entry; persist(); }}));
  const W = window.innerWidth, H = window.innerHeight;
  if(C.x == null){ C.x = Math.max(8, W - 280); C.y = Math.max(60, Math.min(120, H - 420)); }
  C.x = Math.min(Math.max(0, C.x), Math.max(0, W - 262)); C.y = Math.min(Math.max(0, C.y), Math.max(0, H - 80));
  el.style.left = C.x + 'px'; el.style.top = C.y + 'px';
  let drag = null;
  head.addEventListener('pointerdown', e => { if(e.target.tagName === 'BUTTON' || window.innerWidth <= 560) return; drag = {sx:e.clientX, sy:e.clientY, x:C.x, y:C.y}; head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', e => { if(!drag) return; C.x = Math.min(Math.max(0, drag.x + e.clientX - drag.sx), window.innerWidth - 60); C.y = Math.min(Math.max(0, drag.y + e.clientY - drag.sy), window.innerHeight - 40); el.style.left = C.x + 'px'; el.style.top = C.y + 'px'; });
  head.addEventListener('pointerup', () => { drag = null; });
  el.addEventListener('keydown', e => { const map = {'+':'+','-':'−','*':'×','/':'÷','Enter':'=','=':'=','Escape':'C','Backspace':'CE','.':'.','(':'(',')':')'};
    if(/^[0-9]$/.test(e.key)){ calcPress(e.key); e.preventDefault(); } else if(map[e.key]){ calcPress(map[e.key]); e.preventDefault(); } });
  document.body.append(el); refreshTransfer(); updCalc();
}
function refreshTransfer(){ const b = document.getElementById('calctr'); if(!b) return; const r = S.run; const q = r && r.set.questions[r.set.idx]; b.hidden = !(q && q.type === 'ne'); }


/* ---------------- boot ---------------- */
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ if(S.run){ flushQ(); flush(); S.run.qStart = null; } }
  else { if(S.run && S.run.qKey != null) S.run.qStart = Date.now(); if(S.view !== 'run' && S.view !== 'drill') render(); }
});
window.addEventListener('pagehide', () => { if(S.run){ flushQ(); flush(); } });
render();
(async () => { if(window.claude && typeof window.claude.use === 'function'){ try{ S.sample = await window.claude.use('sample'); }catch(e){ S.sample = null; } if(S.sample && S.view !== 'run' && S.view !== 'drill') renderKeep(); } })();
try{ if('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
})();
</script>
